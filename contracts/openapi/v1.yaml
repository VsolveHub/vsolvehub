        disputed_worker_details:
          readOnly: true
      required:
      - arrival_confirmed_at
      - checkout_missing
      - confirmed_at
      - dispute_note
      - disputed_worker_details
      - expected_count
      - flag_reason_code
      - flagged_for_review
      - id
      - present_count
      - responded_at
      - shift_ended_at
      - shortfall_count
      - standard_day_hours
      - status
    ShiftAttendanceRecordRequest:
      type: object
      description: |-
        The supervisor's one action for the day (`M2-BE-525`).

        One count, and deliberately **no per-worker roll call**. `SIM-02` refuses per-worker check-in
        and check-out with offline sync outright: the workers mostly do not carry smartphones, the
        supervisor does, and a per-worker product would be a device dependency the market cannot meet
        wearing the clothes of rigour.
      properties:
        present_count:
          type: integer
          minimum: 0
        shift_ended_at:
          type: string
          format: date-time
          nullable: true
      required:
      - present_count
    ShiftAttendanceResponseRequest:
      type: object
      description: Confirm the day or dispute it (`M2-BE-525`, `526`, `537`).
      properties:
        response:
          $ref: '#/components/schemas/AttendanceResponseEnum'
        shortfall_choice:
          default: ''
          oneOf:
          - $ref: '#/components/schemas/ShortfallChoiceEnum'
          - $ref: '#/components/schemas/BlankEnum'
        worker_details:
          type: array
          items:
            $ref: '#/components/schemas/DisputedWorkerRequest'
        note:
          type: string
          default: ''
          maxLength: 2000
      required:
      - response
    ShiftAttendanceStatusEnum:
      enum:
      - PENDING
      - SUPERVISOR_CONFIRMED
      - CUSTOMER_CONFIRMED
      - DISPUTED
      type: string
      description: |-
        * `PENDING` - Nothing recorded yet
        * `SUPERVISOR_CONFIRMED` - The supervisor recorded the day
        * `CUSTOMER_CONFIRMED` - The Customer agreed
        * `DISPUTED` - The Customer disputed the count
    ShiftDay:
      type: object
      description: |-
        One shift-day, whole: the day, the crew on it, the attendance and the settlement.

        One read rather than four, for the reason `RateCardStateSerializer` gives: the crew screen, the
        attendance screen and the settlement screen are the same screen at three moments of one
        evening, and four endpoints would let them disagree about which day the user is looking at.

        `attendance` and `settlement` are null until somebody touches the day — created lazily, because
        the engagement is opened inside a payment callback and four more inserts in that transaction
        are four more ways for a Customer's money to fail to confirm.
      properties:
        stage_id:
          type: string
          format: uuid
          readOnly: true
        engagement_id:
          type: string
          format: uuid
          readOnly: true
        position:
          type: integer
          readOnly: true
        day_label:
          type: string
          readOnly: true
        scheduled_on:
          type: string
          format: date
          readOnly: true
          nullable: true
        stage_status:
          type: string
          readOnly: true
        crew:
          type: array
          items:
            $ref: '#/components/schemas/StageCrewMember'
          readOnly: true
        attendance:
          allOf:
          - $ref: '#/components/schemas/ShiftAttendance'
          readOnly: true
          nullable: true
        settlement:
          allOf:
          - $ref: '#/components/schemas/DaySettlement'
          readOnly: true
          nullable: true
        per_worker_paise:
          type: integer
          readOnly: true
        standard_day_hours:
          type: integer
          readOnly: true
          nullable: true
        overtime_hourly_paise:
          type: integer
          readOnly: true
          nullable: true
        add_on_rates:
          type: object
          additionalProperties:
            type: integer
          readOnly: true
        server_now:
          type: string
          format: date-time
          readOnly: true
      required:
      - add_on_rates
      - attendance
      - crew
      - day_label
      - engagement_id
      - overtime_hourly_paise
      - per_worker_paise
      - position
      - scheduled_on
      - server_now
      - settlement
      - stage_id
      - stage_status
      - standard_day_hours
    ShiftExtraKindEnum:
      enum:
      - OVERTIME
      - ADD_ON
      type: string
      description: |-
        * `OVERTIME` - Hours past the published shift
        * `ADD_ON` - A published add-on from the rate card
    ShiftExtraRequest:
      type: object
      description: |-
        Ask the Customer to approve overtime or an add-on (`M2-BE-531`, `538`).

        **There is no amount field, and there never will be.** The vendor names what and how much of
        it; the server names the money, from the rate card frozen on the engagement at booking. A
        vendor who could type a number here could re-price a job the Customer booked at a published
        rate, which is precisely the on-site renegotiation ADR-0009 exists to leave nowhere to live.
      properties:
        kind:
          $ref: '#/components/schemas/ShiftExtraKindEnum'
        hours:
          type: integer
          maximum: 12
          minimum: 0
          default: 0
        add_on_code:
          type: string
          default: ''
          maxLength: 80
          pattern: ^[-a-zA-Z0-9_]+$
        worker_days:
          type: integer
          maximum: 200
          minimum: 0
          default: 0
        reason:
          type: string
          minLength: 1
          maxLength: 240
      required:
      - kind
      - reason
    ShortfallChoiceEnum:
      enum:
      - CONTINUE_SHORT
      - ADD_DAY
      - CANCEL_SHORTFALL
      type: string
      description: |-
        * `CONTINUE_SHORT` - Carry on with the crew that came
        * `ADD_DAY` - Ask the lead for an extra day to make it up
        * `CANCEL_SHORTFALL` - Cancel the missing workers, free
    SiteVisit:
      type: object
      description: |-
        One visit, in both its shapes.

        `is_plan_visit` is the field that decides how the whole record reads. A plan visit is paid for
        out of the A5 visit plan, occupies a share of it and opens an estimate window when it completes;
        an ad-hoc visit is a vendor-priced journey with none of that behind it. Publishing the flag
        rather than letting a client infer it from `fee_paise` keeps the two from being rendered as one
        thing with a different price.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/SiteVisitStatusEnum'
          readOnly: true
        is_plan_visit:
          type: boolean
          readOnly: true
        timezone:
          type: string
          description: |-
            The area's zone, or the platform's own as a last resort.

            A visit cannot exist on a requirement without a serviceable area — `_assert_submittable`
            refuses the submit — so the fallback is unreachable through any live path. It is written as
            the deployment's `TIME_ZONE` rather than a literal so that the one impossible case cannot
            become a second place Hyderabad is hardcoded.
          readOnly: true
        fee_paise:
          type: integer
          readOnly: true
        adjusts_against_final_price:
          type: boolean
          readOnly: true
        scheduled_for:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        duration_minutes:
          type: integer
          readOnly: true
          nullable: true
        arrival_confirmed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        arrival_method:
          allOf:
          - $ref: '#/components/schemas/VisitArrivalMethodEnum'
          readOnly: true
        completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        estimate_due_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        cancellation_reason_code:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
      required:
      - adjusts_against_final_price
      - arrival_confirmed_at
      - arrival_method
      - cancellation_reason_code
      - completed_at
      - duration_minutes
      - estimate_due_at
      - fee_paise
      - id
      - is_plan_visit
      - scheduled_for
      - status
      - timezone
    SiteVisitCompleteRequest:
      type: object
      properties:
        outcome_notes:
          type: string
          maxLength: 4000
    SiteVisitRequestRequest:
      type: object
      properties:
