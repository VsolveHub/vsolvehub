  /api/v1/partner/enquiries/{invitation_id}/visit-slots/:
    get:
      operationId: m2_visit_slot_list
      description: |-
        The visit times this vendor may confirm, drawn from the **same `carts.availability` grid the A1 technician flow reads** and narrowed to this one invited vendor. Same payload shape as `POST /api/v1/booking/windows/` minus `capacity`, which on a single-vendor grid would be a readout of that vendor's own diary depth.

        Each `id` is a **signed token** bound to this invitation and this start; it is the only thing the confirm command accepts, so a vendor cannot book a time the grid never offered or a slot drawn for a competitor. Tokens expire, so a picker left open must re-read rather than post a stale one.

        An ineligible vendor receives a grid in which every slot reads `NO_CAPACITY` rather than an error — that is the truth and it is renderable, where a refusal would leave the screen with nothing to say.
      parameters:
      - in: path
        name: invitation_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - M2 - Visit slots
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitSlotGrid'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: '`m2_policy_unavailable` when the owner has not set how long
            a visit takes for this service — the grid cannot be drawn at an invented
            width; `m2_visit_slot_unavailable` when the request has no serviceable
            area.'
    post:
      operationId: m2_visit_slot_confirm
      description: |-
        Commit to being on site at a specific time. **This is A5 acceptance** — it takes the quote slot and the soft capacity hold, and then a hard slot on the shared availability grid, so a visit and an A1 booking cannot double-book the same vendor.

        The **first** confirmation on an unpaid plan holds its slot and opens the Customer's checkout (`opens_plan_checkout: true`); the visit reads `REQUESTED` until that payment is verified, and the hold lapses harmlessly if it never is. Later slots on a paid plan are confirmed outright.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Stable opaque key for this logical command. Reuse it only when
          retrying the identical request; using it with a different payload returns
          409.
        required: true
      - in: path
        name: invitation_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - M2 - Visit slots
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitSlotConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VisitSlotConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VisitSlotConfirmRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitSlotConfirmation'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: '`m2_lifecycle_not_supported` — only project requests book
            visit slots.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: '`m2_visit_slot_unavailable` when the slot has gone, the token
            is stale or the start has passed — the availability grid''s exclusion
            constraint is the final authority and this is what losing that race reads
            as; `m2_visit_plan_required` when no plan is live; `m2_capacity_unavailable`
            and `m2_invitation_slots_exhausted` from the acceptance underneath.'
