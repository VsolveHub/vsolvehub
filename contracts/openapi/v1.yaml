      description: The Customer accepts the work on one stage. `AWAITING_REVIEW` →
        `APPROVED`. On a managed (A5) engagement this writes the vendor's earning
        **held** on the M1 payout rails and stamps `payout_release_due_at` — the dispute
        window — and the money becomes payable when that window closes. On `LEAD_ONLY`
        (A3) nothing is held because nothing was collected, so the stage goes straight
        to `RELEASED`.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Stable opaque key for this logical command. Reuse it only when
          retrying the identical request; using it with a different payload returns
          409.
        required: true
      - in: path
        name: stage_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - M2 - Stages
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngagementStage'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: '`m2_stage_disputed` while a dispute is open; `m2_stage_transition_not_allowed`
            when nothing has been submitted.'
  /api/v1/engagement-stages/{stage_id}/arrival/:
    post:
      operationId: m2_shift_arrival_confirm
      description: |-
        Confirm the crew arrived for this shift-day. **Non-OTP, and that is the default path in M2** rather than a degraded one — the start OTP is M3. Either party may record it: both were at the site.

        Three things happen in one transaction, because a half-started day is a support ticket: the arrival is stamped, the stage starts on the shared spine, and **on day one the booking fee is earned**. Crew must be named first — confirming that people arrived before saying who they are records nothing anybody can act on.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Stable opaque key for this logical command. Reuse it only when
          retrying the identical request; using it with a different payload returns
          409.
        required: true
      - in: path
        name: stage_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - M2 - Shift days
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftAttendance'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: '`m2_stage_transition_not_allowed` when no crew is assigned
            yet, the engagement is closed, or the stage is an A5 milestone.'
  /api/v1/engagement-stages/{stage_id}/attendance/:
    post:
      operationId: m2_shift_attendance_confirm
      description: |-
        Record **n of m present** for this shift-day. One tap, from the supervisor.

        There is deliberately **no per-worker check-in or check-out**: the workers mostly do not carry smartphones, the supervisor does, and a per-worker attendance product would be a device dependency this market cannot meet wearing the clothes of rigour. Per-worker detail is captured in exactly one place — a Customer dispute.

        The count *is* the evidence, so this hands the stage to the Customer through the ordinary spine and starts the same review clock every other stage runs on.

        `shift_ended_at` is optional and its absence is the point: a **missing check-out** settles at the agreed shift length and is flagged for review, not disputed. A supervisor whose crew left at six and who closed the day at nine has done nothing wrong, and the amount never depended on the end time — only overtime does, and that needs the Customer's approval either way.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Stable opaque key for this logical command. Reuse it only when
          retrying the identical request; using it with a different payload returns
          409.
        required: true
      - in: path
        name: stage_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - M2 - Shift days
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShiftAttendanceRecordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ShiftAttendanceRecordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ShiftAttendanceRecordRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftAttendance'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: '`m2_stage_transition_not_allowed` before arrival is confirmed,
            after the Customer has already answered, or for a count above the booked
            crew — an extra worker is a scope amendment at the published rate, not
            a bigger number in an attendance box.'
  /api/v1/engagement-stages/{stage_id}/attendance/response/:
    post:
      operationId: m2_shift_attendance_respond
      description: |-
        Confirm the supervisor's count or dispute it.

        **Confirm** approves the shift-day on the shared spine, which for a workforce engagement also releases it — there is no payout to hold because Vsolve collected nothing. On a shortfall `shortfall_choice` is **required**: continue short, ask for an extra day, or cancel the missing workers free. The day settles at the present workers' published rate whichever you choose — that is `M2-BE-537`, settlement per worker-day present and never per job — and the choice decides what happens to the missing worker-days rather than to the money for the ones who came.

        `ADD_DAY` records a request, and only that. The extra day is the lead's to offer through the amendment engine; appending a shift-day to somebody's week without their agreement would be the platform committing a vendor's labour.

        **Dispute** is the only place per-worker detail is ever captured. It stops the review clock and opens the Operations path; the settlement stays unconfirmed, because a count nobody agrees on is not an amount either. Nothing derives a third number from `worker_details` — it is the Customer's objection, and a case decides between them.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Stable opaque key for this logical command. Reuse it only when
          retrying the identical request; using it with a different payload returns
          409.
        required: true
      - in: path
        name: stage_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - M2 - Shift days
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShiftAttendanceResponseRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ShiftAttendanceResponseRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ShiftAttendanceResponseRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftAttendance'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: '`m2_stage_transition_not_allowed` before the supervisor has
            recorded the day, or when a shortfall was left without a choice.'
  /api/v1/engagement-stages/{stage_id}/correction/:
    post:
      operationId: m2_stage_request_correction
      description: 'Send a stage back to be done properly. `AWAITING_REVIEW` → `CORRECTION_REQUESTED`,
        and the review clock stops. **A correction is not an amendment**: it asks
        for the agreed work, it does not change what the agreed work is, and it moves
        no money. A Customer who wants something different is asking for a change
        order, which needs the vendor''s agreement.'
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Stable opaque key for this logical command. Reuse it only when
          retrying the identical request; using it with a different payload returns
