  /api/v1/partner/bookings/:
    get:
      operationId: partner_booking_list
      description: |-
        The Partner's own work, as a list.

        Published because the app previously had no way to ask "what jobs do I have?"
        — only `GET /partner/bookings/{id}/`, which needs an id the Partner had no
        screen to get one from.

        Scoped to the caller's own profile and takes no `partner_id`: the safest
        filter is the one a caller cannot supply, which is the same reasoning that
        keeps `booking_group_id` off the Partner booking projection.
      parameters:
      - in: query
        name: bucket
        schema:
          enum:
          - active
          - completed
          - cancelled
          type: string
          minLength: 1
        description: |-
          * `active` - active
          * `completed` - completed
          * `cancelled` - cancelled
      - in: query
        name: cursor
        schema:
          type: string
          minLength: 1
      tags:
      - Fulfilment
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerBookingPage'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
