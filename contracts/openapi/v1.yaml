      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingGroups'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
