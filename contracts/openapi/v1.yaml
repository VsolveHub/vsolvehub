          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
    post:
      operationId: m2_engagement_amendment_create
      description: |-
        The vendor asks to change the agreed work. **Routed through the M1 scope-amendment engine** — same status machine, same lines, same expiry rule — with two line kinds M2 adds because an engagement has no catalog task to price from.

        **The archetype fixes the shape and the pricing authority.** An A3 engagement takes a `TIME_EXTENSION`, priced by the **server** from the worker-day rate frozen at reconfirmation: the vendor names days, never money, because a vendor who could name the money could re-price a job the Customer already committed to. An A5 engagement takes a `CHANGE_ORDER`, priced by the vendor line by line, because a bespoke outcome has no catalog rate — and the server still sums the lines and rejects any client-supplied total. `amount_paise` is signed: negative removes scope.

        One live change request per engagement.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Stable opaque key for this logical command. Reuse it only when
          retrying the identical request; using it with a different payload returns
          409.
        required: true
      - in: path
        name: engagement_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - M2 - Amendments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EngagementAmendmentCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EngagementAmendmentCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EngagementAmendmentCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngagementAmendment'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: '`m2_amendment_not_actionable` when one is already open; `m2_stage_transition_not_allowed`
            for the wrong kind, an engagement that is not open to changes, or a reduction
            that is too large or too late; `m2_amendment_required` when the engagement
            carries no agreed daily rate to price an extension from; `m2_policy_unavailable`
            when the response window is unset — an amendment with no deadline is an
            open-ended claim on somebody''s money, so it is refused rather than invented.'
  /api/v1/engagements/{engagement_id}/cash-demand/:
    post:
      operationId: m2_cash_demand_report
      description: |-
        Report that a cash extra was demanded on site. The Customer's tap, and one tap is all it takes — `amount_claimed_paise` is optional because a required amount turns "they demanded extra" into a form, and the form is what stops it being reported.

        **It is never proof on its own.** The report is recorded immutably and a standing event is written against the lead — a fact with a date, not a penalty and not a score. If the owner has configured a removal threshold and a window and this vendor has crossed it, their A3 capability is suspended through the same command Operations uses, which routes their live engagements exactly as a human suspension does.

        While the threshold is unset nothing at all happens to the vendor and the reports still accumulate. That asymmetry is deliberate: refusing a Customer's report because a policy is unconfigured would punish them for an Operations gap, and ending somebody's trade on an invented number is not a decision code may take.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Stable opaque key for this logical command. Reuse it only when
          retrying the identical request; using it with a different payload returns
          409.
        required: true
