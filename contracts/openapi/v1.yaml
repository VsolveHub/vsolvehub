components:
  schemas:
    A1TaskLine:
      type: object
      properties:
        code:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        label:
          type: string
          readOnly: true
        unit_price:
          allOf:
          - $ref: '#/components/schemas/Money'
          readOnly: true
        marginal_duration_minutes:
          type: integer
          readOnly: true
      required:
      - code
      - label
      - marginal_duration_minutes
      - unit_price
    ActionEnum:
      enum:
      - KEEP_CUSTOMER
      - KEEP_SESSION
      - KEEP_BOTH
      type: string
      description: |-
        * `KEEP_CUSTOMER` - KEEP_CUSTOMER
        * `KEEP_SESSION` - KEEP_SESSION
        * `KEEP_BOTH` - KEEP_BOTH
    ActiveRole:
      type: object
      properties:
        active_role:
          type: string
          readOnly: true
          nullable: true
      required:
      - active_role
    Address:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        label:
          type: string
          maxLength: 60
        line1:
          type: string
          maxLength: 200
        line2:
          type: string
          maxLength: 200
        landmark:
          type: string
          maxLength: 160
        locality:
          type: string
          maxLength: 160
        city:
          type: string
          maxLength: 120
        state:
          type: string
          maxLength: 120
        postal_code:
          type: string
          maxLength: 12
        country_code:
          type: string
          maxLength: 2
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        source:
          $ref: '#/components/schemas/SourceEnum'
        confirmed_at:
          type: string
          format: date-time
          readOnly: true
        is_default:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - city
      - confirmed_at
      - created_at
      - id
      - label
      - latitude
      - line1
      - locality
      - longitude
      - postal_code
      - state
      - updated_at
    AddressRequest:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 60
        line1:
