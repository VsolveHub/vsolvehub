    SafetyIncident:
      type: object
      description: |-
        A first-class safety record (`M2-BE-530`). **Never a cancellation reason.**

        A job that has to end because a site is unsafe ends through cancellation *with* a safety report
        beside it, so both facts exist separately and either can be read without the other. Filing "a
        worker fell" as "job cancelled, site unsafe" is how a platform ends up unable to say, two years
        later, what was reported and what was done about it.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        engagement:
          type: string
          format: uuid
          readOnly: true
        stage:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        reporter_role:
          allOf:
          - $ref: '#/components/schemas/SafetyIncidentReporterRoleEnum'
          readOnly: true
        severity:
          allOf:
          - $ref: '#/components/schemas/SafetyIncidentSeverityEnum'
          readOnly: true
        category_code:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
          readOnly: true
        occurred_at:
          type: string
          format: date-time
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/SafetyIncidentStatusEnum'
          readOnly: true
        resolution_note:
          type: string
          readOnly: true
        resolved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - category_code
      - created_at
      - description
      - engagement
      - id
      - occurred_at
      - reporter_role
      - resolution_note
      - resolved_at
      - severity
      - stage
      - status
