components:
  schemas:
    A1TaskLine:
      type: object
      properties:
        code:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        label:
          type: string
          readOnly: true
        unit_price:
          allOf:
          - $ref: '#/components/schemas/Money'
          readOnly: true
        marginal_duration_minutes:
          type: integer
          readOnly: true
      required:
      - code
      - label
      - marginal_duration_minutes
      - unit_price
    ActionEnum:
      enum:
      - KEEP_CUSTOMER
      - KEEP_SESSION
      - KEEP_BOTH
      type: string
      description: |-
        * `KEEP_CUSTOMER` - KEEP_CUSTOMER
        * `KEEP_SESSION` - KEEP_SESSION
        * `KEEP_BOTH` - KEEP_BOTH
    ActiveRole:
      type: object
      properties:
        active_role:
          type: string
          readOnly: true
          nullable: true
      required:
      - active_role
    Address:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        label:
          type: string
          maxLength: 60
        line1:
          type: string
          maxLength: 200
        line2:
          type: string
          maxLength: 200
        landmark:
          type: string
          maxLength: 160
        locality:
          type: string
          maxLength: 160
        city:
          type: string
          maxLength: 120
        state:
          type: string
          maxLength: 120
        postal_code:
          type: string
          maxLength: 12
        country_code:
          type: string
          maxLength: 2
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        source:
          $ref: '#/components/schemas/SourceEnum'
        confirmed_at:
          type: string
          format: date-time
          readOnly: true
        is_default:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - city
      - confirmed_at
      - created_at
      - id
      - label
      - latitude
      - line1
      - locality
      - longitude
      - postal_code
      - state
      - updated_at
    AddressRequest:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 60
        line1:
          type: string
          minLength: 1
          maxLength: 200
        line2:
          type: string
          maxLength: 200
        landmark:
          type: string
          maxLength: 160
        locality:
          type: string
          minLength: 1
          maxLength: 160
        city:
          type: string
          minLength: 1
          maxLength: 120
        state:
          type: string
          minLength: 1
          maxLength: 120
        postal_code:
          type: string
          minLength: 1
          maxLength: 12
        country_code:
          type: string
          minLength: 1
          maxLength: 2
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        source:
          $ref: '#/components/schemas/SourceEnum'
        is_default:
          type: boolean
      required:
      - city
      - label
      - latitude
      - line1
      - locality
      - longitude
      - postal_code
      - state
    AmendmentApprovalResult:
      type: object
      properties:
        amendment:
          $ref: '#/components/schemas/ScopeAmendment'
        payment_attempt_id:
          type: string
          format: uuid
        amount_paise:
          type: integer
        currency:
          type: string
      required:
      - amendment
      - amount_paise
      - currency
      - payment_attempt_id
    ApiError:
      type: object
      properties:
        error:
          allOf:
          - $ref: '#/components/schemas/ApiErrorDetail'
          readOnly: true
      required:
      - error
    ApiErrorDetail:
      type: object
      properties:
        code:
          type: string
          readOnly: true
        message:
          type: string
          readOnly: true
        details:
          readOnly: true
          nullable: true
        retryable:
          type: boolean
          readOnly: true
        request_id:
          type: string
          readOnly: true
          nullable: true
      required:
      - code
      - details
      - message
      - request_id
      - retryable
    AssignedProfessional:
      type: object
      description: |-
        The person coming, as the Customer may see them.

        Deliberately thin. A Partner's phone number, documents and application are
        theirs; what a Customer needs is who is arriving and what they do. There is
        no rating here because the platform has no review model yet — publishing a
        number with nothing behind it would be worse than publishing none.
      properties:
        display_name:
          type: string
        headline:
          type: string
        experience_years:
          type: integer
      required:
      - display_name
      - experience_years
      - headline
    AssistedCheckoutCreateRequest:
      type: object
      properties:
        customer_id:
          type: string
          format: uuid
        quote_id:
          type: string
          format: uuid
        consent_purpose:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
        consent_version:
          type: string
          minLength: 1
          maxLength: 100
      required:
      - consent_purpose
      - consent_version
      - customer_id
      - quote_id
    AssistedStartRequestRequest:
      type: object
      description: |-
        The floor every state-changing fulfilment command sits on.

        `expected_version` is required, never defaulted. A command that would apply to whatever
        state it happens to find is the thing optimistic concurrency exists to prevent, and a
        default here would silently reintroduce it for every caller that forgot the field.
      properties:
        expected_version:
          type: integer
          minimum: 1
        outage_reason:
          type: string
          minLength: 1
          maxLength: 240
      required:
      - expected_version
      - outage_reason
    AuthenticatedSession:
      type: object
      properties:
        user:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        active_role:
          type: string
          readOnly: true
        session_expires_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - active_role
      - session_expires_at
      - user
    Booking:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        fulfilment_unit_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        reservation_id:
          type: string
          format: uuid
          readOnly: true
        partner_id:
          type: string
          format: uuid
          readOnly: true
        scheduled_start:
          type: string
          format: date-time
          readOnly: true
        estimated_duration_minutes:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - estimated_duration_minutes
      - fulfilment_unit_id
      - id
      - partner_id
      - reservation_id
      - scheduled_start
    BookingCancellationResult:
      type: object
      properties:
        booking:
          $ref: '#/components/schemas/CustomerBooking'
        refund_ids:
          type: array
          items:
            type: string
            format: uuid
      required:
      - booking
      - refund_ids
    BookingGroup:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/BookingGroupStatusEnum'
          readOnly: true
        version:
          type: integer
          readOnly: true
        confirmation_policy:
          allOf:
          - $ref: '#/components/schemas/ConfirmationPolicyEnum'
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
        server_now:
          type: string
          format: date-time
          readOnly: true
        recovery_action:
          allOf:
          - $ref: '#/components/schemas/RecoveryActionEnum'
          readOnly: true
        next_transition_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        checkout_id:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        checkout_version:
          type: integer
          nullable: true
          readOnly: true
        order_id:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        units:
          type: array
          items:
            $ref: '#/components/schemas/FulfilmentUnit'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - checkout_id
      - checkout_version
      - confirmation_policy
      - created_at
      - expires_at
      - id
      - next_transition_at
      - order_id
      - recovery_action
      - server_now
      - status
      - units
      - updated_at
      - version
    BookingGroupCancelRequest:
      type: object
      properties:
        expected_version:
          type: integer
          minimum: 1
      required:
      - expected_version
    BookingGroupPage:
      type: object
      properties:
        next:
          type: string
          format: uri
          nullable: true
        previous:
          type: string
          format: uri
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/BookingGroup'
      required:
      - next
      - previous
      - results
    BookingGroupStatusEnum:
      enum:
      - CONFIRMED
      - MATCHING
      - PARTIALLY_HELD
      - ALL_UNITS_HELD
      - PAYMENT_PENDING
      - BOOKED
      - COMPLETED
      - REPLAN_REQUIRED
      - CANCELLED
      - EXPIRED
      - FAILED
      type: string
      description: |-
        * `CONFIRMED` - Confirmed
        * `MATCHING` - Matching
        * `PARTIALLY_HELD` - Partially held
        * `ALL_UNITS_HELD` - All units held
        * `PAYMENT_PENDING` - Payment pending
        * `BOOKED` - Booked
        * `COMPLETED` - Completed
        * `REPLAN_REQUIRED` - Replan required
        * `CANCELLED` - Cancelled
        * `EXPIRED` - Expired
        * `FAILED` - Failed
    BookingStatusEnum:
      enum:
      - CONFIRMED
      - EN_ROUTE
      - ARRIVED
      - IN_PROGRESS
      - COMPLETION_SUBMITTED
      - COMPLETED
      - PARTIALLY_COMPLETED
      - DISPUTED
      - RECOVERY_REQUIRED
      - ABORTED
      - CANCELLED
      type: string
      description: |-
        * `CONFIRMED` - Confirmed
        * `EN_ROUTE` - En route
        * `ARRIVED` - Arrived
        * `IN_PROGRESS` - In progress
        * `COMPLETION_SUBMITTED` - Completion submitted
        * `COMPLETED` - Completed
        * `PARTIALLY_COMPLETED` - Partially completed
        * `DISPUTED` - Disputed
        * `RECOVERY_REQUIRED` - Recovery required
        * `ABORTED` - Aborted
        * `CANCELLED` - Cancelled
    BookingStatusHistory:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        command:
          type: string
          readOnly: true
        from_status:
          type: string
          readOnly: true
        to_status:
          type: string
          readOnly: true
        reason:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - command
      - created_at
      - from_status
      - id
      - reason
      - to_status
    BookingWindow:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        starts_at:
          type: string
          format: date-time
          readOnly: true
        ends_at:
          type: string
          format: date-time
          readOnly: true
        is_available:
          type: boolean
          readOnly: true
        unavailable_reason:
          readOnly: true
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/UnavailableReasonEnum'
          - $ref: '#/components/schemas/NullEnum'
        capacity:
          type: integer
          readOnly: true
      required:
      - capacity
      - ends_at
      - id
      - is_available
      - starts_at
      - unavailable_reason
    BookingWindowDay:
      type: object
      properties:
        date:
          type: string
          format: date
          readOnly: true
        is_today:
          type: boolean
          readOnly: true
        windows:
          type: array
          items:
            $ref: '#/components/schemas/BookingWindow'
          readOnly: true
      required:
      - date
      - is_today
      - windows
    BookingWindows:
      type: object
      properties:
        server_now:
          type: string
          format: date-time
          readOnly: true
        estimated_duration_minutes:
          type: integer
          readOnly: true
        availability_is_preliminary:
          type: boolean
          readOnly: true
        timezone:
          type: string
          readOnly: true
        days:
          type: array
          items:
            $ref: '#/components/schemas/BookingWindowDay'
          readOnly: true
      required:
      - availability_is_preliminary
      - days
      - estimated_duration_minutes
      - server_now
      - timezone
    BookingWindowsRequestRequest:
      type: object
      properties:
        address_id:
          type: string
          format: uuid
        group_key:
          type: string
          minLength: 1
      required:
      - address_id
    CancellationBand:
      type: object
      properties:
        code:
          type: string
          readOnly: true
        condition_text:
          type: string
          readOnly: true
        fee:
          allOf:
          - $ref: '#/components/schemas/Money'
          readOnly: true
      required:
      - code
      - condition_text
      - fee
    CancellationPolicy:
      type: object
      properties:
        code:
          type: string
          readOnly: true
        version:
          type: integer
          readOnly: true
        bands:
          type: array
          items:
            $ref: '#/components/schemas/CancellationBand'
          readOnly: true
      required:
      - bands
      - code
      - version
    Cart:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        version:
          type: integer
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItemDetail'
          readOnly: true
        updated_at:
          type: string
          format: date-time
