  /api/v1/site-visits/{site_visit_id}/arrival/:
    post:
      operationId: m2_site_visit_arrival_confirm
      description: Record that the vendor is on site. Either party may confirm it.
        M2 uses the **non-OTP fallback** as the default path rather than as a degraded
        one — the start OTP is M3 activation — and `arrival_method` is stored so every
        historical arrival still says truthfully how it was proved once the OTP path
        is switched on.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Stable opaque key for this logical command. Reuse it only when
          retrying the identical request; using it with a different payload returns
          409.
        required: true
      - in: path
        name: site_visit_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - M2 - Site visits
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteVisit'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: '`m2_requirement_transition_not_allowed` when the visit is
            not scheduled — a visit whose plan payment has not been verified is still
            held, not scheduled, and nobody has arrived at it.'
  /api/v1/site-visits/{site_visit_id}/complete/:
    post:
      operationId: m2_site_visit_complete
      description: |-
        Only the vendor closes a visit, because only the vendor attended it.

        Scheduling takes both parties; completion is a report of what happened, and the party that
        travelled is the one who can make it. A Customer who disagrees with the outcome has the
        clarification timeline and, from Wave C6, a case — not a competing completion.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Stable opaque key for this logical command. Reuse it only when
          retrying the identical request; using it with a different payload returns
          409.
        required: true
      - in: path
        name: site_visit_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - M2 - Site visits
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteVisitCompleteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SiteVisitCompleteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SiteVisitCompleteRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteVisit'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: '`m2_requirement_transition_not_allowed` when the visit was
            never scheduled. A visit with no agreed time cannot have happened.'
  /api/v1/site-visits/{site_visit_id}/no-show/:
    post:
      operationId: m2_site_visit_no_show_report
      description: |-
        Report that the other party did not turn up. **You report the other side's absence, never your own** — a Customer reports `VENDOR`, a vendor reports `CUSTOMER` — because the report is a statement by the party who was there.

        The two settle differently. A vendor no-show costs the Customer nothing: the slot goes back to owing a **free replacement visit**. A customer no-show still pays the vendor their visit payout — they travelled — and only the platform's share is in question, which is an owner decision read fail-closed.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Stable opaque key for this logical command. Reuse it only when
          retrying the identical request; using it with a different payload returns
          409.
        required: true
      - in: path
        name: site_visit_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - M2 - Site visits
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitNoShowRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VisitNoShowRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VisitNoShowRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteVisit'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: '`m2_requirement_transition_not_allowed` when a party reports
            its own no-show.'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: '`m2_requirement_transition_not_allowed` when the visit was
            never scheduled; `m2_policy_unavailable` when the owner has not decided
            how a customer no-show settles the platform share.'
  /api/v1/site-visits/{site_visit_id}/schedule/:
    post:
      operationId: m2_site_visit_schedule
      description: 'Put a time on a requested visit, or move one already scheduled.
        Either party may call it: the vendor proposes a slot they can travel in, the
        Customer confirms a time somebody will be on site, and neither can do it alone.'
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Stable opaque key for this logical command. Reuse it only when
          retrying the identical request; using it with a different payload returns
          409.
        required: true
      - in: path
        name: site_visit_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - M2 - Site visits
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteVisitScheduleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SiteVisitScheduleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SiteVisitScheduleRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteVisit'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: '`m2_requirement_transition_not_allowed` once the visit is
            completed or cancelled.'
  /api/v1/tax-documents/{document_id}/:
    get:
      operationId: tax_documents_retrieve
      parameters:
      - in: path
        name: document_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
