      operationId: m2_crew_offer_decline
      description: |-
        Pass on a crew offer. **The reason is required and is read by the decline-rate alarm.** `RATE_TOO_LOW` is the answer that matters most: a published rate below the street rate makes leads decline everything and the instant product dies quietly, so a sustained decline rate pages Operations rather than appearing in a monthly report.

        Declining releases the slot and moves the cascade to its next, wider wave.
      parameters:
