              schema:
                $ref: '#/components/schemas/EngagementStage'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/engagement-stages/{stage_id}/evidence/:
    post:
      operationId: m2_stage_evidence_finalize
      description: 'Verify the object that arrived against the intent and record it
        as evidence. `processing_status` lands `PENDING`: the bytes are the ones the
        client promised, and whether they are safe is a separate question a scanner
        answers. Two concurrent finalizes of one intent produce one evidence row.'
      parameters:
      - in: path
        name: stage_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - M2 - Stages
      requestBody:
