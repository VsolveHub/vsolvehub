    PartnerBalance:
      type: object
      description: |-
        What is owed, by state.

        Four numbers rather than one, because "you have ₹4,200" is not true in any useful sense when
        ₹1,800 of it is held behind an open quality case. A Partner planning their week needs to know
        which part of it is actually coming.
      properties:
        pending_paise:
          type: integer
        available_paise:
          type: integer
        reserved_paise:
          type: integer
        paid_paise:
          type: integer
        currency:
          type: string
        server_now:
          type: string
          format: date-time
      required:
      - available_paise
      - currency
      - paid_paise
      - pending_paise
      - reserved_paise
      - server_now
    PartnerBooking:
      type: object
      description: |-
        The same visit, as the Partner assigned to it sees it.

        Deliberately does not carry `order_id`, any sibling unit, or any money beyond the per-task
        amounts the Partner is working to. The Booking Group is not addressable from here at all:
        `G7` requires that a Partner cannot reach a sibling unit's scope or earnings, and the
        cheapest way to guarantee that is to never publish the identifier that would let them try.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        fulfilment_unit_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/BookingStatusEnum'
          readOnly: true
        version:
          type: integer
          readOnly: true
        scheduled_start:
          type: string
          format: date-time
          readOnly: true
        estimated_duration_minutes:
          type: integer
          readOnly: true
        en_route_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        arrived_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        customer_unavailable_wait_started_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        late_declared_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        work_tasks:
          type: array
          items:
            $ref: '#/components/schemas/WorkTask'
          readOnly: true
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/WorkEvidence'
          readOnly: true
        active_amendment:
          allOf:
          - $ref: '#/components/schemas/ScopeAmendment'
          nullable: true
          readOnly: true
        earning:
          allOf:
          - $ref: '#/components/schemas/PartnerBookingEarning'
          nullable: true
          readOnly: true
        server_now:
          type: string
          readOnly: true
      required:
      - active_amendment
      - arrived_at
      - customer_unavailable_wait_started_at
      - earning
      - en_route_at
      - estimated_duration_minutes
      - evidence
      - fulfilment_unit_id
      - id
      - late_declared_at
      - scheduled_start
      - server_now
      - status
      - version
      - work_tasks
