        description: Filter by case kind.
      - in: query
        name: overdue
        schema:
          type: boolean
        description: Only cases past their SLA deadline.
      - in: query
        name: owner
        schema:
          type: string
        description: '`me` for cases the caller has claimed, `unclaimed` for cases
          no one has. Resolved against the session, never a caller-supplied id.'
