          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CartItemInputRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItem'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/cart/items/:
    post:
      operationId: cart_items_create
      tags:
      - Cart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemCreateRequest'
          application/x-www-form-urlencoded:
            schema:
