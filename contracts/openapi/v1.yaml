  /api/v1/partner/crew-offers/{invitation_id}/accept/:
    post:
      operationId: m2_crew_offer_accept
      description: |-
        Take the job at the published rate. **First accept wins** — a rate-card request has exactly one slot, so the second lead to arrive is refused with `m2_invitation_slots_exhausted` rather than losing a race.

        Accepting takes a soft capacity hold for the requested dates, records this lead's acceptance of the published card, and holds the job while the Customer pays the booking fee. If they never pay, the hold lapses, the vendor keeps their standing, and the cascade moves on.

        Refused with `m2_roster_insufficient` when the lead's **verified** roster is smaller than the headcount. Crews are never aggregated across vendors: one lead is accountable for the whole crew.
      parameters:
      - in: path
        name: invitation_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - M2 - Rate card
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrewOfferAccepted'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: '`m2_roster_insufficient`, `m2_invitation_slots_exhausted`
            when another lead took the job, `m2_capacity_unavailable` when this lead
            is already committed on those dates, or `m2_invitation_expired`.'
  /api/v1/partner/crew-offers/{invitation_id}/decline/:
