        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProposalCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProposalCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProposalCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposal'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: '`m2_proposal_invalid_shape` when the quote does not match
            the requirement''s lifecycle or the stage totals do not reconcile; `m2_proposal_below_wage_floor`
            when an A3 daily rate is under the statutory floor for the requirement''s
            own state and skill. **Neither the state nor the skill is accepted from
            the caller** — both are derived from the requirement, so a vendor cannot
            influence the floor they are measured against.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: '`m2_wage_floor_unavailable` when Operations has not mapped
            this variant to a wage-floor skill, has not set a state code on the service
            area, or has loaded no floor for that pair. This **fails closed** — an
            A3 quote is refused rather than accepted unchecked, because brokering
            labour below the statutory minimum is a violation the platform carries,
            not only the vendor.'
