                $ref: '#/components/schemas/ApiError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: '`m2_stage_not_funded` on an unfunded A5 stage; `m2_stage_transition_not_allowed`
            from any other status, or before work has been cleared to start.'
  /api/v1/engagement-stages/{stage_id}/submit/:
    post:
      operationId: m2_stage_evidence_submit
      description: Hand the stage to the Customer for review. `IN_PROGRESS` → `AWAITING_REVIEW`,
        and the moment the review clock starts. The note is required and is stored
        as its own append-only evidence row rather than as a field on the stage, so
        a correction cycle leaves both accounts readable — what the vendor said the
        first time and what they said after the Customer pushed back. Resubmitting
        after a correction restarts the review window from zero, because the Customer
        is looking at different evidence.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Stable opaque key for this logical command. Reuse it only when
          retrying the identical request; using it with a different payload returns
          409.
        required: true
