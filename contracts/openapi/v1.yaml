    CrewOfferAccepted:
      type: object
      description: |-
        The job a lead just took, at **their** disclosure — not the Customer's booking row.

        This replaces `RateCardBooking` on the accept response, and the replacement is the point.
        `RateCardBooking` carries `total_customer_paise`, `booking_fee_paise` and `day_rate_paise` —
        the Customer's all-inclusive numbers, which include this platform's fee — and the crew-offer
        *list* is scrupulous about withholding all three. Returning them one call later, at the moment
        the lead commits, left the discipline resting on the client choosing not to render them.
        ADR-0009 fixes the offer screen as "what they receive per day for the requested crew"; a lead
        shown the Customer's total would reasonably expect to receive it, and that expectation is an
        argument on a site.

        Everything a lead needs to work the job is here. Nothing that describes what Vsolve charges is.
      properties:
        booking_id:
          type: string
          format: uuid
          readOnly: true
        requirement_id:
          type: string
          format: uuid
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/RateCardBookingStatusEnum'
          readOnly: true
        headcount:
          type: integer
          readOnly: true
        days:
          type: integer
          readOnly: true
        lead_day_receipt_paise:
          type: integer
          readOnly: true
        lead_receipt_paise:
          type: integer
          readOnly: true
        standard_day_hours:
          type: integer
          readOnly: true
        overtime_hourly_paise:
          type: integer
          readOnly: true
        add_on_rates:
          type: object
          additionalProperties:
            type: integer
          readOnly: true
        inclusions:
          type: array
          items:
            type: string
          readOnly: true
        hold_expires_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        requested_start:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        server_now:
          type: string
          format: date-time
          readOnly: true
      required:
      - add_on_rates
      - booking_id
      - days
      - headcount
      - hold_expires_at
      - inclusions
      - lead_day_receipt_paise
      - lead_receipt_paise
      - overtime_hourly_paise
      - requested_start
      - requirement_id
      - server_now
      - standard_day_hours
      - status
