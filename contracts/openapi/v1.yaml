components:
  schemas:
    ActiveRole:
      type: object
      properties:
        active_role:
          type: string
          readOnly: true
          nullable: true
      required:
      - active_role
    Address:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        label:
          type: string
          maxLength: 60
        line1:
          type: string
          maxLength: 200
        line2:
          type: string
          maxLength: 200
        landmark:
          type: string
          maxLength: 160
        locality:
          type: string
          maxLength: 160
        city:
          type: string
          maxLength: 120
        state:
          type: string
          maxLength: 120
        postal_code:
          type: string
          maxLength: 12
        country_code:
          type: string
          maxLength: 2
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        source:
          $ref: '#/components/schemas/SourceEnum'
        confirmed_at:
          type: string
          format: date-time
          readOnly: true
        is_default:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - city
      - confirmed_at
      - created_at
      - id
      - label
      - latitude
      - line1
      - locality
      - longitude
      - postal_code
      - state
      - updated_at
    AddressRequest:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 60
        line1:
          type: string
          minLength: 1
          maxLength: 200
        line2:
          type: string
          maxLength: 200
        landmark:
          type: string
          maxLength: 160
        locality:
          type: string
          minLength: 1
          maxLength: 160
        city:
          type: string
          minLength: 1
          maxLength: 120
        state:
          type: string
          minLength: 1
          maxLength: 120
        postal_code:
          type: string
          minLength: 1
          maxLength: 12
        country_code:
          type: string
          minLength: 1
          maxLength: 2
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        source:
          $ref: '#/components/schemas/SourceEnum'
        is_default:
          type: boolean
      required:
      - city
      - label
      - latitude
      - line1
      - locality
      - longitude
      - postal_code
      - state
    ApiError:
      type: object
      properties:
        error:
          allOf:
          - $ref: '#/components/schemas/ApiErrorDetail'
          readOnly: true
      required:
      - error
    ApiErrorDetail:
      type: object
      properties:
        code:
          type: string
          readOnly: true
        message:
          type: string
          readOnly: true
        details:
          readOnly: true
          nullable: true
        retryable:
          type: boolean
          readOnly: true
        request_id:
          type: string
          readOnly: true
          nullable: true
      required:
      - code
      - details
      - message
      - request_id
      - retryable
    AssistedCheckoutCreateRequest:
      type: object
      properties:
        customer_id:
          type: string
          format: uuid
        quote_id:
          type: string
          format: uuid
        consent_purpose:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
        consent_version:
          type: string
          minLength: 1
          maxLength: 100
      required:
      - consent_purpose
      - consent_version
      - customer_id
      - quote_id
    AuthenticatedSession:
      type: object
      properties:
        user:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        active_role:
          type: string
          readOnly: true
        session_expires_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - active_role
      - session_expires_at
      - user
    CartItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        variant_id:
          type: string
          format: uuid
          readOnly: true
        quantity:
          type: integer
          readOnly: true
        scope_schema_snapshot:
          readOnly: true
      required:
      - id
      - quantity
      - scope_schema_snapshot
      - variant_id
    CartItemInputRequest:
      type: object
      properties:
        variant_id:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
        scope:
          type: object
          additionalProperties: {}
      required:
      - quantity
      - variant_id
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        icon_key:
          type: string
          readOnly: true
        subcategories:
          type: array
          items:
            $ref: '#/components/schemas/Subcategory'
          readOnly: true
      required:
      - description
      - icon_key
      - id
      - name
      - slug
      - subcategories
