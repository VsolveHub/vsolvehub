  /api/v1/proposals/:
    get:
      operationId: m2_proposal_list
      description: 'Every quote this vendor has submitted, newest first. **This closes
        the largest hole in the Partner surface**: until 1.24.0 a vendor could submit
        a quote and read it back only by remembering its id, so withdraw, the six
        proposal states and the whole supersession trace ended when the tab closed.'
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
          minLength: 1
      - in: query
        name: requirement
        schema:
          type: string
          format: uuid
        description: Narrow to one request. The result set is scoped to the caller's
          own proposals first, so this filters a set they already own and cannot be
          used to discover a request they were never invited to.
      tags:
      - M2 - Proposals
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalPage'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
    post:
      operationId: m2_proposal_submit
      description: 'Submit a quote, or a revision that supersedes this vendor''s previous
        one. Proposals are append-only: a revision never overwrites what the Customer
        was originally offered. The archetype decides which fields are required and
        the server enforces it.'
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Stable opaque key for this logical command. Reuse it only when
          retrying the identical request; using it with a different payload returns
          409.
        required: true
      tags:
      - M2 - Proposals
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProposalCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProposalCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProposalCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposal'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: '`m2_proposal_invalid_shape` when the quote does not match
            the requirement''s lifecycle or the stage totals do not reconcile; `m2_proposal_below_wage_floor`
            when an A3 daily rate is under the statutory floor for the requirement''s
            own state and skill. **Neither the state nor the skill is accepted from
            the caller** — both are derived from the requirement, so a vendor cannot
            influence the floor they are measured against.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: '`m2_wage_floor_unavailable` when Operations has not mapped
            this variant to a wage-floor skill, has not set a state code on the service
            area, or has loaded no floor for that pair. This **fails closed** — an
            A3 quote is refused rather than accepted unchecked, because brokering
            labour below the statutory minimum is a violation the platform carries,
            not only the vendor.'
