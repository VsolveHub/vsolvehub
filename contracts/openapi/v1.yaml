            schema:
              $ref: '#/components/schemas/RequirementSubmitRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RequirementSubmitRequest'
      security:
      - cookieAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementSubmitted'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: '`m2_requirement_duplicate` (show the duplicate and offer a
            merge before allowing `allow_duplicate`), `m2_requirement_expired`, or
            `idempotency_in_progress` — wait and re-read, never resend under a new
            key.'
  /api/v1/requirements/{requirement_id}/timeline/:
    get:
      operationId: m2_requirement_timeline
      parameters:
      - in: path
        name: requirement_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
