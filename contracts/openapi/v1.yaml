              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/engagement-stages/{stage_id}/evidence/uploads/:
    post:
      operationId: m2_stage_evidence_upload_create
      description: A signed, short-lived upload URL for one evidence file, plus the
        intent id to finalize against. The server names the object key and records
        the size, media type and SHA-256 it expects; finalization fetches the object
        back and compares. Without the intent row, 'verify the upload' would mean
        'believe the client'. `NOTE` is not a kind here — a note carries no file and
        is submitted with the stage.
      parameters:
      - in: path
        name: stage_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - M2 - Stages
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StageEvidenceUploadRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StageEvidenceUploadRequestRequest'
