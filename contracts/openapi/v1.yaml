  /api/v1/site-visits/{site_visit_id}/complete/:
    post:
      operationId: m2_site_visit_complete
      description: |-
        Only the vendor closes a visit, because only the vendor attended it.

        Scheduling takes both parties; completion is a report of what happened, and the party that
        travelled is the one who can make it. A Customer who disagrees with the outcome has the
        clarification timeline and, from Wave C6, a case — not a competing completion.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Stable opaque key for this logical command. Reuse it only when
          retrying the identical request; using it with a different payload returns
          409.
        required: true
      - in: path
        name: site_visit_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - M2 - Site visits
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteVisitCompleteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SiteVisitCompleteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SiteVisitCompleteRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteVisit'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: '`m2_requirement_transition_not_allowed` when the visit was
            never scheduled. A visit with no agreed time cannot have happened.'
  /api/v1/site-visits/{site_visit_id}/schedule/:
    post:
      operationId: m2_site_visit_schedule
      description: 'Put a time on a requested visit, or move one already scheduled.
        Either party may call it: the vendor proposes a slot they can travel in, the
        Customer confirms a time somebody will be on site, and neither can do it alone.'
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Stable opaque key for this logical command. Reuse it only when
          retrying the identical request; using it with a different payload returns
          409.
        required: true
      - in: path
        name: site_visit_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - M2 - Site visits
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteVisitScheduleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SiteVisitScheduleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SiteVisitScheduleRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteVisit'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: '`m2_requirement_transition_not_allowed` once the visit is
            completed or cancelled.'
