  /api/v1/engagements/{engagement_id}/amendments/:
    get:
      operationId: m2_engagement_amendment_list
      description: Every change request on this engagement, newest first. Both parties
        read it.
      parameters:
      - in: path
        name: engagement_id
        schema:
          type: string
          format: uuid
        required: true
