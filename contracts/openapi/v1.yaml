openapi: 3.0.3
info:
  title: Vsolve Hub API
  version: 1.5.0
  description: Authoritative API for Vsolve Hub customer, partner and operations clients.
paths:
  /api/v1/addresses/:
    get:
      operationId: addresses_list
      tags:
      - Addresses
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Address'
          description: ''
    post:
      operationId: addresses_create
      tags:
      - Addresses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddressRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddressRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/addresses/{address_id}/:
    get:
      operationId: addresses_retrieve
      parameters:
      - in: path
        name: address_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Addresses
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
    patch:
      operationId: addresses_partial_update
      parameters:
      - in: path
        name: address_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Addresses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAddressRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAddressRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAddressRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
    delete:
      operationId: addresses_destroy
      parameters:
      - in: path
        name: address_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Addresses
      security:
      - cookieAuth: []
      responses:
        '204':
          description: Address archived.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/auth/csrf/:
    get:
      operationId: auth_csrf_retrieve
      tags:
      - Authentication
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
              examples:
                CSRFBootstrap:
                  value:
                    csrf_token: masked-csrf-token
                  summary: CSRF bootstrap
          description: ''
  /api/v1/auth/finance/step-up/:
    post:
      operationId: auth_finance_step_up_create
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepUpSession'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      tags:
      - Authentication
      security:
      - cookieAuth: []
      responses:
        '204':
          description: The current session was revoked.
  /api/v1/auth/otp/request/:
    post:
      operationId: auth_otp_request_create
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OtpRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OtpRequestRequest'
        required: true
      security:
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpIssued'
              examples:
                OTPIssued:
                  value:
                    challenge_id: 6d8cd4d8-c50a-4cb2-85e8-0357ee735cc6
                    expires_in_seconds: 300
                    resend_after_seconds: 60
                    code_length: 6
                    development_code: null
                  summary: OTP issued
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                OTPRateLimited:
                  value:
                    error:
                      code: throttled
                      message: Too many code requests. Try again when the countdown
                        ends.
                      details:
                        retry_after_seconds: 47
                      retryable: true
                      request_id: req_example
                  summary: OTP rate limited
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/auth/otp/verify/:
    post:
      operationId: auth_otp_verify_create
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedSession'
              examples:
                AuthenticatedCustomer:
                  value:
                    user:
                      id: f26419bd-c768-4ddb-bff3-4cc405fdbf52
                      phone_number: '+919876543210'
                      full_name: ''
                      email: ''
                      roles:
                      - customer
                    active_role: customer
                    session_expires_at: '2026-09-01T12:00:00Z'
                  summary: Authenticated customer
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/auth/privacy/consents/:
    post:
      operationId: auth_privacy_consents_create
      tags:
      - Privacy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentReceiptCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConsentReceiptCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConsentReceiptCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentReceipt'
          description: ''
  /api/v1/auth/privacy/preferences/:
    get:
      operationId: auth_privacy_preferences_list
      tags:
      - Privacy
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommunicationPreference'
          description: ''
    put:
      operationId: auth_privacy_preferences_update
      tags:
      - Privacy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommunicationPreferenceRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CommunicationPreferenceRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CommunicationPreferenceRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationPreference'
          description: ''
  /api/v1/auth/privacy/requests/:
    get:
      operationId: auth_privacy_requests_list
      tags:
      - Privacy
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PrivacyRequest'
          description: ''
    post:
      operationId: auth_privacy_requests_create
      tags:
      - Privacy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivacyRequestCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PrivacyRequestCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PrivacyRequestCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacyRequest'
          description: ''
  /api/v1/auth/roles/switch/:
    post:
      operationId: auth_roles_switch_create
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleSwitchRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RoleSwitchRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RoleSwitchRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveRole'
          description: ''
  /api/v1/auth/session/:
    get:
      operationId: auth_session_retrieve
      tags:
      - Authentication
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionState'
              examples:
                SignedOut:
                  value:
                    user: null
                    active_role: null
                    session_expires_at: null
                  summary: Signed out
                AuthenticatedCustomer:
                  value:
                    user:
                      id: f26419bd-c768-4ddb-bff3-4cc405fdbf52
                      phone_number: '+919876543210'
                      full_name: ''
                      email: ''
                      roles:
                      - customer
                    active_role: customer
                    session_expires_at: '2026-09-01T12:00:00Z'
                  summary: Authenticated customer
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                SessionExpired:
                  value:
                    error:
                      code: session_expired
                      message: Session is no longer active.
                      details:
                        message: Session is no longer active.
                        code: session_expired
                      retryable: false
                      request_id: req_example
                  summary: Session expired
          description: ''
  /api/v1/auth/sessions/:
    get:
      operationId: auth_sessions_list
      tags:
      - Authentication
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSession'
          description: ''
  /api/v1/auth/sessions/{session_id}/:
    delete:
      operationId: auth_sessions_destroy
      parameters:
      - in: path
        name: session_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Authentication
      security:
      - cookieAuth: []
      responses:
        '204':
          description: The selected session was revoked.
  /api/v1/cart/:
    get:
      operationId: cart_retrieve
      tags:
      - Cart
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItem'
          description: ''
    put:
      operationId: cart_update
      tags:
      - Cart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CartItemInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CartItemInputRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItem'
          description: ''
  /api/v1/categories/:
    get:
      operationId: categories_list
      tags:
      - Catalog
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
          description: ''
  /api/v1/categories/{category_slug}/services/:
    get:
      operationId: categories_services_list
      parameters:
      - in: path
        name: category_slug
        schema:
          type: string
        required: true
      tags:
      - Catalog
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceCard'
          description: ''
  /api/v1/checkouts/:
    post:
      operationId: checkouts_create
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Stable opaque key for this logical command. Reuse it only when
          retrying the identical request; using it with a different payload returns
          409.
        required: true
      tags:
      - Checkout
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CheckoutCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CheckoutCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkout'
          description: ''
  /api/v1/checkouts/{checkout_id}/search/:
    post:
      operationId: checkouts_search_create
      parameters:
      - in: path
        name: checkout_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Checkout
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
          description: ''
  /api/v1/checkouts/{checkout_id}/search/advance/:
    post:
      operationId: checkouts_search_advance_create
      parameters:
      - in: path
        name: checkout_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Checkout
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
          description: ''
  /api/v1/geocoding/reverse/:
    post:
      operationId: geocoding_reverse_create
      tags:
      - Locations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReverseGeocodeRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReverseGeocodeRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReverseGeocodeRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReverseGeocodeResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/health/live/:
    get:
      operationId: health_live_retrieve
      tags:
      - Health
      security:
      - {}
      responses:
        '200':
          description: The API process is running.
  /api/v1/health/ready/:
    get:
      operationId: health_ready_retrieve
      tags:
      - Health
      security:
      - {}
      responses:
        '200':
          description: Required dependencies are reachable.
        '503':
          description: One or more required dependencies are unavailable.
  /api/v1/operations/assisted-checkouts/:
    post:
      operationId: operations_assisted_checkouts_create
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Stable opaque key for this logical command. Reuse it only when
