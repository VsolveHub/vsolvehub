                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/requirements/{requirement_id}/unlock/:
    get:
      operationId: m2_unlock_read
      description: 'The unlock state for one A3 request. `unlock` is `null` until
        a checkout has been started, and reaching `ACTIVE` requires a **verified provider
        callback** — a client redirect saying the payment succeeded never grants access.
        `price_paise` is `null` when Operations has loaded no effective price, which
        is a real state while the tier prices are an open owner decision: the screen
        says we cannot offer this yet rather than showing a number nobody approved.'
      parameters:
      - in: path
        name: requirement_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - M2 - Access
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnlockState'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
    post:
      operationId: m2_unlock_checkout_create
      description: Start the charge that unlocks delivered quotes. **A3 only**, and
        refused unless at least one usable quote is live at this instant — that is
        what makes 'paid but nothing happened' unreachable rather than merely unlikely.
        Repeating the call while a previous attempt is still pending returns that
        attempt rather than starting a second charge.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Stable opaque key for this logical command. Reuse it only when
          retrying the identical request; using it with a different payload returns
          409.
        required: true
      - in: path
        name: requirement_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - M2 - Access
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessCheckout'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: '`m2_lifecycle_not_supported` on an A5 request, which uses
            a visit plan and has no unlock.'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: '`m2_unlock_not_available` when no usable quote exists yet
            or the request is already unlocked; `m2_access_price_unavailable` when
            Operations has loaded no effective price — this **fails closed** rather
            than charging a guess.'
  /api/v1/requirements/{requirement_id}/vendor-cards/:
    get:
      operationId: m2_vendor_card_list
      description: |-
        The professionals responding to one A5 request. **A5 only** — an A3 request's pre-unlock surface is the quote teaser, and a second one would be a way around the unlock.

        The ladder, exactly: verification badge, vendor type and a coarse distance band for every responding vendor; the vendor's **name once they have committed to a visit slot**, because somebody entering a home has to be nameable; and **no contact details at any status**, which the engagement releases and the plan fee does not.

        `distance_band_km` is the 5 km band the matcher ranked on, read back from the invitation's own provenance rather than recomputed, and is `null` when we have no fresh position for that vendor — the ordinary case for an agency that never runs the technician app. **No rating is published**: this platform has no review model, and a number with nothing behind it is worse than none.
      parameters:
      - in: path
        name: requirement_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - M2 - Access
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorCardList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: '`m2_lifecycle_not_supported` on an A3 request.'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/requirements/{requirement_id}/visit-plan/:
    get:
      operationId: m2_visit_plan_read
      description: The visit plan for one A5 request. Before a plan is chosen this
        carries `available_tiers` — the priced options for the review screen's chooser,
        and an **empty list is the honest answer** while the owner has priced no tier.
        After a plan exists it carries the plan, its per-slot shares and the confirmed
        visits with their scheduled times. Choosing a plan charges nothing; the whole
        plan is charged once, at the first confirmed visit slot.
      parameters:
      - in: path
        name: requirement_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - M2 - Access
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitPlanState'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
    post:
      operationId: m2_visit_plan_choose
      description: 'Choose how many verified professionals will visit and estimate
        on site: one, two or three. **This charges nothing** — it bounds the invitation
        wave and snapshots the price the Customer was shown, so a price loaded between
        choosing and the first vendor confirming cannot silently become what they
        pay. Re-choosing is allowed while no vendor has committed to a slot. A5 only;
        an A3 request has no visit plan.'
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Stable opaque key for this logical command. Reuse it only when
          retrying the identical request; using it with a different payload returns
          409.
        required: true
      - in: path
        name: requirement_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - M2 - Access
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitPlanChooseRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VisitPlanChooseRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VisitPlanChooseRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitPlan'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: '`m2_lifecycle_not_supported` on an A3 request.'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: '`m2_access_price_unavailable` when this tier has no effective
            price; `m2_requirement_transition_not_allowed` once a vendor has committed
            to a visit, because resizing a plan somebody is already travelling for
            is not a choice.'
  /api/v1/requirements/{requirement_id}/visit-plan/checkout/:
    post:
      operationId: m2_visit_plan_checkout_create
      description: Pay for the whole visit plan, once, against a slot a vendor has
        actually committed to. The first vendor's slot is held while this completes
        and **lapses harmlessly if the Customer never pays** — nothing was charged
        and the vendor's time returns to the availability grid. The held slot hardens
        to `SCHEDULED` only on the verified provider callback. Later vendors book
        without any further payment.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Stable opaque key for this logical command. Reuse it only when
          retrying the identical request; using it with a different payload returns
          409.
        required: true
      - in: path
        name: requirement_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - M2 - Access
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessCheckout'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: '`m2_visit_plan_not_chargeable` when no vendor holds a slot
            yet, when the plan is already paid for, or when a reclassification credit
            already covers it; `m2_visit_plan_required` when no plan has been chosen.'
  /api/v1/requirements/duplicate-check/:
