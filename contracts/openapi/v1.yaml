  /api/v1/selections/{selection_id}/decline/:
    post:
      operationId: m2_selection_decline
      description: Decline after being chosen. The quote is marked `LAPSED` rather
        than `REJECTED` — a rejection is the Customer's refusal, and a vendor reading
        it against their own decision would be told the wrong story about their own
        standing. The Customer's unlock or visit plan survives and the next quote
        costs nothing more.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Stable opaque key for this logical command. Reuse it only when
          retrying the identical request; using it with a different payload returns
          409.
        required: true
      - in: path
        name: selection_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - M2 - Selection
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectionDeclineRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SelectionDeclineRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SelectionDeclineRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalSelection'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/selections/{selection_id}/reconfirm/:
    post:
      operationId: m2_selection_reconfirm
      description: 'Confirm price, date and capacity after being chosen. **Everything
        is re-checked here** rather than trusted from quoting time: the capability
        against this request''s own area and start date, the vendor''s diary on the
        shared availability grid, and the quote''s validity. A vendor whose approval
        lapsed in between must not end up holding authorised money against unauthorised
        work.'
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Stable opaque key for this logical command. Reuse it only when
          retrying the identical request; using it with a different payload returns
          409.
        required: true
      - in: path
        name: selection_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - M2 - Selection
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Engagement'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: '`m2_capability_not_approved` or `m2_capability_suspended`
            when the lifecycle capability is no longer live.'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: '`m2_reconfirmation_expired` when the deadline passed — the
            selection is expired in the same call, so the Customer is not left waiting;
            `m2_capacity_unavailable` when the vendor''s diary filled; `m2_proposal_not_selectable`
            when the quote''s own validity elapsed; `m2_policy_unavailable` when the
            A5 commission terms are unset.'
  /api/v1/service-areas/:
