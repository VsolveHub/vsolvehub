          readOnly: true
        processing_status:
          allOf:
          - $ref: '#/components/schemas/RequirementScanStatusEnum'
          readOnly: true
        failure_reason:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - content_type
      - created_at
      - failure_reason
      - id
      - kind
      - note
      - processing_status
      - size_bytes
    StageEvidenceFinalizeRequest:
      type: object
