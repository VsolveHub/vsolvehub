  /api/v1/partner/capabilities/:
    get:
      operationId: m2_partner_capability_list
      description: Every capability this Partner holds, in any status. **This is the
        read that tells "not applied" from "under review" from "suspended"** — an
        empty workspace-grant list cannot, and inferring a review banner from one
        would show it to every existing M1 Partner. `REJECTED` is Operations' refusal;
        `WITHDRAWN` is the Partner's own exit.
      tags:
      - M2 - Partner registration
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCapabilityList'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
    post:
      operationId: m2_partner_capability_request
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Stable opaque key for this logical command. Reuse it only when
          retrying the identical request; using it with a different payload returns
          409.
        required: true
      tags:
      - M2 - Partner registration
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapabilityRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CapabilityRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CapabilityRequestRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCapability'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: '`m2_lifecycle_not_supported` when the variant carries no A3/A5
            archetype. Show "we do not cover this yet" and return to the options list,
            not a field error. `m2_business_type_invalid` when the registration answers
            do not satisfy the variant''s published question schema, or when a requested
            service area is not one the Partner works in — the capability can only
            narrow their coverage, never add to it.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: '`m2_capability_already_requested` when a live request exists
            for this variant — the recovery is "open the one you have", not "try something
            else". `idempotency_in_progress` means wait and re-read, never resend
            under a new key.'
  /api/v1/partner/capabilities/{capability_id}/submit/:
    post:
      operationId: m2_partner_capability_submit
      description: |-
        The Partner's own submit and resubmit (`M2-BE-110`).

        The button that was missing. Until now a capability sitting in `CHANGES_REQUIRED` could only be
        moved by Operations, so a Partner who fixed exactly what was asked had no way to say so and
        the correction cycle depended on somebody noticing. Reaching `UNDER_REVIEW` from `REQUESTED` is
        the first submit and from `CHANGES_REQUIRED` the resubmit; they are one command because they
        are one act.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Stable opaque key for this logical command. Reuse it only when
          retrying the identical request; using it with a different payload returns
          409.
        required: true
      - in: path
        name: capability_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - M2 - Partner registration
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapabilitySubmitRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CapabilitySubmitRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CapabilitySubmitRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCapability'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: '`m2_business_type_invalid` when the registration answers do
            not satisfy the variant''s published question schema.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: '`m2_capability_transition_not_allowed` from any status other
            than `REQUESTED` or `CHANGES_REQUIRED`. A capability already `UNDER_REVIEW`
            returns `200` unchanged rather than refusing — resubmitting is not an
            error.'
