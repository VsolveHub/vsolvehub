  /api/v1/engagement-amendments/{engagement_amendment_id}/accept/:
    post:
      operationId: m2_engagement_amendment_decide
      description: |-
        **Money first, scope second (`M2-BE-506`).** Accepting does not change the agreed work until the money has moved. Three routes, chosen by the commercial mode and the sign of the delta and never by anything a client sends:

        - `LEAD_ONLY` (A3): no platform money exists to move, so the amendment authorizes here and the extra shift-days appear immediately. `checkout` is `null`.
        - Managed (A5), negative delta: the refund is issued against the stage's own funding payment **before** the scope shrinks, so there is no instant in which the Customer owns less work than they have paid for. `checkout` is `null`.
        - Managed (A5), positive delta: `checkout` carries a `PaymentAttempt` and **nothing changes until a verified provider callback**. A client redirect claiming success is a claim by the party that benefits from it.

        Repeating an acceptance while its payment is pending returns the same attempt rather than starting a second charge.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Stable opaque key for this logical command. Reuse it only when
          retrying the identical request; using it with a different payload returns
          409.
        required: true
      - in: path
        name: engagement_amendment_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - M2 - Amendments
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngagementAmendmentDecision'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: '`m2_amendment_not_actionable` when it expired or already has
            a decision.'
  /api/v1/engagement-amendments/{engagement_amendment_id}/decline/:
    post:
      operationId: m2_engagement_amendment_decline
      description: The Customer says no. The agreed work is unchanged, nothing has
        moved, and the vendor may propose a different change.
