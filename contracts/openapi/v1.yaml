  /api/v1/requirements/{requirement_id}/booking-fee/cancel/:
    post:
      operationId: m2_booking_fee_cancel
      description: |-
        Cancel a booked crew. **The free-cancellation window decides the money**, server-side and never from the client: at or beyond T hours before the requested start the booking fee refunds in full; inside T it forfeits and splits, because the lead has already turned other work down for that day.

        T is an open owner decision and is read fail-closed: while it is unset this refuses with `m2_policy_unavailable` rather than guessing which way a real Customer's money should go.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Stable opaque key for this logical command. Reuse it only when
          retrying the identical request; using it with a different payload returns
          409.
        required: true
      - in: path
        name: requirement_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - M2 - Rate card
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingFee'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: '`m2_policy_unavailable` while the free-cancellation window
            is unset; `m2_booking_fee_not_chargeable` when there is no fee on this
            request; `m2_requirement_transition_not_allowed` once the fee is settled.'
  /api/v1/requirements/{requirement_id}/booking-fee/checkout/:
    post:
      operationId: m2_booking_fee_checkout_create
      description: |-
        Pay the booking fee against a lead who is holding this job right now. The hold is checked under the booking's own row lock in the same transaction that creates the attempt, so paying for a crew nobody is holding is unreachable rather than merely unlikely.

        **The crew is not confirmed by this response.** Only a verified provider callback moves the fee to `ACTIVE`, and that same callback creates the engagement; until it lands the fee reads `PENDING` and `m2_booking_fee_payment_pending` is the refusal anything gated on confirmation returns. If the Customer never pays, the hold lapses harmlessly and the next offer or wave proceeds.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Stable opaque key for this logical command. Reuse it only when
          retrying the identical request; using it with a different payload returns
          409.
        required: true
      - in: path
        name: requirement_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - M2 - Rate card
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessCheckout'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: '`m2_booking_fee_not_chargeable` when no lead is holding the
            job, when the hold has expired, or when the fee is already settled; `m2_lifecycle_not_supported`
            on a request that is on the quote flow.'
  /api/v1/requirements/{requirement_id}/crew/arrival/:
    post:
      operationId: m2_crew_arrival_confirm
      description: |-
        Confirm the crew arrived on day one, which is the moment the booking fee is earned. Either party may record it. **Non-OTP** — the start OTP is deferred to M3, so this is the default path in M2 rather than a degraded one.

        Nothing is paid out here: the fee is Vsolve's revenue once the crew arrived, and the wages are peer-to-peer and settle at day end.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Stable opaque key for this logical command. Reuse it only when
          retrying the identical request; using it with a different payload returns
          409.
        required: true
      - in: path
        name: requirement_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - M2 - Rate card
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingFee'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/requirements/{requirement_id}/crew/no-show/:
    post:
      operationId: m2_crew_no_show_report
      description: |-
        Report that day one did not happen. **`party` decides the money and the reason code cannot move it.**

        `VENDOR`: the booking fee refunds in full, no travel compensation is paid — neither party earns from an undelivered crew — the request returns to matching for a **free re-dispatch**, and the vendor's standing carries the record.

        `CUSTOMER`: the fee forfeits and splits. A configured share pays the lead as travel compensation through the payout rails, and the remainder is the platform share; the two reconcile to the fee in integer paise.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Stable opaque key for this logical command. Reuse it only when
          retrying the identical request; using it with a different payload returns
          409.
        required: true
      - in: path
        name: requirement_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - M2 - Rate card
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrewNoShowRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CrewNoShowRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CrewNoShowRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingFee'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: '`m2_policy_unavailable` while the forfeit split is unset —
            the fee stays `ACTIVE` and visible rather than being split on an invented
            ratio.'
  /api/v1/requirements/{requirement_id}/quotes/:
    get:
      operationId: m2_quote_list
      description: 'Every quote (A3) or on-site estimate (A5) in full: scope, line
        items, stages, taxes, validity and the vendor''s identity. **Entitlement is
        enforced here, not hidden in the UI** — an A3 request needs an active unlock
        and an A5 request needs a charged visit plan, and without one this refuses
        rather than returning a shortened payload. Contact details are not in this
        response at any status; they are released by the engagement, not by the fee.'
      parameters:
      - in: path
        name: requirement_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - M2 - Quotes
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerQuoteList'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: '`m2_unlock_required` — the A3 quotes are still behind the
            unlock.'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: '`m2_visit_plan_required` — no A5 visit plan has been charged,
            so no estimate has been bought yet.'
  /api/v1/requirements/{requirement_id}/quotes/{proposal_id}/questions/:
    post:
      operationId: m2_customer_question_create
      description: |-
        Ask the professional behind one quote or estimate a question. Structured clarification, not chat: one question, one answer, both on the shared timeline.

        Addressed to a **proposal**, so it reaches the vendor who wrote it rather than broadcasting to a pool that has already quoted. Gated on the paywall the archetype uses — before the unlock (A3) or the charged plan (A5) the vendors are deliberately not addressable, and a question would be a channel around the fee.

        A question never changes a price. A new number is a superseding proposal.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Stable opaque key for this logical command. Reuse it only when
          retrying the identical request; using it with a different payload returns
          409.
        required: true
      - in: path
        name: proposal_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: requirement_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - M2 - Quotes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/QuestionCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/QuestionCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementQuestion'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: '`m2_unlock_required` before an A3 unlock.'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: '`m2_visit_plan_required` before an A5 plan is charged; `m2_requirement_transition_not_allowed`
            once the request is closed.'
  /api/v1/requirements/{requirement_id}/quotes/{proposal_id}/reject/:
    post:
      operationId: m2_quote_reject
      description: 'Refuse a quote. `NOT_CHOSEN` is bookkeeping — the Customer preferred
        somebody else and nothing further happens. `NON_RESPONSIVE` is the control
        against slot squatting: it releases the vendor''s slot and buys a replacement
        **at no extra charge** — a new quote slot on A3, a free replacement visit
        on A5 — up to a configured cap.'
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Stable opaque key for this logical command. Reuse it only when
          retrying the identical request; using it with a different payload returns
          409.
        required: true
      - in: path
        name: proposal_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: requirement_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - M2 - Quotes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProposalRejectRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProposalRejectRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProposalRejectRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerProposal'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: '`m2_rejection_cap_reached` when every free replacement has
            been used; `m2_proposal_not_selectable` when the quote is no longer live;
            `m2_policy_unavailable` when the owner has not set the cap — the free
            replacement is refused rather than promised on a rule that does not exist.'
  /api/v1/requirements/{requirement_id}/quotes/{proposal_id}/revalidate/:
    post:
      operationId: m2_quote_revalidate
      description: Ask this vendor to put a fresh price on a quote whose validity
        has passed. **This charges nothing and reuses the unlock or visit plan already
        paid for** — expiry must not be a dead end that forces a second purchase.
        The vendor answers by superseding the quote; the expired revision stays readable
        and stays unselectable, because only a vendor can state a price.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Stable opaque key for this logical command. Reuse it only when
          retrying the identical request; using it with a different payload returns
          409.
        required: true
      - in: path
        name: proposal_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: requirement_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - M2 - Quotes
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerProposal'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: '`m2_proposal_not_selectable` when the quote has not expired,
            when the request already has a chosen vendor, or when the caller has not
            unlocked these quotes at all.'
  /api/v1/requirements/{requirement_id}/quotes/teasers/:
    get:
      operationId: m2_quote_teaser_list
      description: Pre-unlock quote teasers. This payload is sent to a Customer who
        has paid nothing, so vendor name, contact, scope, line items and the exact
        total are absent from the response — not merely unrendered.
      parameters:
      - in: path
        name: requirement_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - M2 - Quotes
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteTeaserList'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/requirements/{requirement_id}/rate-card/:
    get:
      operationId: m2_rate_card_read
      description: |-
        The published day rate for this request and everything that has happened to it since. **`preview.is_available: false` is not an error** — it means this city and skill have no published card, or instant dispatch is not configured for this service, and the request will collect quotes instead. `unavailable_code` says which.

        The money split published here is the Customer's: `total_customer_paise` divides into `lead_receipt_paise`, **paid directly to the crew at day end and never held by Vsolve**, and `booking_fee_paise`, the one online charge. The lead's own wage and supervision split is deliberately absent.
      parameters:
      - in: path
        name: requirement_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - M2 - Rate card
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateCardState'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/requirements/{requirement_id}/rate-card/book/:
    post:
      operationId: m2_rate_card_book
      description: |-
        Book a crew at the published day rate. The rate and its inclusion list are shown by `m2_rate_card_read` **before** this runs and are frozen onto the booking here, so a rate loaded between the screen and the tap cannot become what the Customer agreed to.

        **Nothing is charged by this call.** It submits the requirement and sends the first wave of crew offers on the M1 dispatch clock — minutes, not business hours. The booking fee is charged only once a lead has accepted, through `m2_booking_fee_checkout_create`.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Stable opaque key for this logical command. Reuse it only when
          retrying the identical request; using it with a different payload returns
          409.
        required: true
      - in: path
        name: requirement_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - M2 - Rate card
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RateCardBookRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RateCardBookRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RateCardBookRequest'
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateCardState'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: '`m2_rate_card_unavailable` when no card is published for this
            city and skill — the Customer is routed to the quote flow, which is the
            honest degradation rather than a guessed price. `m2_policy_unavailable`
            when instant dispatch is not configured for this service. `m2_requirement_duplicate`
            unless `allow_duplicate` is set.'
  /api/v1/requirements/{requirement_id}/selection/:
    get:
      operationId: m2_selection_read
      description: The live selection for this request, or `null`. `reconfirm_by`
        is the vendor's deadline; `engagement_id` fills in once they reconfirm.
      parameters:
      - in: path
        name: requirement_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - M2 - Selection
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalSelection'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
    post:
      operationId: m2_selection_create
      description: 'Choose one vendor. **Selection is not a booking**: it starts the
        vendor''s reconfirmation clock, and the engagement opens only when they commit
        — A3 on their reconfirmation, A5 when the first stage is funded. If they decline
        or the clock runs out, the unlock or visit-plan entitlement survives untouched
        and the next quote costs nothing more. Multiple simultaneous selections are
        not supported.'
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Stable opaque key for this logical command. Reuse it only when
          retrying the identical request; using it with a different payload returns
          409.
        required: true
      - in: path
        name: requirement_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - M2 - Selection
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectionCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SelectionCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SelectionCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalSelection'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: '`m2_unlock_required` — an A3 quote cannot be selected unread.'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: '`m2_selection_conflict` when another session selected first
            (retryable, and the answer changes on its own); `m2_proposal_not_selectable`
            for a superseded, withdrawn or expired quote, or an A5 estimate with no
            completed visit behind it; `m2_visit_plan_required` when the A5 plan is
            unpaid.'
  /api/v1/requirements/{requirement_id}/submit/:
    post:
      operationId: m2_requirement_submit
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Stable opaque key for this logical command. Reuse it only when
          retrying the identical request; using it with a different payload returns
          409.
        required: true
      - in: path
        name: requirement_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - M2 - Requirements
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequirementSubmitRequest'
