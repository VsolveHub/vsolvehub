      type: string
      description: |-
        * `REQUESTED` - Requested
        * `SCHEDULED` - Scheduled
        * `IN_PROGRESS` - Vendor has arrived
        * `COMPLETED` - Completed
        * `CANCELLED` - Cancelled
        * `VENDOR_NO_SHOW` - Vendor did not arrive
