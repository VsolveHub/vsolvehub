  /api/v1/booking-groups/{group_id}/address/:
    post:
      operationId: booked_group_change_address
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Stable opaque key for this logical command. Reuse it only when
          retrying the identical request; using it with a different payload returns
          409.
        required: true
      - in: path
        name: group_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Fulfilment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupAddressChangeRequestRequest'
          application/x-www-form-urlencoded:
