          format: date-time
          readOnly: true
          nullable: true
        evidence_submitted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        approved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        released_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        disputed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
