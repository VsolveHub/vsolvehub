          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/engagement-stages/{stage_id}/crew/:
    post:
      operationId: m2_shift_crew_assign
      description: |-
        Assign crew to **one shift-day**, not to the engagement. Multi-day work rotates faces legitimately, and a roster hung off the engagement would either forbid that or record a lie about who was there.

        Send the **whole** intended crew every time. The server reconciles the day to it: names that are gone are released with `reason_code`, new names are assigned. A substitution is therefore one call rather than a delete-then-add a client can half perform, and re-sending the same set is a no-op.

        Four refusals, each a different failure: `m2_crew_roster_required` (the progressive gate, at the first assignment rather than at registration), `m2_crew_conflict` for an unverified worker, for a worker who is not on your roster or is marked unavailable, and — the cross-agency one — for the same **person** already promised on that date through any agency. The last is held by a database constraint as well as by this check, so two supervisors tapping at the same instant cannot both win.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Stable opaque key for this logical command. Reuse it only when
          retrying the identical request; using it with a different payload returns
          409.
        required: true
      - in: path
        name: stage_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - M2 - Shift days
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrewAssignRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CrewAssignRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CrewAssignRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StageCrewList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: '`m2_crew_roster_required` — add a verified worker to your
            roster before assigning anybody to a shift.'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: '`m2_crew_conflict`, or `m2_stage_transition_not_allowed` when
            the shift-day has no date on it, is already settled, or is an A5 milestone.'
  /api/v1/engagement-stages/{stage_id}/dispute/:
    post:
      operationId: m2_stage_dispute
      description: 'Formally object to submitted work. `AWAITING_REVIEW` → `DISPUTED`,
        and the engagement shows `DISPUTED` alongside. **A dispute stops only the
        disputed allocation**: every other stage carries on and any payout already
        released stays released. The review timeout cannot reach a disputed stage,
        so silence never becomes approval on something somebody has objected to.'
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Stable opaque key for this logical command. Reuse it only when
          retrying the identical request; using it with a different payload returns
          409.
        required: true
      - in: path
