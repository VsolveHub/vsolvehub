        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/engagement-stages/{stage_id}/dispute/decision/:
    post:
      operationId: m2_stage_dispute_resolve
      description: '`DISPUTED` → `APPROVED` or `CORRECTION_REQUESTED`, as an auditable
        domain command rather than a database edit. Two outcomes and not three: a
        partial outcome is a scope amendment both sides accept, never an operator
        quietly repricing a stage. The full case machinery — evidence, deadlines,
        appeals — is Wave C6; this is the transition it will drive, published now
        so a disputed stage is not a dead end.'
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Stable opaque key for this logical command. Reuse it only when
          retrying the identical request; using it with a different payload returns
          409.
        required: true
      - in: path
        name: stage_id
        schema:
          type: string
