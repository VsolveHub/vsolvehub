          type: string
          format: uuid
          readOnly: true
          nullable: true
        requested_start:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        flexibility_days:
          type: integer
          readOnly: true
        is_date_flexible:
          type: boolean
          readOnly: true
        service_by:
          type: string
          format: date
          readOnly: true
          nullable: true
        quote_delivery_deadline_at:
          type: string
          format: date-time
          readOnly: true
        teaser_count:
          type: integer
          readOnly: true
        closure_reason:
          type: string
          nullable: true
          readOnly: true
        is_free:
          type: boolean
          description: |-
            Always `True`, and read from the server on purpose.

            Submitting a requirement is free in both archetypes — the A3 unlock and the A5 visit plan
            are separate purchases made later, against a delivered quote or a confirmed visit. A screen
            that hardcodes the promise keeps making it after the policy changes; this is the field that
            would go `false` first.
