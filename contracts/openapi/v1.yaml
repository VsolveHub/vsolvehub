  /api/v1/operations/partners/:
    get:
      operationId: operations_partner_directory_list
      description: |-
        Everyone who works for us, not just everyone awaiting a decision.

        Deliberately a second surface rather than a widened review queue. The queue is a worklist —
        it defaults to the three in-review statuses and orders by how long somebody has waited. This
        is a directory: it lists approved, suspended and offboarded Partners too, ordered by name,
        because "find me this Partner" and "what should I review next" are different jobs and one
        screen doing both serves neither.
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
        description: Opaque page cursor.
      - in: query
        name: skill
        schema:
          type: array
          items:
            type: string
        description: Repeatable skill code. A Partner matching *any* supplied skill
          is listed — a directory multi-select reads as a union.
      - in: query
        name: status
        schema:
          type: string
        description: Filter by application status.
      tags:
      - Operations
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationsPartnerDirectoryPage'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
