  /api/v1/operations/payout-batches/{batch_id}/approve/:
    post:
      operationId: operations_payout_batch_approve
      description: |-
        Maker-checker plus a fresh OTP.

        Two different people is a control against one person acting alone. The step-up is a control
        against neither of them actually being present — an unlocked laptop with an Operations
        session open should not be able to release a week of payouts.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Stable opaque key for this logical command. Reuse it only when
          retrying the identical request; using it with a different payload returns
          409.
        required: true
      - in: path
        name: batch_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Operations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionedBatchCommandRequest'
