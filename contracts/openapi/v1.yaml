          - $ref: '#/components/schemas/WorkOutcomeEnum'
          readOnly: true
        quantity:
          type: integer
          readOnly: true
        reason:
          type: string
          readOnly: true
      required:
      - id
      - outcome
      - quantity
      - reason
      - work_task_id
    WorkOutcomeEnum:
      enum:
      - COMPLETED
      - PARTIAL
      - NOT_STARTED
      - BLOCKED
      - NOT_APPLICABLE
      type: string
      description: |-
        * `COMPLETED` - Completed
        * `PARTIAL` - Partial
        * `NOT_STARTED` - Not started
        * `BLOCKED` - Blocked
        * `NOT_APPLICABLE` - Not applicable
    WorkTask:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/WorkTaskKindEnum'
          readOnly: true
        position:
          type: integer
          readOnly: true
        code:
          type: string
          readOnly: true
        label:
          type: string
          readOnly: true
        quantity:
          type: integer
          readOnly: true
        amount_paise:
          type: integer
          readOnly: true
        currency:
          type: string
          readOnly: true
      required:
      - amount_paise
      - code
      - currency
      - id
      - kind
      - label
      - position
      - quantity
    WorkTaskKindEnum:
      enum:
      - ORIGINAL
      - AMENDMENT
      type: string
      description: |-
        * `ORIGINAL` - Original scope
        * `AMENDMENT` - Approved amendment
    WorkspaceGrant:
      type: object
      description: |-
        `{workspace_key, commercial_mode, actions[]}` and nothing else.

        No routes, no labels, no icons: the backend authorises, the frontend owns presentation. The
        key is opaque — a client that does not recognise one renders nothing rather than a generic
        tab, because a tab whose screens are not in the bundle is an unrecoverable dead end.
      properties:
        workspace_key:
          allOf:
          - $ref: '#/components/schemas/WorkspaceKeyEnum'
          readOnly: true
        commercial_mode:
          type: string
          readOnly: true
        actions:
          type: array
          items:
            type: string
          readOnly: true
      required:
      - actions
      - commercial_mode
      - workspace_key
    WorkspaceGrantList:
      type: object
      properties:
        workspaces:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceGrant'
          readOnly: true
      required:
      - workspaces
    WorkspaceKeyEnum:
      enum:
      - LEGACY
      - A1_TASK_VISIT
      - A3_TIME_BLOCK
      - A5_CUSTOM_PROJECT
      type: string
      description: |-
        * `LEGACY` - Legacy
        * `A1_TASK_VISIT` - A1 task visit
        * `A3_TIME_BLOCK` - A3 time block
        * `A5_CUSTOM_PROJECT` - A5 custom project
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: vsolve_session
      description: Revocable Django session cookie. Mutations also require a CSRF
        token.
