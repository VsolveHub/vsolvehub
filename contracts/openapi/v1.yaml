      description: |-
        One of the Customer's checked files, as a short-lived signed link.

        `download_url` is a bearer credential — anyone holding it holds the file — which is why it is
        minted per read and expires in minutes rather than being stored anywhere.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kind:
          type: string
          readOnly: true
        size_bytes:
          type: integer
          readOnly: true
        language:
          type: string
          readOnly: true
        download_url:
          type: string
          format: uri
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - download_url
      - expires_at
      - id
      - kind
      - language
      - size_bytes
    VendorAttachmentList:
      type: object
      description: |-
        Attachments this vendor may see, and whether they still may.

        `has_access` is `false` once the invitation was declined, expired or withdrawn and this vendor
        was not selected. It is published as a state on a `200` rather than as an error because the
        vendor is entitled to their own enquiry record either way, and because "there are no
        photographs" and "you may no longer see the photographs" are different things to render.
      properties:
        has_access:
          type: boolean
          readOnly: true
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/VendorAttachment'
          readOnly: true
        server_now:
          type: string
          format: date-time
          readOnly: true
      required:
      - attachments
      - has_access
      - server_now
    VendorCard:
      type: object
      description: |-
        A responding vendor, as much of one as the Customer has paid to see.

        An explicit field list for the same reason `QuoteTeaserSerializer` is one. Before a visit is
        confirmed this is a badge, a rating and a type — no name, no photo, no contact. After
        confirmation the name is disclosed, because a person is entering the Customer's home and must
        be nameable; contact stays masked until the engagement.
      properties:
        partner_id:
          type: string
          format: uuid
          readOnly: true
        vendor_type:
          type: string
          readOnly: true
        is_verified:
          type: boolean
          readOnly: true
        display_name:
          type: string
          readOnly: true
          nullable: true
        distance_band_km:
          type: integer
          readOnly: true
          nullable: true
      required:
      - display_name
      - distance_band_km
      - is_verified
      - partner_id
      - vendor_type
    VendorCardList:
      type: object
      description: |-
        The A5 responding pool.

        **No rating field, and that is a decision rather than an omission.** `README.md` lists a rating
        among the four pre-confirmation signals and this platform has no review model — `carts`'
        professional card already refuses to publish one for the same reason. A star count invented
        here would be this serializer deciding what a vendor's reputation is. The field arrives when a
        review aggregate does.
      properties:
        vendor_cards:
          type: array
          items:
            $ref: '#/components/schemas/VendorCard'
          readOnly: true
        server_now:
          type: string
          format: date-time
          readOnly: true
      required:
      - server_now
      - vendor_cards
    VendorInvitationStatusEnum:
      enum:
      - INVITED
      - ACCEPTED
      - QUOTED
      - DECLINED
      - EXPIRED
      - WITHDRAWN
      type: string
      description: |-
        * `INVITED` - Invited
        * `ACCEPTED` - Accepted
        * `QUOTED` - Quoted
        * `DECLINED` - Declined
        * `EXPIRED` - Expired
        * `WITHDRAWN` - Withdrawn
    VersionedBatchCommandRequest:
      type: object
      properties:
        expected_version:
          type: integer
          minimum: 1
      required:
      - expected_version
    VersionedCaseCommandRequest:
      type: object
      properties:
        expected_version:
          type: integer
          minimum: 1
      required:
      - expected_version
    VersionedCommandRequest:
      type: object
      description: |-
        The floor every state-changing fulfilment command sits on.

        `expected_version` is required, never defaulted. A command that would apply to whatever
        state it happens to find is the thing optimistic concurrency exists to prevent, and a
        default here would silently reintroduce it for every caller that forgot the field.
      properties:
        expected_version:
          type: integer
          minimum: 1
      required:
      - expected_version
    VisitArrivalMethodEnum:
      enum:
      - NON_OTP_FALLBACK
      - START_OTP
      type: string
      description: |-
        * `NON_OTP_FALLBACK` - Confirmed without an OTP
        * `START_OTP` - Confirmed with a start OTP
    VisitNoShowPartyEnum:
      enum:
      - VENDOR
      - CUSTOMER
      type: string
      description: |-
        * `VENDOR` - Vendor
        * `CUSTOMER` - Customer
    VisitNoShowReasonEnum:
      enum:
      - NOBODY_ON_SITE
      - SITE_INACCESSIBLE
      - ADDRESS_WRONG
      - VENDOR_DID_NOT_ARRIVE
      - CANCELLED_ON_THE_DAY
      - OTHER
      type: string
      description: |-
        * `NOBODY_ON_SITE` - Nobody was at the address
        * `SITE_INACCESSIBLE` - Could not get access to the site
        * `ADDRESS_WRONG` - The address was wrong or could not be found
        * `VENDOR_DID_NOT_ARRIVE` - The professional never arrived
        * `CANCELLED_ON_THE_DAY` - The other party cancelled on the day
        * `OTHER` - Another reason
    VisitNoShowRequest:
      type: object
      description: |-
        Report that a scheduled visit did not happen.

        `party` decides the settlement and `reason_code` decides nothing — see `VISIT_NO_SHOW_REASONS`.
        The reason is still required, because "nobody turned up" without a cause is a row Operations
        cannot act on and a vendor cannot appeal.
      properties:
        party:
          $ref: '#/components/schemas/VisitNoShowPartyEnum'
        reason_code:
          $ref: '#/components/schemas/VisitNoShowReasonEnum'
      required:
      - party
      - reason_code
    VisitPlan:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/VisitPlanStatusEnum'
          readOnly: true
        plan_size:
          type: integer
          readOnly: true
        price_paise:
          type: integer
          readOnly: true
        credit_paise:
          type: integer
          readOnly: true
        chargeable_paise:
          type: integer
          description: 'What the Customer still owes: the tier price less any carried-over
            unlock credit.'
          readOnly: true
        shares:
          type: array
          items:
            $ref: '#/components/schemas/VisitPlanShare'
          readOnly: true
        receipt_series:
          type: string
          readOnly: true
        receipt_sequence:
          type: integer
          readOnly: true
          nullable: true
        fill_due_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        chosen_at:
          type: string
          format: date-time
          readOnly: true
        charged_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        settled_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - chargeable_paise
      - charged_at
      - chosen_at
      - credit_paise
      - fill_due_at
      - id
      - plan_size
      - price_paise
      - receipt_sequence
      - receipt_series
      - settled_at
      - shares
      - status
    VisitPlanChooseRequest:
      type: object
      properties:
        plan_size:
          type: integer
          maximum: 3
          minimum: 1
      required:
      - plan_size
    VisitPlanShare:
      type: object
      description: |-
        One slot of the plan and the money that follows it.

        The split is published because the Customer is entitled to know what their money bought: a
        vendor visit payout and a Vsolve platform share, in paise, per slot. `REFUNDED` returns both.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        position:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/VisitPlanShareStatusEnum'
          readOnly: true
        amount_paise:
          type: integer
          readOnly: true
        vendor_payout_paise:
          type: integer
          readOnly: true
        platform_share_paise:
          type: integer
          readOnly: true
        settlement_reason_code:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        committed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        earned_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        refunded_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - amount_paise
      - committed_at
      - earned_at
      - id
      - platform_share_paise
      - position
      - refunded_at
      - settlement_reason_code
      - status
      - vendor_payout_paise
    VisitPlanShareStatusEnum:
      enum:
      - OPEN
      - COMMITTED
      - EARNED
      - REFUNDED
      - REPLACED
      type: string
      description: |-
        * `OPEN` - Open
        * `COMMITTED` - A vendor confirmed a visit
        * `EARNED` - Visit completed and estimate delivered
        * `REFUNDED` - Refunded to the Customer
        * `REPLACED` - Awaiting a free replacement visit
    VisitPlanState:
      type: object
      description: |-
        The A5 front door as one read: the chooser before, the tracker after.

        Deliberately one endpoint for both. Before a plan exists it carries the priced tiers the review
        screen offers; after one exists it carries the plan, its shares and the confirmed visits with
        their times. Two endpoints would have meant the tracker and the chooser could disagree about
        which plan the Customer has.
      properties:
        plan:
          allOf:
          - $ref: '#/components/schemas/VisitPlan'
          readOnly: true
          nullable: true
        available_tiers:
          type: array
          items:
            $ref: '#/components/schemas/VisitPlanTier'
          readOnly: true
        visits:
          type: array
          items:
            $ref: '#/components/schemas/SiteVisit'
          readOnly: true
        checkout_available:
          type: boolean
          readOnly: true
        can_read_full_estimates:
          type: boolean
          readOnly: true
        server_now:
          type: string
          format: date-time
          readOnly: true
      required:
      - available_tiers
      - can_read_full_estimates
      - checkout_available
      - plan
      - server_now
      - visits
    VisitPlanStatusEnum:
      enum:
      - CHOSEN
      - PENDING
      - ACTIVE
      - FAILED
      - VOID
      - SETTLED
      type: string
      description: |-
        * `CHOSEN` - Chosen, nothing charged
        * `PENDING` - Awaiting the provider
        * `ACTIVE` - Charged
        * `FAILED` - Payment failed
        * `VOID` - Closed before any visit was confirmed
        * `SETTLED` - Every share earned or refunded
    VisitPlanTier:
      type: object
      description: One row of the review screen's chooser. An empty list is the honest
        unpriced state.
      properties:
        plan_size:
          type: integer
          readOnly: true
        price_paise:
          type: integer
          readOnly: true
      required:
      - plan_size
      - price_paise
    VisitSlot:
      type: object
      description: |-
        One candidate start, in `booking/windows/` field order and with one field removed.

        `capacity` is deliberately absent. The A1 grid publishes it to a Customer choosing between
        Partners; this grid is scoped to the **one invited vendor**, so a capacity number here would be
        a live readout of that vendor's own diary depth and nothing a slot picker needs.
      properties:
        id:
          type: string
          readOnly: true
        starts_at:
          type: string
          format: date-time
          readOnly: true
        ends_at:
          type: string
          format: date-time
          readOnly: true
        is_available:
          type: boolean
          readOnly: true
        unavailable_reason:
          readOnly: true
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/UnavailableReasonEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - ends_at
      - id
      - is_available
      - starts_at
      - unavailable_reason
    VisitSlotConfirmRequest:
      type: object
      properties:
        slot_id:
          type: string
          minLength: 1
          maxLength: 2000
      required:
      - slot_id
    VisitSlotConfirmation:
      type: object
      properties:
        visit:
          allOf:
          - $ref: '#/components/schemas/SiteVisit'
          readOnly: true
        share:
          allOf:
          - $ref: '#/components/schemas/VisitPlanShare'
          readOnly: true
        opens_plan_checkout:
          type: boolean
          readOnly: true
        server_now:
          type: string
          format: date-time
          readOnly: true
      required:
      - opens_plan_checkout
      - server_now
      - share
      - visit
    VisitSlotDay:
      type: object
      properties:
        date:
          type: string
          format: date
          readOnly: true
        is_today:
          type: boolean
          readOnly: true
        slots:
          type: array
          items:
            $ref: '#/components/schemas/VisitSlot'
          readOnly: true
      required:
      - date
      - is_today
      - slots
    VisitSlotGrid:
      type: object
      description: |-
        Candidate visit starts for one invited vendor.

        The Partner-side twin of `POST /api/v1/booking/windows/`, drawn from the same
        `carts.availability` snapshot and the same window loop. **The browser never computes
        availability** — it renders these slots and posts back an `id`, which is a signed token bound
        to this invitation and this start.
      properties:
        server_now:
          type: string
          format: date-time
          readOnly: true
        visit_duration_minutes:
          type: integer
          readOnly: true
        availability_is_preliminary:
          type: boolean
          readOnly: true
        timezone:
          type: string
          readOnly: true
        days:
          type: array
          items:
            $ref: '#/components/schemas/VisitSlotDay'
          readOnly: true
      required:
      - availability_is_preliminary
      - days
      - server_now
      - timezone
      - visit_duration_minutes
    WebhookAccepted:
      type: object
      properties:
        accepted:
          type: boolean
          readOnly: true
        duplicate:
          type: boolean
          readOnly: true
      required:
      - accepted
      - duplicate
    WorkEvidence:
      type: object
      description: |-
        Evidence metadata only.

        The object key is a private-bucket path and the bytes are KYC-adjacent: neither belongs in
        a list projection. A reader who needs the file asks for a fresh, audited, expiring grant,
        the same way Partner documents work.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/WorkEvidenceKindEnum'
          readOnly: true
        work_task_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        content_type:
          type: string
          readOnly: true
        size_bytes:
          type: integer
          readOnly: true
        processing_status:
          allOf:
          - $ref: '#/components/schemas/ProcessingStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - content_type
      - created_at
      - id
      - kind
      - processing_status
      - size_bytes
      - work_task_id
    WorkEvidenceKindEnum:
      enum:
      - BEFORE
      - AFTER
      - CONTACT_ATTEMPT
      - SAFETY
      - DAMAGE
      - AMENDMENT
      - COMPLETION
      - WAIT
      type: string
      description: |-
        * `BEFORE` - Before
        * `AFTER` - After
        * `CONTACT_ATTEMPT` - Contact attempt
        * `SAFETY` - Safety
        * `DAMAGE` - Damage
        * `AMENDMENT` - Amendment
        * `COMPLETION` - Completion
        * `WAIT` - Wait
    WorkOutcome:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        work_task_id:
          type: string
          format: uuid
          readOnly: true
        outcome:
          allOf:
          - $ref: '#/components/schemas/WorkOutcomeEnum'
          readOnly: true
        quantity:
          type: integer
          readOnly: true
        reason:
          type: string
          readOnly: true
      required:
      - id
      - outcome
      - quantity
      - reason
      - work_task_id
    WorkOutcomeEnum:
      enum:
      - COMPLETED
      - PARTIAL
      - NOT_STARTED
      - BLOCKED
      - NOT_APPLICABLE
      type: string
      description: |-
        * `COMPLETED` - Completed
        * `PARTIAL` - Partial
        * `NOT_STARTED` - Not started
        * `BLOCKED` - Blocked
        * `NOT_APPLICABLE` - Not applicable
    WorkTask:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/WorkTaskKindEnum'
          readOnly: true
        position:
          type: integer
          readOnly: true
        code:
          type: string
          readOnly: true
        label:
          type: string
          readOnly: true
        quantity:
          type: integer
          readOnly: true
        amount_paise:
          type: integer
          readOnly: true
        currency:
          type: string
          readOnly: true
      required:
      - amount_paise
      - code
      - currency
      - id
      - kind
      - label
      - position
      - quantity
    WorkTaskKindEnum:
      enum:
      - ORIGINAL
      - AMENDMENT
      type: string
      description: |-
        * `ORIGINAL` - Original scope
        * `AMENDMENT` - Approved amendment
    WorkspaceGrant:
      type: object
      description: |-
        `{workspace_key, commercial_mode, actions[]}` and nothing else.

        No routes, no labels, no icons: the backend authorises, the frontend owns presentation. The
        key is opaque — a client that does not recognise one renders nothing rather than a generic
        tab, because a tab whose screens are not in the bundle is an unrecoverable dead end.
      properties:
        workspace_key:
          allOf:
          - $ref: '#/components/schemas/WorkspaceKeyEnum'
          readOnly: true
        commercial_mode:
          type: string
          readOnly: true
        actions:
          type: array
          items:
            type: string
          readOnly: true
      required:
      - actions
      - commercial_mode
      - workspace_key
    WorkspaceGrantList:
      type: object
      properties:
        workspaces:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceGrant'
          readOnly: true
      required:
      - workspaces
    WorkspaceKeyEnum:
      enum:
      - LEGACY
      - A1_TASK_VISIT
      - A3_TIME_BLOCK
      - A5_CUSTOM_PROJECT
      type: string
      description: |-
        * `LEGACY` - Legacy
        * `A1_TASK_VISIT` - A1 task visit
        * `A3_TIME_BLOCK` - A3 time block
        * `A5_CUSTOM_PROJECT` - A5 custom project
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: vsolve_session
      description: Revocable Django session cookie. Mutations also require a CSRF
        token.
