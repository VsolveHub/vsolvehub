              schema:
                $ref: '#/components/schemas/ApiError'
          description: '`m2_attachment_invalid` for an unsupported media type, an
            empty file, a file over the per-kind ceiling or a malformed checksum.'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: '`m2_stage_transition_not_allowed` once the stage no longer
            accepts evidence.'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: '`m2_attachment_unavailable` when storage is down. Retryable.'
  /api/v1/engagement-stages/{stage_id}/extras/:
    post:
      operationId: m2_shift_extra_propose
      description: |-
        Ask the Customer to approve overtime or an add-on **at the card's published rate**. This is a caller into the one amendment engine this codebase has, not a second one: the status machine, the expiry and the acceptance are the M1 engine's, and what this adds is the *price*, read from the card frozen on the engagement at booking.

        **There is no amount field.** The vendor names what and how much of it; the server names the money. A vendor who could type a number could re-price a job the Customer booked at a published rate, which is exactly the on-site renegotiation the rate card exists to leave nowhere to live.

        **Unapproved overtime is unpaid.** Overtime proposed while the shift is still running needs no window. Overtime for a shift that has already ended must be approved inside the configured retroactive window, and the amendment's deadline is shortened to it — past the window the request is refused outright, and while the owner has not set the window a retroactive request is refused with `m2_policy_unavailable` rather than granted on a guess.

        An add-on code that is not on the frozen card has no published price and is refused.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Stable opaque key for this logical command. Reuse it only when
          retrying the identical request; using it with a different payload returns
          409.
        required: true
      - in: path
        name: stage_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - M2 - Shift days
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShiftExtraRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ShiftExtraRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ShiftExtraRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngagementAmendment'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: '`m2_amendment_required` when this booking publishes no overtime
            or add-on rate, or the retroactive window has closed; `m2_policy_unavailable`
            when the owner has set no window; `m2_stage_transition_not_allowed` otherwise.'
  /api/v1/engagement-stages/{stage_id}/funding/:
    post:
      operationId: m2_stage_funding_checkout_create
      description: 'Fund one A5 stage, **at face value and in order**. There is no
        stage credit: the visit-plan money was spent on the visits themselves and
        settles per share, so discounting a stage by it would pay for those visits
        twice out of the vendor''s work. Projects collect one stage at a time and
        never the full project value because a proposal was accepted.'
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Stable opaque key for this logical command. Reuse it only when
          retrying the identical request; using it with a different payload returns
          409.
        required: true
      - in: path
        name: stage_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - M2 - Engagements
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessCheckout'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: '`m2_stage_not_funded` when the stage is already funded, when
            an earlier stage is not, or when the engagement is `LEAD_ONLY` and paid
            directly to the vendor.'
  /api/v1/engagement-stages/{stage_id}/settlement/:
    post:
      operationId: m2_shift_day_settled_confirm
      description: |-
        Record that this day was settled. Either party taps; the server records **who**, and nothing else.

        **No money moves here and none can.** A3 wages are direct, daily and peer-to-peer at day end — the platform never holds them. `amount_paise` is the exact published figure for the day (present workers at the day rate, plus any extras both sides accepted through the amendment engine) and `upi_payment_link` is a deep link into the Customer's own UPI app at that amount. A convenience, not a rail; `null` when the lead has published no VPA, which is an ordinary state.

        **A one-sided claim is left standing as `SUPERVISOR_CLAIMED` or `CUSTOMER_CLAIMED`.** That is what Operations reads as *unproven* — one person says they settled and the other has not answered, which is a different sentence from either "they were paid" or "they were not". Only both taps make `SETTLED`, and the amount freezes there.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Stable opaque key for this logical command. Reuse it only when
          retrying the identical request; using it with a different payload returns
          409.
        required: true
      - in: path
        name: stage_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - M2 - Shift days
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DaySettlement'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: '`m2_stage_transition_not_allowed` before the day has been
            recorded — there is no amount to settle until somebody says who was there.'
  /api/v1/engagement-stages/{stage_id}/shift/:
    get:
      operationId: m2_shift_day_read
      description: |-
        One A3 shift-day, whole. Returns the day's crew at the disclosure the caller is entitled to, the supervisor's attendance record and the evening settlement.

        **The Customer never receives `crew_member_id`.** Crew identity is global — one person is one row however many agencies carry them — so `membership_id` is published to the Partner only and the global id to nobody. What a Customer gets is a name, four digits of phone and whether this platform has verified the person's documents.

        `attendance` and `settlement` are `null` until a command touches the day. That is a real state and not a missing one: nothing is created by reading.
      parameters:
      - in: path
        name: stage_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - M2 - Shift days
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftDay'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: '`m2_stage_transition_not_allowed` on an A5 milestone: a project
            stage has no crew, no attendance and no daily settlement.'
  /api/v1/engagement-stages/{stage_id}/start/:
    post:
      operationId: m2_stage_start
      description: Begin work on a stage. `PENDING` → `IN_PROGRESS`, and `CORRECTION_REQUESTED`
        → `IN_PROGRESS` after the Customer sent it back. **A5 requires verified funding
        at face value** — the visit-plan money settles per share and never discounts
        a stage — so a funded A5 stage is already `IN_PROGRESS` and this call is an
        idempotent no-op; reaching it on an unfunded one is `m2_stage_not_funded`.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Stable opaque key for this logical command. Reuse it only when
          retrying the identical request; using it with a different payload returns
          409.
        required: true
      - in: path
        name: stage_id
