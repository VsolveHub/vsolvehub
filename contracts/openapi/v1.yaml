  /api/v1/operations/rate-cards/:
    get:
      operationId: m2_rate_card_list
      description: Every published card, newest effective date first. This is the
        monthly review calendar's read and the only surface that publishes the three
        components, because reviewing a rate against the wage floor means seeing the
        wage part of it.
      parameters:
      - in: query
        name: service_area
        schema:
          type: string
          format: uuid
        description: Narrow to one city.
      tags:
      - M2 - Rate card
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateCardList'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
    post:
      operationId: m2_rate_card_publish
      description: |-
        Publish a day rate for one city and one statutory skill, effective from a date. A card is **loaded, never edited**: a booking made last week reconciles against the number it was made at, and raising a rate is one more row.

        Two refusals are the point of this endpoint. The wage component is checked against the statutory floor with the same fail-closed guard vendor quotes pass — a platform that refuses a vendor's rate for being below the floor and publishes its own below it has no rule at all. And a card cannot be **backdated under a live booking**, because that would retroactively change the number a live booking was priced at.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Stable opaque key for this logical command. Reuse it only when
          retrying the identical request; using it with a different payload returns
          409.
        required: true
      tags:
      - M2 - Rate card
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RateCardPublishRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RateCardPublishRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RateCardPublishRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateCard'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: '`m2_proposal_below_wage_floor` when the wage component is
            under the statutory floor for that state and skill.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: '`m2_wage_floor_unavailable` when no floor is loaded for the
            area''s state and this skill, or when the area carries no state code —
            the check fails closed rather than being skipped. `m2_requirement_transition_not_allowed`
            when the effective date would land on or before a live booking made at
            the current rate.'
