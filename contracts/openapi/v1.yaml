  /api/v1/cart/:
    get:
      operationId: cart_retrieve
      tags:
      - Cart
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
