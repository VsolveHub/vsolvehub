      required:
      - expected_version
      - severity
    EvidenceFinalizeRequestRequest:
      type: object
      description: |-
        The client's claim about what it uploaded; Django streams the object and checks it.

        `sha256` is not trusted — it is *compared*. The same three-step shape FE-07 established for
        KYC: the client computes the digest locally, Django recomputes it from the bytes actually in
        the bucket, and a mismatch fails closed. Sending it is what makes the comparison possible.
      properties:
        kind:
          $ref: '#/components/schemas/WorkEvidenceKindEnum'
        object_key:
          type: string
          minLength: 1
          maxLength: 512
        content_type:
          type: string
          minLength: 1
          maxLength: 120
        size_bytes:
          type: integer
          minimum: 1
        sha256:
          type: string
          minLength: 1
          pattern: ^[0-9a-f]{64}$
        work_task_id:
          type: string
          format: uuid
          nullable: true
      required:
      - content_type
      - kind
      - object_key
      - sha256
      - size_bytes
    EvidenceUploadGrant:
      type: object
      description: |-
        A short-lived, single-attempt grant to put bytes in a private bucket.

        The token is published because the browser must send it, and for no longer than one attempt:
        FE-07 established that a signed grant lives in component state and is dropped afterwards,
        never persisted. `expires_at` is what makes that enforceable.
      properties:
        object_key:
          type: string
        upload_url:
          type: string
        upload_token:
          type: string
        resumable_url:
          type: string
        method:
          type: string
        expires_at:
          type: string
          format: date-time
      required:
      - expires_at
      - method
      - object_key
      - resumable_url
      - upload_token
      - upload_url
    EvidenceUploadRequestRequest:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/WorkEvidenceKindEnum'
        content_type:
          type: string
          minLength: 1
          maxLength: 120
        size_bytes:
          type: integer
          minimum: 1
      required:
      - content_type
      - kind
      - size_bytes
