  /api/v1/auth/session/:
    get:
      operationId: auth_session_retrieve
      tags:
      - Authentication
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionState'
              examples:
                SignedOut:
                  value:
                    user: null
                    active_role: null
                    session_expires_at: null
                  summary: Signed out
                AuthenticatedCustomer:
                  value:
                    user:
                      id: f26419bd-c768-4ddb-bff3-4cc405fdbf52
                      phone_number: '+919876543210'
                      full_name: ''
                      email: ''
                      roles:
                      - customer
                    active_role: customer
                    session_expires_at: '2026-09-01T12:00:00Z'
                  summary: Authenticated customer
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                SessionExpired:
                  value:
                    error:
                      code: session_expired
                      message: Session is no longer active.
                      details:
                        message: Session is no longer active.
                        code: session_expired
                      retryable: false
                      request_id: req_example
                  summary: Session expired
          description: ''
