    ProposalCreateRequest:
      type: object
      description: |-
        Both composers in one shape; the domain validates which fields the archetype requires.

        Deliberately not two serializers. `proposals.submit_proposal` already runs `_assert_a3_shape`
        or `_assert_a5_shape` against the requirement's own archetype, and a second archetype check
        here would be a copy of that rule which could disagree with it. A vendor sending A5 stages on
        an A3 requirement gets one refusal, from the layer that knows.
      properties:
        invitation_id:
          type: string
          format: uuid
        total_paise:
          type: integer
          minimum: 1
        tax_basis:
          $ref: '#/components/schemas/ProposalTaxBasisEnum'
        tax_paise:
          type: integer
          minimum: 0
          default: 0
        rate_paise_per_worker_day:
          type: integer
          minimum: 1
          nullable: true
        minimum_days:
          type: integer
          minimum: 1
          nullable: true
        worker_count:
          type: integer
          minimum: 1
          nullable: true
        stages:
          type: array
          items: {}
        inclusions:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
        exclusions:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
        warranty_terms:
          type: string
          maxLength: 4000
        valid_until:
          type: string
          format: date-time
          nullable: true
        commission_treatment:
          type: string
          maxLength: 24
      required:
      - invitation_id
      - tax_basis
      - total_paise
