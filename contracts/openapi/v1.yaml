        today_net_paise:
          type: integer
        today_jobs:
          type: integer
        month_net_paise:
          type: integer
        month_jobs:
          type: integer
        average_monthly_net_paise:
          type: integer
        lifetime_net_paise:
          type: integer
        lifetime_jobs:
          type: integer
        daily:
          type: array
          items:
            $ref: '#/components/schemas/PartnerDailyPerformance'
        currency:
          type: string
        server_now:
          type: string
          format: date-time
      required:
      - average_monthly_net_paise
      - currency
      - daily
      - lifetime_jobs
      - lifetime_net_paise
      - month_jobs
      - month_net_paise
      - server_now
      - today_jobs
      - today_net_paise
