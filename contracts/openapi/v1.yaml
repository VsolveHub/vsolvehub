          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - account_last4
      - created_at
      - effective_from
      - holder_name
      - id
      - ifsc
      - is_payable_now
      - status
      - verified_at
