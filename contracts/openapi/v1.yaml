  /api/v1/booking-groups/{group_id}/cancel-booked/:
    post:
      operationId: booked_group_cancel
      description: |-
        Post-payment group cancellation.

        Distinct from `POST /booking-groups/{id}/cancel/`, which is and remains the *pre-payment*
        command and still refuses a `BOOKED` group. Two different money paths — one collects
        nothing, one runs the fee ladder per unit — so they are two different operations rather
        than one endpoint that changes meaning depending on state.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Stable opaque key for this logical command. Reuse it only when
          retrying the identical request; using it with a different payload returns
          409.
        required: true
      - in: path
        name: group_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Fulfilment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupCancelRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GroupCancelRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GroupCancelRequestRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupCancellationResult'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
