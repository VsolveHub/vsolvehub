      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxDocument'
          description: ''
components:
  schemas:
    A1TaskLine:
      type: object
      properties:
        code:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        label:
          type: string
          readOnly: true
        unit_price:
          allOf:
          - $ref: '#/components/schemas/Money'
          readOnly: true
        marginal_duration_minutes:
          type: integer
          readOnly: true
      required:
      - code
      - label
      - marginal_duration_minutes
      - unit_price
    AccessCheckout:
      type: object
      description: |-
        What a client needs to hand a charge to the payment provider, and nothing more.

        No provider payload, no key, no signature — `M2-BE-415` asks for payment status without
        leaking provider internals, and the order id plus the amount is the whole of what a checkout
        sheet needs. **The status here is never the grant.** `PROVIDER_PENDING` and `CAPTURED` describe
        the *attempt*; whether the Customer actually has an unlock or a charged plan is the `unlock` or
        `visit_plan` object beside it, and only a verified callback moves that.
      properties:
        payment_attempt_id:
          type: string
          format: uuid
          readOnly: true
        amount_paise:
          type: integer
          readOnly: true
        currency:
          type: string
          readOnly: true
        provider:
          type: string
          readOnly: true
        provider_order_id:
          type: string
          readOnly: true
        status:
          type: string
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        server_now:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount_paise
      - currency
      - expires_at
      - payment_attempt_id
      - provider
      - provider_order_id
      - server_now
      - status
    AccessReceipt:
      type: object
      description: |-
        The durable reference for the access fee Vsolve actually collected (`M2-BE-415`).

        Not an invoice. `TaxDocument.order` is not nullable and an access fee has no `Order`, so making
        it nullable to fit one would weaken the invariant every M1 invoice depends on; the number comes
        from the same `commerce.DocumentSequence` under an `M2A-` series, which is gapless and is the
        one numbering authority. GST treatment of the unlock and the visit-plan fee is blocking owner
        decision 5, so this is a receipt reference and says so.

        `number` is formatted server-side in the `series-sequence` shape
        `commerce.TaxDocumentSerializer.get_number` already publishes, because the string a Customer
        quotes to support should not be assembled differently by each app that renders it.
      properties:
        kind:
          type: string
          readOnly: true
        number:
          type: string
          readOnly: true
        series:
          type: string
          readOnly: true
        sequence:
          type: integer
          readOnly: true
        amount_paise:
          type: integer
          readOnly: true
      required:
      - amount_paise
      - kind
      - number
      - sequence
      - series
    ActionEnum:
      enum:
      - KEEP_CUSTOMER
      - KEEP_SESSION
      - KEEP_BOTH
      type: string
      description: |-
        * `KEEP_CUSTOMER` - KEEP_CUSTOMER
        * `KEEP_SESSION` - KEEP_SESSION
        * `KEEP_BOTH` - KEEP_BOTH
    ActiveRole:
      type: object
      properties:
        active_role:
          type: string
          readOnly: true
          nullable: true
      required:
      - active_role
    Address:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        label:
          type: string
          maxLength: 60
        line1:
          type: string
          maxLength: 200
        line2:
          type: string
          maxLength: 200
        landmark:
          type: string
          maxLength: 160
        locality:
          type: string
          maxLength: 160
        city:
          type: string
          maxLength: 120
        state:
          type: string
          maxLength: 120
        postal_code:
          type: string
          maxLength: 12
        country_code:
          type: string
          maxLength: 2
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        source:
          $ref: '#/components/schemas/SourceEnum'
        confirmed_at:
          type: string
          format: date-time
          readOnly: true
        is_default:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - city
      - confirmed_at
      - created_at
      - id
      - label
      - latitude
      - line1
      - locality
      - longitude
      - postal_code
      - state
      - updated_at
    AddressRequest:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 60
        line1:
          type: string
          minLength: 1
          maxLength: 200
        line2:
          type: string
          maxLength: 200
        landmark:
          type: string
          maxLength: 160
        locality:
          type: string
          minLength: 1
          maxLength: 160
        city:
          type: string
          minLength: 1
          maxLength: 120
        state:
          type: string
          minLength: 1
          maxLength: 120
        postal_code:
          type: string
          minLength: 1
          maxLength: 12
        country_code:
          type: string
          minLength: 1
          maxLength: 2
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        source:
          $ref: '#/components/schemas/SourceEnum'
        is_default:
          type: boolean
      required:
      - city
      - label
      - latitude
      - line1
      - locality
      - longitude
      - postal_code
      - state
    AmendmentApprovalResult:
      type: object
      properties:
        amendment:
          $ref: '#/components/schemas/ScopeAmendment'
        payment_attempt_id:
          type: string
          format: uuid
        amount_paise:
          type: integer
        currency:
          type: string
      required:
      - amendment
      - amount_paise
      - currency
      - payment_attempt_id
    AmendmentLine:
      type: object
      description: |-
        One line of a change request, priced.

        `amount_paise` is signed on the wire even though the stored column is not: the M1
        `ScopeAmendmentLine` was built for additions only, so it holds an absolute value and the sign
        lives in the line's snapshot. Publishing the signed number is what lets one screen render both
        an addition and a reduction without knowing which table the sign came from.
      properties:
        position:
          type: integer
          readOnly: true
        kind:
          type: string
          readOnly: true
        title:
          type: string
          readOnly: true
        quantity:
          type: integer
          readOnly: true
        amount_paise:
          type: integer
          readOnly: true
      required:
      - amount_paise
      - kind
      - position
      - quantity
      - title
    AmendmentLineInputRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 240
        quantity:
          type: integer
          maximum: 999
          minimum: 1
        amount_paise:
          type: integer
          nullable: true
      required:
      - quantity
      - title
    ApiError:
      type: object
      properties:
        error:
          allOf:
          - $ref: '#/components/schemas/ApiErrorDetail'
          readOnly: true
      required:
      - error
    ApiErrorDetail:
      type: object
      properties:
        code:
          type: string
          readOnly: true
        message:
          type: string
          readOnly: true
        details:
          readOnly: true
          nullable: true
        retryable:
          type: boolean
          readOnly: true
        request_id:
          type: string
          readOnly: true
          nullable: true
      required:
      - code
      - details
      - message
      - request_id
      - retryable
    AssignedProfessional:
      type: object
      description: |-
        The person coming, as the Customer may see them.

        Deliberately thin. A Partner's phone number, documents and application are
        theirs; what a Customer needs is who is arriving and what they do. There is
        no rating here because the platform has no review model yet — publishing a
        number with nothing behind it would be worse than publishing none.
      properties:
        display_name:
          type: string
        headline:
          type: string
        experience_years:
          type: integer
      required:
      - display_name
      - experience_years
      - headline
    AssistedCheckoutCreateRequest:
      type: object
      properties:
        customer_id:
          type: string
          format: uuid
        quote_id:
          type: string
          format: uuid
        consent_purpose:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
        consent_version:
          type: string
          minLength: 1
          maxLength: 100
      required:
      - consent_purpose
      - consent_version
      - customer_id
      - quote_id
    AssistedStartRequestRequest:
      type: object
      description: |-
        The floor every state-changing fulfilment command sits on.

        `expected_version` is required, never defaulted. A command that would apply to whatever
        state it happens to find is the thing optimistic concurrency exists to prevent, and a
        default here would silently reintroduce it for every caller that forgot the field.
      properties:
        expected_version:
          type: integer
          minimum: 1
        outage_reason:
          type: string
          minLength: 1
          maxLength: 240
      required:
      - expected_version
      - outage_reason
    AttachmentFinalizeRequest:
      type: object
      properties:
        upload_id:
          type: string
          format: uuid
      required:
      - upload_id
    AttachmentUploadGrant:
      type: object
      description: The signed-upload grant. Bytes go to storage, never through Django.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kind:
          type: string
          readOnly: true
        upload_url:
          type: string
          format: uri
          readOnly: true
        upload_token:
          type: string
          readOnly: true
        upload_expires_at:
          type: string
          format: date-time
          readOnly: true
        scan_status:
          type: string
          readOnly: true
        server_now:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - kind
      - scan_status
      - server_now
      - upload_expires_at
      - upload_token
      - upload_url
    AttachmentUploadRequestRequest:
      type: object
      description: |-
        What the client declares before any bytes exist.

        The checksum is required, and it is the point of the whole handshake: finalization streams the
        stored object back and compares it against these three values, so an upload that swapped the
        file after presigning is refused rather than stored. Without them "verify the upload" would mean
        "believe the client".
      properties:
        kind:
          $ref: '#/components/schemas/RequirementAttachmentKindEnum'
        content_type:
          type: string
          minLength: 1
          maxLength: 120
        size_bytes:
          type: integer
          minimum: 1
        sha256:
          type: string
          minLength: 64
          maxLength: 64
        language:
          type: string
          default: ''
          maxLength: 16
      required:
      - content_type
      - kind
      - sha256
      - size_bytes
    AttendanceResponseEnum:
      enum:
      - CONFIRM
      - DISPUTE
      type: string
      description: |-
        * `CONFIRM` - The count is right
