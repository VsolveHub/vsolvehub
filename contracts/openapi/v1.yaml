  /api/v1/proposals/:
    post:
      operationId: m2_proposal_submit
      description: 'Submit a quote, or a revision that supersedes this vendor''s previous
        one. Proposals are append-only: a revision never overwrites what the Customer
        was originally offered. The archetype decides which fields are required and
        the server enforces it.'
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Stable opaque key for this logical command. Reuse it only when
          retrying the identical request; using it with a different payload returns
          409.
