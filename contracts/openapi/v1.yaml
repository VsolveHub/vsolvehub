              $ref: '#/components/schemas/AssistedCheckoutCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkout'
          description: ''
  /api/v1/operations/checkouts/{checkout_id}/offers/:
    post:
      operationId: operations_checkouts_offers_create
      parameters:
      - in: path
        name: checkout_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
