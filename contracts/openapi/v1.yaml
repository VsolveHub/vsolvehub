          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/cart/items/{item_id}/:
    patch:
      operationId: cart_items_partial_update
      parameters:
      - in: path
        name: item_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Cart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCartItemUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCartItemUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCartItemUpdateRequest'
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
    delete:
      operationId: cart_items_destroy
      description: |-
        Retained for callers already sending a DELETE body.

        The request shape is still dropped from the published document by the
        schema generator, so generated clients must use the POST sibling.  This
        method exists only so existing hand-written callers keep working, and it
        runs the same `remove_cart_item` command with no removal logic of its own.
      parameters:
      - in: path
        name: item_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Cart
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/cart/items/{item_id}/remove/:
    post:
      operationId: cart_items_remove
      description: |-
        `POST /cart/items/{item_id}/remove/` — the publishable removal command.

        drf-spectacular does not emit a `requestBody` for DELETE, so the optimistic
        version pair Django requires was unreachable from a generated client.  This
        sibling publishes the same body, calls the same domain service and returns the
        same complete Cart.  No `Idempotency-Key` is required: the version pair is the
        replay protection, because a repeat of an accepted removal can no longer match
        a live row.
      parameters:
      - in: path
        name: item_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Cart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemRemoveRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CartItemRemoveRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CartItemRemoveRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/cart/merge/:
    post:
      operationId: cart_merge_create
      tags:
