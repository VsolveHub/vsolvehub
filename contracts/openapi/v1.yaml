  /api/v1/booking-groups/{group_id}/cancel/:
    post:
      operationId: booking_group_cancel
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Stable opaque key for this logical command. Reuse it only when
          retrying the identical request; using it with a different payload returns
          409.
        required: true
      - in: path
        name: group_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Booking Groups
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingGroupCancelRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookingGroupCancelRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookingGroupCancelRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingGroup'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '403':
          content:
            application/json:
