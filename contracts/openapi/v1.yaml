  /api/v1/scope-amendments/{amendment_id}/approve/:
    post:
      operationId: scope_amendment_approve
      description: |-
        Approve or decline proposed extra work.

        Approval is not a state flag — it mints the `PriceRevision` and its `PaymentAttempt` in the
        same transaction, so a Customer cannot approve work that never gets billed. The response
        carries the attempt id because the client's next step is to pay it.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Stable opaque key for this logical command. Reuse it only when
          retrying the identical request; using it with a different payload returns
          409.
        required: true
      - in: path
        name: amendment_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Fulfilment
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AmendmentApprovalResult'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
