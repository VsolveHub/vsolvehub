      required:
      - code
      - description
      - id
      - label
    ServiceVariantConfiguration:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        pricing_strategy:
          allOf:
          - $ref: '#/components/schemas/PricingStrategyEnum'
          readOnly: true
        starting_price:
          allOf:
          - $ref: '#/components/schemas/Money'
          readOnly: true
        minimum_duration_minutes:
          type: integer
          readOnly: true
        recommended_duration_minutes:
          type: integer
          readOnly: true
        duration_increment_minutes:
          type: integer
          readOnly: true
        maximum_duration_minutes:
          type: integer
          readOnly: true
        required_skill_code:
          type: string
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
        questions:
          type: array
          items:
            $ref: '#/components/schemas/ServiceQuestion'
          readOnly: true
      required:
      - code
      - description
      - duration_increment_minutes
      - id
      - maximum_duration_minutes
      - minimum_duration_minutes
      - name
      - pricing_strategy
      - questions
      - recommended_duration_minutes
      - required_skill_code
      - starting_price
    ServiceabilityRequestRequest:
      type: object
      properties:
        postal_code:
          type: string
          minLength: 1
          maxLength: 12
        service_variant_id:
          type: string
          format: uuid
        requested_start:
          type: string
          format: date-time
        duration_minutes:
          type: integer
          maximum: 1440
          minimum: 1
      required:
      - postal_code
    ServiceabilityResponse:
      type: object
      properties:
        is_serviceable:
          type: boolean
          readOnly: true
        reason_code:
          type: string
          readOnly: true
          nullable: true
        service_area:
          allOf:
          - $ref: '#/components/schemas/ServiceArea'
          readOnly: true
          nullable: true
        server_now:
          type: string
          format: date-time
          readOnly: true
      required:
      - is_serviceable
      - reason_code
      - server_now
      - service_area
    SourceEnum:
      enum:
      - MANUAL
      - REVERSE_GEOCODED
      type: string
      description: |-
        * `MANUAL` - Manual
        * `REVERSE_GEOCODED` - Reverse geocoded
    Subcategory:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
      required:
      - description
      - id
      - name
      - slug
    TargetStatusEnum:
      enum:
      - UNDER_REVIEW
      - CHANGES_REQUIRED
      - APPROVED
      - SUSPENDED
      - OFFBOARDED
      type: string
      description: |-
        * `UNDER_REVIEW` - UNDER_REVIEW
        * `CHANGES_REQUIRED` - CHANGES_REQUIRED
        * `APPROVED` - APPROVED
        * `SUSPENDED` - SUSPENDED
        * `OFFBOARDED` - OFFBOARDED
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        phone_number:
          type: string
          readOnly: true
        full_name:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        roles:
          type: array
          items:
            type: string
          readOnly: true
      required:
      - email
      - full_name
      - id
      - phone_number
      - roles
    UserSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        device_label:
          type: string
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        last_seen_at:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
        is_current:
          type: boolean
          readOnly: true
      required:
      - created_at
      - device_label
      - expires_at
      - id
      - is_current
      - last_seen_at
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: vsolve_session
      description: Revocable Django session cookie. Mutations also require a CSRF
        token.
