      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualOfferRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ManualOfferRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ManualOfferRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
          description: ''
  /api/v1/operations/partner-applications/:
    get:
      operationId: operations_partner_application_queue_list
      parameters:
      - in: query
        name: assigned_to_me
        schema:
          type: boolean
          default: false
      - in: query
        name: cursor
        schema:
          type: string
          minLength: 1
      - in: query
        name: status
        schema:
          enum:
          - SUBMITTED
          - UNDER_REVIEW
          - CHANGES_REQUIRED
          type: string
          minLength: 1
        description: |-
          * `SUBMITTED` - SUBMITTED
          * `UNDER_REVIEW` - UNDER_REVIEW
          * `CHANGES_REQUIRED` - CHANGES_REQUIRED
      - in: query
        name: unassigned
        schema:
          type: boolean
          default: false
      tags:
      - Operations
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationsApplicationQueuePage'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/operations/partner-applications/{application_id}/:
    get:
      operationId: operations_partner_application_detail_retrieve
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Operations
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerApplication'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/operations/partner-applications/{application_id}/claim/:
    post:
      operationId: operations_partner_applications_claim_create
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Operations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpectedVersionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ExpectedVersionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExpectedVersionRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerApplication'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                PartnerApplicationVersionConflict:
                  value:
                    error:
                      code: partner_application_version_conflict
                      message: This application changed in another session. Refresh
                        and try again.
                      details:
                        message: This application changed in another session. Refresh
                          and try again.
                        code: partner_application_version_conflict
                      retryable: true
                      request_id: req_example
                  summary: Partner application version conflict
          description: ''
  /api/v1/operations/partner-applications/{application_id}/transition/:
    post:
      operationId: operations_partner_applications_transition_create
      parameters:
      - in: path
        name: application_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Operations - Partners
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationsTransitionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OperationsTransitionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OperationsTransitionRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerApplication'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '409':
          content:
            application/json:
