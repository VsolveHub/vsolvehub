        id:
          type: string
          format: uuid
          readOnly: true
        requirement:
          type: string
          format: uuid
          readOnly: true
        proposal:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        partner:
          type: string
          format: uuid
          readOnly: true
        archetype:
          type: string
          readOnly: true
        commercial_mode:
          allOf:
          - $ref: '#/components/schemas/EngagementCommercialModeEnum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/EngagementStatusEnum'
          readOnly: true
        total_paise:
          type: integer
          readOnly: true
        tax_paise:
          type: integer
          readOnly: true
        tax_basis:
          type: string
          readOnly: true
        commission_paise:
          type: integer
          readOnly: true
        commission_treatment:
          type: string
          readOnly: true
        staged_total_paise:
          type: integer
          readOnly: true
        amendment_delta_paise:
          type: integer
          readOnly: true
        funded_total_paise:
          type: integer
          readOnly: true
        approved_total_paise:
          type: integer
          readOnly: true
        released_total_paise:
          type: integer
          readOnly: true
        refunded_total_paise:
          type: integer
          readOnly: true
        contact_released_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        work_may_start_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        disputed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        access_receipt:
          allOf:
          - $ref: '#/components/schemas/AccessReceipt'
          nullable: true
          readOnly: true
        stages:
          type: array
          items:
            $ref: '#/components/schemas/EngagementStage'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - access_receipt
      - amendment_delta_paise
      - approved_total_paise
      - archetype
      - commercial_mode
      - commission_paise
      - commission_treatment
      - completed_at
      - contact_released_at
      - created_at
      - disputed_at
      - funded_total_paise
      - id
      - partner
      - proposal
      - refunded_total_paise
      - released_total_paise
      - requirement
      - staged_total_paise
      - stages
      - status
      - tax_basis
      - tax_paise
      - total_paise
      - work_may_start_at
