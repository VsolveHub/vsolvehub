      type: object
      description: |-
        How a Partner is doing, in the periods they think in.

        Counts come from `EARNING` ledger entries — one per completed booking, written
        at settlement — so "jobs done" is never inferred from a mutable booking
        timestamp. Revenue sums every entry kind, so an adjustment or reversal shows
        up the day it lands rather than drifting from the balance beside it.
      properties:
        today_net_paise:
          type: integer
        today_jobs:
          type: integer
        month_net_paise:
          type: integer
        month_jobs:
          type: integer
        average_monthly_net_paise:
          type: integer
        lifetime_net_paise:
          type: integer
        lifetime_jobs:
          type: integer
        daily:
          type: array
          items:
            $ref: '#/components/schemas/PartnerDailyPerformance'
        currency:
          type: string
        server_now:
          type: string
          format: date-time
      required:
      - average_monthly_net_paise
      - currency
      - daily
      - lifetime_jobs
      - lifetime_net_paise
      - month_jobs
      - month_net_paise
      - server_now
      - today_jobs
      - today_net_paise
