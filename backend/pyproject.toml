[project]
name = "vsolve-hub-backend"
version = "0.1.0"
description = "Vsolve Hub Django business backend"
requires-python = ">=3.13,<3.14"
readme = "README.md"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [
  ".venv",
  "migrations",
]

[tool.ruff.lint]
select = [
  "A",
  "ARG",
  "ASYNC",
  "B",
  "C4",
  "DJ",
  "E",
  "F",
  "I",
  "N",
  "PERF",
  "PIE",
  "PL",
  "RUF",
  "S",
  "SIM",
  "T20",
  "UP",
  "W",
]
ignore = [
  "DJ001",
  "PLR0913",
]

[tool.ruff.lint.per-file-ignores]
# `models/` is the package form of the same thing: apps whose model layer outgrew one file split it
# into `models/<slice>.py` with a re-exporting `__init__.py`. The ignore has to name both spellings
# or it silently stops applying the moment an app crosses that line.
"**/models.py" = ["RUF012"]
"**/models/*.py" = ["RUF012"]
"config/settings/*.py" = ["F403", "F405"]
# A test's expected value *is* the specification: `assert refund.amount_paise == 45000` reads
# better than a constant named for it. Same call already made for listings tests and seeds.
"tests/**/*.py" = ["S101", "PLR2004"]
"tests/listings/**/*.py" = ["S101", "E501", "PLR2004", "I001", "F401"]
# Seed commands drive real endpoints and assert the responses, and use `random` for spread.
# Neither is a security property: every one of them refuses to run outside `DEBUG`.
"**/management/commands/seed_*.py" = ["S101", "S311", "ARG002", "E501", "PLR2004"]
# `scripts/` is the developer CLI: one-off tools run by hand from a terminal, whose whole output
# contract is stdout. T201 exists to stop `print` leaking into request paths, and there is no
# request path here -- so the rule fires on every line that is doing its job correctly.
"scripts/*.py" = ["T201"]
# The seed scripts are the CLI twin of the seed commands above, and get the same allowances for the
# same reasons: `random` spreads demo data and is no security property, and long literal strings are
# demo copy. E402 is the price of a standalone script: Django must be set up before models import.
"scripts/seed_*.py" = ["T201", "S311", "E501", "E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=apps",
  "--cov=common",
  "--cov-report=term-missing",
  "-ra",
  "-m",
  "not integration",
]
markers = [
  "integration: requires PostgreSQL and Redis",
]

[tool.coverage.run]
branch = true
source = ["apps", "common"]
omit = [
  "*/migrations/*",
  "*/tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = true
warn_unused_configs = true
exclude = [
  "/migrations/",
  "/.venv/",
]

[tool.django-stubs]
django_settings_module = "config.settings.test"

[[tool.mypy.overrides]]
module = [
  "boto3",
  "botocore.*",
  "celery",
  "environ",
  # Arrives with drf-spectacular; no typeshed stubs are published for it.
  "jsonschema",
  "jsonschema.*",
]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = "apps.*.admin"
disable_error_code = ["type-arg"]

[[tool.mypy.overrides]]
module = "apps.*.tasks"
# Celery's shared_task decorator is not fully typed.
disable_error_code = ["untyped-decorator"]

[[tool.mypy.overrides]]
# Same reason one block up, for Celery's signal decorators rather than its task decorator.
# `common.observability.tasks` is the correlation-id bridge (`M2-BE-808`) and is nothing but three
# `@signal.connect` handlers, so without this every function in it is reported untyped.
module = "common.observability.tasks"
disable_error_code = ["untyped-decorator", "import-untyped"]
