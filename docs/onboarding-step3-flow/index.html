<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Step 3 Flow Mock</title>
<style>
:root{
  --bg:#eef1f6; --panel:#ffffff; --ink:#0d1b2e; --ink2:#4a5a70; --muted:#8392a6; --line:#dde3ec;
  --navy:#00204d; --navy2:#123d7a; --teal:#0f7d72; --teal-bg:#e4f5f2; --amber:#a24a05; --amber-bg:#fff4e0;
  --red:#b4123a; --red-bg:#fdecef; --blue:#1d4ed8; --blue-bg:#eaf1ff; --grey-bg:#f2f4f8;
  --shadow:0 12px 32px rgba(13,27,46,.14);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
code{font:12px/1.3 ui-monospace,Consolas,monospace;background:var(--grey-bg);border:1px solid var(--line);border-radius:5px;padding:0 4px;word-break:break-all}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--navy);color:#fff;flex-wrap:wrap}
.top .t{font-weight:800;letter-spacing:.01em}
.top .sub{opacity:.75;font-size:12.5px}
.top .sp{flex:1}
.top button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:6px 12px;color:#fff;font-weight:600}
.top button:hover{background:rgba(255,255,255,.22)}
.top button:disabled{opacity:.35;cursor:default}
.count{font-variant-numeric:tabular-nums;font-weight:700;min-width:58px;text-align:center}
.mock-badge{display:inline-block;background:#ffe9a8;color:#5c4300;border:1px solid #e9c55a;border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:800;letter-spacing:.02em;white-space:nowrap}

/* ---------- slides ---------- */
.slide{display:none;max-width:1440px;margin:0 auto;padding:18px 24px 40px}
.slide.on{display:block}
.s-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.kicker{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--teal)}
.s-head h2{margin:2px 0 0;font-size:26px;line-height:1.15}
.s-body{display:grid;grid-template-columns:minmax(260px,350px) minmax(0,1fr);gap:24px;align-items:start}
.s-body.full{grid-template-columns:minmax(0,1fr)}
.notes{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;font-size:13.5px}
.notes h4{margin:12px 0 6px;font-size:13px}
.notes h4:first-child{margin-top:0}
.notes ul,.notes ol{margin:4px 0 8px;padding-left:18px}
.notes li{margin:3px 0}
.tag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:2px 7px;margin-right:6px;vertical-align:1px}
.tag.today{background:var(--grey-bg);color:var(--ink2);border:1px solid var(--line)}
.tag.prop{background:var(--teal-bg);color:var(--teal);border:1px solid #b9e3dc}
.tag.prob{background:var(--red-bg);color:var(--red);border:1px solid #f4c3cf}
.frames{min-width:0}
.phones{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:8px}
figcaption{font-size:12.5px;color:var(--ink2);max-width:300px;text-align:center}
@media (max-width:1000px){.s-body{grid-template-columns:minmax(0,1fr)}}
@media (max-width:600px){.slide{padding:14px 16px 32px}.s-head h2{font-size:21px}}

/* ---------- phone ---------- */
.phone{width:300px;height:620px;border:10px solid #121826;border-radius:38px;background:#f6f7fa;position:relative;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.ph-status{display:flex;justify-content:space-between;padding:5px 18px 3px;font-size:11px;font-weight:700;background:#fff}
.ph-mock{background:#ffe9a8;color:#5c4300;font-size:9.5px;font-weight:800;text-align:center;padding:2px 4px;letter-spacing:.02em}
.ph-bar{display:flex;align-items:center;gap:6px;padding:7px 10px 7px 4px;background:#fff}
.ph-back{border:0;background:none;font-size:24px;line-height:1;padding:0 8px;color:var(--navy)}
.ph-step{font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.ph-title{font-size:14px;font-weight:800}
.ph-prog{height:3px;background:var(--line)}
.ph-prog i{display:block;height:100%;background:var(--teal)}
.ph-body{flex:1;overflow:auto;padding:12px 13px 16px}
.ph-foot{padding:9px 12px 12px;background:#fff;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.ph-tools{display:flex;justify-content:center}
.ph-tools button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:3px 10px;font-size:12px;color:var(--ink2)}
.ph-h{margin:2px 0 4px;font-size:18px;line-height:1.2;font-weight:800}
.ph-p{margin:0 0 10px;color:var(--ink2);font-size:12.5px}
.lbl{font-size:11px;font-weight:800;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 6px}
.card .lbl:first-child{margin-top:0}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px;margin:10px 0}
.fine{font-size:11.5px;color:var(--muted);margin:6px 0}
.pbtn{display:block;width:100%;border-radius:11px;padding:10px 12px;font-weight:700;font-size:13px;border:1px solid transparent;text-align:center}
.pbtn.primary{background:var(--navy);color:#fff}
.pbtn.ghost{background:#fff;border-color:var(--line);color:var(--navy)}
.pbtn.link{background:none;color:var(--navy2);text-decoration:underline;padding:6px}
.pbtn.sm{width:auto;padding:8px 12px}
.pbtn:disabled{opacity:.4;cursor:default}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.row2 .pbtn{font-size:12px;padding:9px 6px}
.prow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 10px;margin:6px 0}
.prow.on{border-color:#7cc7bb;background:var(--teal-bg)}
.prow.off{opacity:.7;cursor:default}
.prow small{display:block;color:var(--muted);font-size:11px}
.prow .nm{flex:1;font-weight:600;font-size:13px}
.cbx{width:20px;height:20px;border:2px solid #9aa8bb;border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:900;flex:none;color:#fff}
.prow.on .cbx{background:var(--teal);border-color:var(--teal)}
.banner{border-radius:12px;padding:9px 11px;font-size:12.5px;margin:8px 0;border:1px solid}
.banner small{color:inherit;opacity:.85}
.banner.ok{background:var(--teal-bg);border-color:#b9e3dc;color:#0b5a52}
.banner.warn{background:var(--amber-bg);border-color:#f3d39c;color:var(--amber)}
.banner.info{background:var(--blue-bg);border-color:#c6d7fb;color:#1e3a8a}
.banner.err{background:var(--red-bg);border-color:#f4c3cf;color:var(--red)}
.banner .pbtn{margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;background:#fff}
button.chip{cursor:pointer}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip.warn{background:var(--amber-bg);border-color:#f3d39c;color:var(--amber)}
.chip.info{background:var(--blue-bg);border-color:#c6d7fb;color:#1e3a8a}
.in{width:100%;border:1px solid #c5cfdc;border-radius:10px;padding:9px 10px;background:#fff;font-size:14px}
.in:focus{outline:2px solid #7aa7f0;border-color:transparent}
.inrow{display:flex;gap:6px}
.inrow .in{flex:1;min-width:0}
.err{color:var(--red);font-size:12px;font-weight:600;margin:5px 0}
.try{font-size:11px;color:var(--muted);margin:6px 0;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.mini{border:1px solid var(--line);background:#fff;border-radius:7px;padding:2px 7px;font-size:11px;font-weight:700;color:var(--navy2)}
.or{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11px;margin:12px 0 2px}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.srow{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:#fff;padding:9px 6px;font-size:13px}
.sugg{background:#fff;border-radius:10px;margin-top:4px}
.done{width:54px;height:54px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-size:28px;font-weight:900;margin:8px auto 10px}
.center{text-align:center}
.grp{display:flex;align-items:center;gap:6px;margin:12px 0 2px;font-size:12px}
.grp b{flex:1}
.grp span{color:var(--muted)}
.list-head{position:sticky;top:-12px;background:#f6f7fa;padding:2px 0 6px;z-index:2}
.sec{display:flex;align-items:center;gap:6px;font-weight:800;font-size:13px;margin:12px 0 4px}
.sec .n{margin-left:auto;font-size:11px;color:var(--muted);font-weight:700}
.li{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 9px;margin:4px 0;font-size:12.5px}
.li .grow{flex:1}
.li small{color:var(--muted)}
.x{border:0;background:none;color:var(--muted);font-size:16px;line-height:1;padding:0 2px}
.minitag{font-size:10px;font-weight:800;border-radius:6px;padding:1px 6px}
.minitag.warn{background:var(--amber-bg);color:var(--amber)}
.minitag.err{background:var(--red-bg);color:var(--red)}
.minitag.info{background:var(--blue-bg);color:#1e3a8a}
.swrow{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;font-weight:700;font-size:13px;text-align:left}
.sw{width:38px;height:22px;border-radius:999px;background:#c5cfdc;position:relative;flex:none;transition:background .15s}
.sw i{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--teal)}
.sw.on i{left:19px}
.seg{display:flex;background:#e7ebf1;border-radius:10px;padding:3px;gap:3px;margin:8px 0}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:6px 4px;font-size:12px;font-weight:700;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.hgrid{background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px 10px}
.hgrid div{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #eef1f5;font-size:12.5px}
.hgrid div:last-child{border-bottom:0}
.hgrid .off{color:var(--muted)}
.acc{background:#fff;border:1px solid var(--line);border-radius:12px;margin:6px 0;padding:8px 10px;font-size:12.5px}
.acc .h{display:flex;justify-content:space-between;font-weight:700}
.sumrow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #eef1f5;font-size:12.5px}
.sumrow b{font-weight:700}
.sumrow span{text-align:right;color:var(--ink2)}
.tl{margin:12px 0;padding-left:4px}
.tl div{display:flex;gap:8px;align-items:center;font-size:12.5px;margin:6px 0}
.tl i{width:12px;height:12px;border-radius:50%;border:2px solid var(--teal);flex:none}
.tl i.f{background:var(--teal)}
.radio{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 10px;margin:6px 0;font-size:12.5px;width:100%;text-align:left}
.radio .dot{width:18px;height:18px;border-radius:50%;border:2px solid #9aa8bb;flex:none;margin-top:1px}
.radio.on{border-color:#7cc7bb;background:var(--teal-bg)}
.radio.on .dot{border:5px solid var(--teal)}
.ovl{position:absolute;inset:0;background:rgba(10,18,32,.5);display:flex;flex-direction:column;justify-content:flex-end;z-index:5}
.ovl.mid{justify-content:center;align-items:center}
.sheet{background:#fff;border-radius:18px 18px 0 0;padding:16px 14px 14px}
.sheet h4{margin:0 0 6px;font-size:16px}
.sheet ul{padding-left:18px;margin:6px 0 10px;font-size:12.5px;color:var(--ink2)}
.sheet .pbtn{margin-top:6px}
.sysdlg{width:84%;background:#fbfbfd;border-radius:16px;overflow:hidden;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.sysdlg .q{padding:16px 14px 12px;font-size:13.5px}
.sysdlg .q small{display:block;color:var(--muted);margin-top:6px;font-size:11.5px}
.sysdlg button{display:block;width:100%;border:0;border-top:1px solid #e3e6ec;background:none;padding:11px;color:#1a5fd8;font-weight:600;font-size:13.5px}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;animation:sp .8s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
.loading{color:#fff;text-align:center;font-weight:700}
.lock{flex:1;background:linear-gradient(160deg,#0b2a5b,#0f7d72);color:#fff;padding:40px 14px 14px;display:flex;flex-direction:column;align-items:center}
.lk-time{font-size:56px;font-weight:300;line-height:1}
.lk-date{font-size:13px;opacity:.85;margin:6px 0 26px}
.notif{width:100%;text-align:left;background:rgba(255,255,255,.92);color:var(--ink);border:0;border-radius:16px;padding:10px 12px;font-size:12.5px;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.nt-app{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink2);margin-bottom:4px}
.ico{width:18px;height:18px;border-radius:5px;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:10px;font-weight:900}
.lk-hint{margin-top:auto;font-size:11.5px;opacity:.8}

/* ---------- desktop frame ---------- */
.desk{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;width:100%;position:relative}
.desk-top{display:flex;align-items:center;gap:10px;background:#e8ecf2;padding:7px 12px;flex-wrap:wrap}
.dots{display:flex;gap:5px}
.dots i{width:10px;height:10px;border-radius:50%;background:#c3cad6}
.url{flex:1;background:#fff;border-radius:6px;padding:3px 10px;font-size:11.5px;color:var(--muted);min-width:140px}
.desk-main{display:grid;grid-template-columns:170px minmax(0,1fr);min-height:580px}
.desk-nav{background:var(--navy);padding:12px 8px;display:flex;flex-direction:column;gap:2px}
.desk-nav .brand{color:#fff;font-weight:800;padding:4px 8px 12px}
.desk-nav button{border:0;background:none;color:#c6d4ea;text-align:left;padding:7px 10px;border-radius:8px;font-size:13px}
.desk-nav button.on{background:rgba(255,255,255,.14);color:#fff;font-weight:700}
.desk-nav button:hover{background:rgba(255,255,255,.08)}
.desk-body{padding:16px;min-width:0;position:relative}
.d-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.d-h h3{margin:0;font-size:18px;flex:1}
.dbtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;font-weight:600;font-size:12.5px;color:var(--navy)}
.dbtn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.dbtn.warn{color:var(--amber);border-color:#f3d39c;background:var(--amber-bg)}
.dbtn.danger{color:var(--red);border-color:#f4c3cf;background:#fff}
.dbtn:disabled{opacity:.4;cursor:default}
.dbtn.sm{padding:3px 8px;font-size:11.5px}
.tw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:7px 8px;border-bottom:1px solid #eef1f5;vertical-align:middle}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:#f7f9fc}
.tbl tr.sel td{background:var(--blue-bg)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:800;white-space:nowrap}
.pill.ok{background:var(--teal-bg);color:#0b5a52}
.pill.low{background:var(--amber-bg);color:var(--amber)}
.pill.crit{background:var(--red-bg);color:var(--red)}
.pill.gap{background:#ede9fe;color:#5b21b6}
.pill.grey{background:var(--grey-bg);color:var(--ink2)}
.pill.info{background:var(--blue-bg);color:#1e3a8a}
.d-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px}
@media (max-width:1100px){.d-grid{grid-template-columns:minmax(0,1fr)}}
.panel{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;min-width:0}
.panel h5{margin:0 0 8px;font-size:13px}
.frow{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px;align-items:center;margin:6px 0;font-size:12.5px}
.frow label{color:var(--ink2);font-weight:600}
.din{border:1px solid #c5cfdc;border-radius:7px;padding:5px 8px;width:100%;background:#fff;font-size:12.5px}
textarea.din{min-height:96px;font-family:ui-monospace,Consolas,monospace;font-size:12px}
.pinchip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 9px;font-size:12px;margin:2px;background:#fff}
.svc{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;padding:3px 0}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}
@media (max-width:800px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}
.kpi .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.kpi .k{font-size:11.5px;color:var(--ink2)}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px;align-items:center}
.fgrp{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--ink2);flex-wrap:wrap}
.fgrp b{margin-right:2px}
.fgrp button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:600}
.fgrp button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.tbar{display:flex;align-items:center;gap:6px;min-width:120px}
.tbar .b{flex:1;height:7px;background:#e7ebf1;border-radius:4px;overflow:hidden;min-width:50px}
.tbar .b i{display:block;height:100%}
.tbar span{font-size:11.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.modal{position:absolute;inset:0;background:rgba(10,18,32,.45);display:flex;align-items:center;justify-content:center;z-index:10;padding:16px}
.mbox{background:#fff;border-radius:14px;width:min(520px,100%);padding:16px;box-shadow:0 12px 40px rgba(0,0,0,.3);max-height:100%;overflow:auto}
.mbox h4{margin:0 0 4px}
.msg{background:var(--grey-bg);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12.5px;margin:8px 0}
.flag{display:flex;gap:8px;align-items:flex-start;border-radius:10px;padding:9px 10px;margin:6px 0;font-size:12.5px;border:1px solid}
.flag.warn{background:var(--amber-bg);border-color:#f3d39c}
.flag.ok{background:var(--teal-bg);border-color:#b9e3dc}
.flag.info{background:var(--blue-bg);border-color:#c6d7fb}
.flag.bad{background:var(--red-bg);border-color:#f4c3cf;color:var(--red)}
.flag .grow{flex:1}
.ghostold{border:1px dashed #c5cfdc;border-radius:10px;padding:8px 10px;font-size:12px;color:var(--muted);margin-bottom:10px}
.ghostold s{color:var(--ink2)}
.decision{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 0 0;margin-top:12px;display:flex;flex-wrap:wrap;gap:8px}
@media (max-width:700px){.desk-main{grid-template-columns:minmax(0,1fr)}.desk-nav{flex-direction:row;overflow-x:auto}.desk-nav .brand{display:none}.frow{grid-template-columns:minmax(0,1fr)}}

/* ---------- misc slide content ---------- */
.lead{font-size:18px;max-width:900px;margin:0 0 14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:900px){.grid3,.grid2{grid-template-columns:minmax(0,1fr)}}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.box h4{margin:0 0 6px}
.case{display:flex;flex-direction:column;gap:6px}
.case .L{font-size:22px;font-weight:900;color:var(--teal)}
.case p{margin:0;font-size:12.5px;color:var(--ink2)}
.case .dbtn{align-self:flex-start;margin-top:auto}
.ribbon{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 16px}
.ribbon span{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12.5px;font-weight:600}
.ribbon em{color:var(--muted);font-style:normal}
.scn{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:8px 0}
.scn button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 4px;font-weight:800;font-size:12.5px}
.scn button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
pre.store{background:#0d1b2e;color:#d6e2f5;border-radius:10px;padding:10px;font-size:11.5px;overflow:auto;max-height:260px;margin:6px 0 0;white-space:pre-wrap;word-break:break-word}
.road .box ul{padding-left:18px;margin:6px 0;font-size:13px}
.road .box li{margin:4px 0}
.sz{display:inline-block;min-width:20px;text-align:center;font-size:10.5px;font-weight:900;border-radius:5px;padding:1px 5px;background:var(--navy);color:#fff;margin-right:4px}
.dep{color:var(--muted);font-size:11.5px}
svg text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.svgwrap{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;overflow-x:auto}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12.5px;margin-top:8px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:22px;height:12px;border-radius:3px}

/* ---------- index + toast ---------- */
.idx{position:fixed;inset:0;background:rgba(10,18,32,.55);z-index:80;display:none;align-items:flex-start;justify-content:center;padding:60px 16px 16px;overflow:auto}
.idx.on{display:flex}
.idx .ib{background:#fff;border-radius:16px;padding:16px;width:min(760px,100%)}
.idx .ib h3{margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.idx ol{margin:0;padding:0;list-style:none;columns:2;column-gap:14px}
@media (max-width:640px){.idx ol{columns:1}}
.idx li button{width:100%;text-align:left;border:0;background:none;padding:6px 8px;border-radius:8px;font-size:13.5px;display:flex;gap:8px}
.idx li button:hover{background:var(--grey-bg)}
.idx li button.cur{background:var(--blue-bg);font-weight:700}
.idx li .n{color:var(--muted);font-variant-numeric:tabular-nums;min-width:22px}
.idx .grp-t{column-span:all;font-size:11px;font-weight:800;color:var(--teal);text-transform:uppercase;letter-spacing:.06em;margin:8px 8px 2px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;border-radius:10px;padding:10px 14px;font-size:13px;max-width:min(560px,calc(100% - 32px));opacity:0;pointer-events:none;transition:all .2s;z-index:90}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="top">
  <div>
    <div class="t">Partner onboarding · Step 3 "Where you work"</div>
    <div class="sub">Updated flow, mock presentation</div>
  </div>
  <span class="mock-badge">MOCK - not connected to real data</span>
  <span class="sp"></span>
  <button data-act="index" aria-label="Open slide index">☰ Index</button>
  <button data-act="prev" id="btn-prev" aria-label="Previous slide">← Prev</button>
  <span class="count" id="count">1 / 1</span>
  <button data-act="next" id="btn-next" aria-label="Next slide">Next →</button>
</div>

<main id="deck"></main>

<div class="idx" id="idx" role="dialog" aria-label="Slide index">
  <div class="ib">
    <h3>Slides <button class="dbtn" data-act="closeIndex">Close ✕</button></h3>
    <ol id="idx-list"></ol>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* =====================================================================
   MOCK DATA ONLY. Nothing here talks to a server.
   ===================================================================== */
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const ZONES = ["Hyderabad West", "Hyderabad Central", "Secunderabad", "Hyderabad South"];
const AREAS = [
  {id:"kukatpally", name:"Kukatpally", zone:"Hyderabad West", pin:"500072", accepting:true},
  {id:"kphb", name:"KPHB Colony", zone:"Hyderabad West", pin:"500085", accepting:true},
  {id:"miyapur", name:"Miyapur", zone:"Hyderabad West", pin:"500049", accepting:true},
  {id:"chandanagar", name:"Chandanagar", zone:"Hyderabad West", pin:"500050", accepting:true},
  {id:"madhapur", name:"Madhapur", zone:"Hyderabad West", pin:"500081", accepting:true},
  {id:"kondapur", name:"Kondapur", zone:"Hyderabad West", pin:"500084", accepting:true},
  {id:"gachibowli", name:"Gachibowli", zone:"Hyderabad West", pin:"500032", accepting:false},
  {id:"moosapet", name:"Moosapet", zone:"Hyderabad West", pin:"500018", accepting:true},
  {id:"manikonda", name:"Manikonda", zone:"Hyderabad West", pin:"500089", accepting:true},
  {id:"abids", name:"Abids", zone:"Hyderabad Central", pin:"500001", accepting:true},
  {id:"koti", name:"Koti", zone:"Hyderabad Central", pin:"500095", accepting:true},
  {id:"himayatnagar", name:"Himayatnagar", zone:"Hyderabad Central", pin:"500029", accepting:true},
  {id:"ameerpet", name:"Ameerpet", zone:"Hyderabad Central", pin:"500016", accepting:true},
  {id:"banjara", name:"Banjara Hills", zone:"Hyderabad Central", pin:"500034", accepting:true},
  {id:"somajiguda", name:"Somajiguda", zone:"Hyderabad Central", pin:"500082", accepting:true},
  {id:"khairatabad", name:"Khairatabad", zone:"Hyderabad Central", pin:"500004", accepting:true},
  {id:"secunderabad", name:"Secunderabad", zone:"Secunderabad", pin:"500003", accepting:true},
  {id:"trimulgherry", name:"Trimulgherry", zone:"Secunderabad", pin:"500015", accepting:true},
  {id:"marredpally", name:"Marredpally", zone:"Secunderabad", pin:"500026", accepting:true},
  {id:"bowenpally", name:"Bowenpally", zone:"Secunderabad", pin:"500011", accepting:true},
  {id:"alwal", name:"Alwal", zone:"Secunderabad", pin:"500010", accepting:true},
  {id:"charminar", name:"Charminar", zone:"Hyderabad South", pin:"500002", accepting:true},
  {id:"malakpet", name:"Malakpet", zone:"Hyderabad South", pin:"500036", accepting:true},
  {id:"dilsukhnagar", name:"Dilsukhnagar", zone:"Hyderabad South", pin:"500060", accepting:true},
  {id:"lbnagar", name:"LB Nagar", zone:"Hyderabad South", pin:"500074", accepting:true}
];
const areaById = id => AREAS.find(a => a.id === id) || {id, name:id, zone:"", pin:"", accepting:true};
const OPEN_IDS = AREAS.filter(a => a.accepting).map(a => a.id);
const NO_AREA = {
  "509216": {city:"Shadnagar", state:"Telangana"},
  "502001": {city:"Sangareddy", state:"Telangana"},
  "560001": {city:"Bengaluru", state:"Karnataka"},
  "500087": {city:"Kukatpally outskirts", state:"Telangana"}
};
const FAKE_PINS = ["599999", "555555", "111111", "599990"];
const PLACES = [
  {label:"Kukatpally, Hyderabad", pin:"500072", country:"IN"},
  {label:"KPHB Colony, Hyderabad", pin:"500085", country:"IN"},
  {label:"Gachibowli, Hyderabad", pin:"500032", country:"IN"},
  {label:"Shadnagar, Telangana", pin:"509216", country:"IN"},
  {label:"Sangareddy, Telangana", pin:"502001", country:"IN"},
  {label:"Dubai Marina, Dubai, UAE", pin:null, country:"AE"},
  {label:"Kathmandu, Nepal", pin:null, country:"NP"}
];
const TRADES = ["Electrician", "AC repair", "Plumber", "Carpenter", "Cleaning"];
const SRC = {GPS:"your location", PIN:"the PIN you typed", SEARCH:"place search"};
const SCN_PIN = {A:"500072", B:"500032", C:"509216", D:null, E:"500072", F:"500072"};

function lookup(pin) {
  pin = String(pin || "").replace(/\s/g, "");
  if (!/^[1-9]\d{5}$/.test(pin)) return {kind:"format", pin};
  if (FAKE_PINS.includes(pin)) return {kind:"unknown", pin};
  const a = AREAS.find(x => x.pin === pin);
  if (a) return {kind: a.accepting ? "open" : "full", pin, area:a, place:{city:a.name, state:"Telangana"}};
  return {kind:"none", pin, place: NO_AREA[pin] || {city:"Near PIN " + pin, state:"India"}};
}

/* =====================================================================
   PHONE MOCK ENGINE
   ===================================================================== */
const PH = {};
const F_PRESET = {
  selected:["kukatpally","kphb","miyapur"],
  waitlisted:[{id:"gachibowli", name:"Gachibowli", pin:"500032", trades:["Electrician","AC repair"]}],
  requested:[
    {pin:"509216", city:"Shadnagar", state:"Telangana", trades:["Electrician","AC repair"], source:"GPS"},
    {pin:"502001", city:"Sangareddy", state:"Telangana", trades:["Electrician"], source:"PIN"}
  ]
};
const E_PRESET = {selected: OPEN_IDS.filter(id => id !== "lbnagar")};

function newState(spec) {
  const st = {scenario:"A", screen:"home", hist:[], selected:[], waitlisted:[], requested:[],
    trades:["Electrician","AC repair"], last:null, reason:"", pinErr:"", pinVal:"", placeQ:"", listQ:"",
    sameHours:true, preset:"weekdays", copied:false, g:null, pay:null};
  Object.assign(st, JSON.parse(JSON.stringify(spec.preset || {})));
  st.scenario = spec.scenario || "A";
  st.screen = spec.screen || "home";
  return st;
}
function regPhone(pid, spec) { PH[pid] = {spec, st:newState(spec), onRender:null}; }

function btn(label, act, arg, cls, disabled) {
  return `<button class="pbtn ${cls || ""}" data-act="${act}"${arg !== undefined && arg !== "" ? ` data-arg="${esc(arg)}"` : ""}${disabled ? " disabled" : ""}>${label}</button>`;
}
function bar(step, title, back) {
  return `<div class="ph-bar">${back === false ? '<span style="width:30px"></span>' : '<button class="ph-back" data-act="back" aria-label="Back">‹</button>'}<div><div class="ph-step">${step ? "Step " + step + " of 6" : "Profile"}</div><div class="ph-title">${esc(title)}</div></div></div>${step ? `<div class="ph-prog"><i style="width:${(step / 6 * 100).toFixed(0)}%"></i></div>` : ""}`;
}
const BAR3 = () => bar(3, "Where you work");
function tradeChips(st) {
  return `<div class="chips">${TRADES.map(t => `<button class="chip ${st.trades.includes(t) ? "on" : ""}" data-act="toggleTrade" data-arg="${esc(t)}">${esc(t)}</button>`).join("")}</div>`;
}
function rowArea(a, st) {
  if (!a.accepting) {
    return `<div class="prow off"><span class="cbx"></span><span class="nm">${esc(a.name)}<small>PIN ${a.pin} · Full right now</small></span><button class="mini" data-act="tryPin" data-arg="${a.pin}">Join waitlist</button></div>`;
  }
  const on = st.selected.includes(a.id);
  return `<button class="prow ${on ? "on" : ""}" data-act="toggleArea" data-arg="${a.id}"><span class="cbx">${on ? "✓" : ""}</span><span class="nm">${esc(a.name)}<small>PIN ${a.pin} · ${esc(a.zone)}</small></span></button>`;
}
function hoursGrid(preset) {
  const D = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  const H = {
    weekdays: D.map((d, i) => i < 6 ? "09:00 – 19:00" : null),
    everyday: D.map(() => "09:00 – 19:00"),
    custom: D.map((d, i) => i < 5 ? "08:00–13:00, 17:00–21:00" : i === 5 ? "10:00 – 16:00" : null)
  }[preset];
  return `<div class="hgrid">${D.map((d, i) => `<div><b>${d}</b>${H[i] ? `<span>${H[i]}</span>` : '<span class="off">Off</span>'}</div>`).join("")}</div>`;
}
const pendingName = st => (st.requested[0] && st.requested[0].city) || (st.waitlisted[0] && st.waitlisted[0].name) || "your area";

const SCREENS = {
  /* ---- today (for slide 2) ---- */
  today(st) {
    const four = ["kukatpally","abids","secunderabad","charminar"].map(areaById);
    return {bar:BAR3(), body:`
      <h3 class="ph-h">Where you work</h3>
      <p class="ph-p">Pick the areas you can travel to. You will only get jobs inside them.</p>
      <div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:13px">Service Locations <span style="color:var(--red)">*</span></b><span class="mini">Select all</span></div>
      ${four.map(a => `<div class="prow"><span class="cbx"></span><span class="nm">${esc(a.name)}</span></div>`).join("")}
      <div class="err">* Please select at least one service location.</div>
      <div class="fine">Can't find your area? We are adding more. Ask us from Help and we will tell you when it opens.</div>
      <div class="banner err" style="margin-top:10px"><b>Problem:</b> this hint saves nothing. The partner just leaves.</div>`,
      footer: btn("Continue", "noop", "", "primary", true)};
  },
  todayEmpty() {
    return {bar:BAR3(), body:`
      <h3 class="ph-h">Where you work</h3>
      <p class="ph-p">Pick the areas you can travel to. You will only get jobs inside them.</p>
      <div class="card" style="color:var(--ink2)">No service areas are currently available for registration.</div>
      <div class="banner err"><b>Dead end:</b> no PIN entry, no request, no way forward. Continue stays disabled.</div>`,
      footer: btn("Continue", "noop", "", "primary", true)};
  },

  /* ---- proposed ---- */
  home(st) {
    const n = st.selected.length + st.waitlisted.length + st.requested.length;
    const chosen = n ? `<div class="card"><div class="lbl">Your areas so far</div><div class="chips">
        ${st.selected.slice(0, 6).map(id => `<span class="chip on">${esc(areaById(id).name)} ✓</span>`).join("")}
        ${st.selected.length > 6 ? `<span class="chip on">+${st.selected.length - 6} more</span>` : ""}
        ${st.waitlisted.map(w => `<span class="chip warn">${esc(w.name)} · waitlist</span>`).join("")}
        ${st.requested.map(r => `<span class="chip info">${esc(r.pin)} · requested</span>`).join("")}</div></div>` : "";
    return {bar:BAR3(), body:`
      <h3 class="ph-h">Where you work</h3>
      <p class="ph-p">Pick every area you travel to. You'll only get jobs inside them. There's no limit.</p>
      <div class="card">
        <div class="lbl">Find areas near you</div>
        ${btn("📍 Use my current location", "useLoc", "", "primary")}
        <div class="row2">${btn("# Enter PIN code", "goManual", "pin", "ghost")}${btn("🔍 Search a place", "goManual", "place", "ghost")}</div>
        <div class="fine">🔒 We keep only your PIN code, never your exact location.</div>
      </div>
      ${chosen}
      ${btn(`Browse all ${AREAS.length} areas ›`, "go", "list", "link")}`,
      footer: btn("Continue", "go", "summary", "primary", !n)};
  },
  consent(st) {
    return Object.assign(SCREENS.home(st), {overlay:`<div class="ovl"><div class="sheet">
      <h4>📍 Use your location?</h4>
      <ul>
        <li>We use it <b>once</b> to find VSolve areas near you.</li>
        <li>We keep only the <b>PIN code</b> (like 500072), not your exact location.</li>
        <li>It only suggests. <b>You choose</b> your areas.</li>
      </ul>
      ${btn("Continue", "consentAllow", "", "primary")}
      ${btn("Not now, I'll type my PIN", "consentNo", "", "ghost")}
      <div class="fine center">You can turn location off anytime in Settings.</div>
    </div></div>`});
  },
  osprompt(st) {
    return Object.assign(SCREENS.home(st), {overlay:`<div class="ovl mid"><div class="sysdlg">
      <div class="q">Allow <b>VSolve Partner</b> to access this device's location?<small>System prompt (iOS / Android / browser)</small></div>
      <button data-act="osAllow">While using the app</button>
      <button data-act="osAllow">Only this time</button>
      <button data-act="osDeny">Don't allow</button>
    </div></div>`});
  },
  locating(st) {
    return Object.assign(SCREENS.home(st), {overlay:`<div class="ovl mid"><div class="loading"><div class="spin"></div>Finding areas near you…<div class="fine" style="color:#cfe0ff">Reading the PIN code only</div></div></div>`});
  },
  manual(st) {
    const msg = {
      denied:["info", "Location is off. No problem: type your PIN code or search a place."],
      nopin:["warn", "We couldn't read a PIN code from your location. Type it or search instead."]
    }[st.reason];
    const q = st.placeQ.trim().toLowerCase();
    const sugg = q.length >= 2 ? PLACES.map((p, i) => [p, i]).filter(([p]) => p.label.toLowerCase().includes(q)) : [];
    return {bar:BAR3(), body:`
      ${msg ? `<div class="banner ${msg[0]}">${msg[1]}</div>` : ""}
      <h3 class="ph-h">Find your area</h3>
      <div class="lbl">PIN code</div>
      <div class="inrow"><input class="in" data-key="pinVal" inputmode="numeric" maxlength="7" placeholder="e.g. 500072" value="${esc(st.pinVal)}" aria-label="PIN code">${btn("Check", "checkPin", "", "primary sm")}</div>
      ${st.pinErr ? `<div class="err">${esc(st.pinErr)}</div>` : ""}
      <div class="try">Mock PINs: ${["500072","500032","509216","599999","12345"].map(p => `<button class="mini" data-act="tryPin" data-arg="${p}">${p}</button>`).join("")}</div>
      <div class="or">or</div>
      <div class="lbl">Search a place</div>
      <input class="in" data-key="placeQ" data-live="1" placeholder="Area, street or landmark" value="${esc(st.placeQ)}" aria-label="Search a place">
      <div class="sugg">${q.length >= 2
        ? (sugg.length ? sugg.map(([p, i]) => `<button class="srow" data-act="placePick" data-arg="${i}">📍 ${esc(p.label)}</button>`).join("")
          : '<div class="fine">No places in the mock list. Try "Kuk", "Shad" or "Dubai".</div>')
        : '<div class="fine">Try "Kuk", "Gachi", "Shad" or "Dubai".</div>'}</div>
      <div class="fine">We read the PIN code of the place you pick. Nothing else is stored.</div>`,
      footer: btn("Back to Where you work", "go", "home", "ghost")};
  },
  resultA(st) {
    const l = st.last, a = l.area;
    const near = AREAS.filter(x => x.zone === a.zone && x.accepting && x.id !== a.id).slice(0, 4);
    return {bar:BAR3(), body:`
      <div class="banner ok">✓ <b>You're in ${esc(a.name)}</b><br><small>PIN ${l.pin} · ${esc(a.zone)} · from ${SRC[l.source]}</small></div>
      <div class="lbl">Selected for you</div>
      ${rowArea(a, st)}
      <div class="fine">Your location only suggested this. You can untick it.</div>
      <div class="lbl">Nearby areas taking partners</div>
      ${near.map(x => rowArea(x, st)).join("")}
      <div class="row2">${btn("+ Another PIN", "goManual", "pin", "ghost")}${btn("Browse all", "go", "list", "ghost")}</div>`,
      footer: btn(`Continue · ${st.selected.length} area${st.selected.length === 1 ? "" : "s"}`, "go", "summary", "primary", st.selected.length === 0)};
  },
  resultB(st) {
    const l = st.last, a = l.area;
    const on = st.waitlisted.some(w => w.id === a.id);
    const near = AREAS.filter(x => x.zone === a.zone && x.accepting).slice(3, 6);
    const n = st.selected.length + st.waitlisted.length + st.requested.length;
    return {bar:BAR3(), body:`
      <div class="banner warn">⏳ <b>${esc(a.name)} is full right now</b><br><small>PIN ${l.pin} · ${esc(a.zone)}</small></div>
      <p class="ph-p">We have enough partners there for now. Join the waitlist and we'll message you when spots open. <b>Your application isn't blocked.</b></p>
      <div class="lbl">What would you do in ${esc(a.name)}?</div>
      ${tradeChips(st)}
      <div style="margin-top:10px">${on ? btn("On the waitlist ✓", "noop", "", "ghost", true) : btn(`Join ${esc(a.name)} waitlist`, "joinWaitlist", "", "primary", st.trades.length === 0)}</div>
      <div class="lbl">Open areas nearby</div>
      ${near.map(x => rowArea(x, st)).join("")}`,
      footer: btn("Continue", "go", "summary", "primary", n === 0)};
  },
  waitlistSaved(st) {
    const w = st.waitlisted[st.waitlisted.length - 1] || {name:"Gachibowli", trades:[]};
    return {bar:BAR3(), body:`
      <div class="done">✓</div>
      <h3 class="ph-h center">You're on the ${esc(w.name)} waitlist</h3>
      <p class="ph-p center">We'll tell you by push and SMS when ${esc(w.name)} takes new partners.</p>
      <div class="card"><div class="lbl">Your trades there</div><div class="chips">${w.trades.map(t => `<span class="chip">${esc(t)}</span>`).join("")}</div></div>
      <div class="banner info">Your application isn't blocked. Add an open area to start sooner, or send it as "area pending".</div>
      ${btn("Add open areas", "go", "list", "ghost")}`,
      footer: btn("Continue", "go", "summary", "primary")};
  },
  resultC(st) {
    const l = st.last, on = st.requested.some(r => r.pin === l.pin);
    return {bar:BAR3(), body:`
      <div class="banner info">📍 <b>We're not in ${l.pin} yet</b><br><small>${esc(l.place.city)}, ${esc(l.place.state)} · ✓ found on map</small></div>
      <p class="ph-p">Tell us what you'd do there. When enough partners and customers ask, we open the area, and you'll hear first.</p>
      <div class="lbl">Your trades in ${esc(l.place.city)}</div>
      ${tradeChips(st)}
      <div style="margin-top:10px">${on ? btn("Requested ✓", "noop", "", "ghost", true) : btn(`Request ${esc(l.place.city)}`, "requestArea", "", "primary", st.trades.length === 0)}</div>
      ${btn("Try another PIN", "goManual", "pin", "link")}
      <div class="fine">We save only PIN ${l.pin}, the town name and your trades.</div>`,
      footer: btn("Continue", "go", "summary", "primary", st.selected.length + st.waitlisted.length + st.requested.length === 0)};
  },
  interestSaved(st) {
    const r = st.requested[st.requested.length - 1] || {city:"your area", pin:""};
    return {bar:BAR3(), body:`
      <div class="done">✓</div>

function phoneFrame(scr) {

    ${scr.overlay || ""}
  </div>`;
}
function renderPhone(pid) {
  const host = document.querySelector(`[data-phone="${pid}"]`);
  if (!host || !PH[pid]) return;
  const st = PH[pid].st;
  const ae = document.activeElement;
  let fkey = null, sel = null;
  if (ae && host.contains(ae) && ae.dataset && ae.dataset.key) { fkey = ae.dataset.key; sel = [ae.selectionStart, ae.selectionEnd]; }
  const scr = (SCREENS[st.screen] || SCREENS.home)(st);
  host.innerHTML = phoneFrame(scr) + `<div class="ph-tools"><button data-act="reset">↺ Reset this phone</button></div>`;
  if (fkey) {
    const el = host.querySelector(`[data-key="${fkey}"]`);
    if (el) { el.focus(); try { el.setSelectionRange(sel[0], sel[1]); } catch (e) { /* ignore */ } }
  }
  if (PH[pid].onRender) PH[pid].onRender(st);
}

function applyLookup(st, pin, source) {
  const r = lookup(pin);
  st.pinErr = "";
  if (r.kind === "format") { st.pinErr = "Enter a 6-digit Indian PIN code, like 500072."; st.screen = "manual"; return; }
  if (r.kind === "unknown") { st.pinErr = `We couldn't find PIN ${r.pin} on the map. Check it, or search a place instead.`; st.screen = "manual"; return; }
  r.source = source;
  st.last = r;
  st.hist.push(st.screen === "locating" ? "home" : st.screen);
  if (r.kind === "open") { if (!st.selected.includes(r.area.id)) st.selected.push(r.area.id); st.screen = "resultA"; }
  else if (r.kind === "full") st.screen = "resultB";
  else st.screen = "resultC";
}
const toggleIn = (arr, v) => { const i = arr.indexOf(v); if (i >= 0) arr.splice(i, 1); else arr.push(v); };

const PA = {
  noop() {},
  go(st, a) { st.hist.push(st.screen); st.screen = a; },
  goManual(st, a) { st.hist.push(st.screen); st.reason = ""; st.pinErr = ""; st.screen = "manual"; },
  back(st) { st.screen = st.hist.pop() || "home"; },
  reset(st, a, pid) { PH[pid].st = newState(PH[pid].spec); },
  useLoc(st) { st.hist.push(st.screen); st.screen = "consent"; },
  consentAllow(st) { st.screen = "osprompt"; },
  consentNo(st) { st.reason = ""; st.screen = "manual"; },
  osDeny(st) { st.reason = "denied"; st.screen = "manual"; },
  osAllow(st, a, pid) {
    st.screen = "locating";
    setTimeout(() => {
      const s = PH[pid].st;
      if (s !== st || s.screen !== "locating") return;
      const pin = SCN_PIN[s.scenario];
      if (!pin) { s.reason = "nopin"; s.screen = "manual"; } else applyLookup(s, pin, "GPS");
      renderPhone(pid);
    }, 900);
  },
  checkPin(st) { applyLookup(st, st.pinVal, "PIN"); },
  tryPin(st, a) { st.pinVal = a; applyLookup(st, a, "PIN"); },
  placePick(st, a) {
    const p = PLACES[+a];
    if (p.country !== "IN") { st.last = {kind:"outside", place:p}; st.hist.push(st.screen); st.screen = "outside"; return; }
    applyLookup(st, p.pin, "SEARCH");
  },
  toggleArea(st, id) { toggleIn(st.selected, id); },
  toggleTrade(st, t) { toggleIn(st.trades, t); },
  joinWaitlist(st) {
    const a = st.last.area;
    if (!st.waitlisted.some(w => w.id === a.id)) st.waitlisted.push({id:a.id, name:a.name, pin:a.pin, trades:st.trades.slice()});
    PA.go(st, "waitlistSaved");
  },
  requestArea(st) {
    const l = st.last;
    if (!st.requested.some(r => r.pin === l.pin)) st.requested.push({pin:l.pin, city:l.place.city, state:l.place.state, trades:st.trades.slice(), source:l.source});
    PA.go(st, "interestSaved");
  },
  removeWait(st, id) { st.waitlisted = st.waitlisted.filter(w => w.id !== id); },
  removeReq(st, pin) { st.requested = st.requested.filter(r => r.pin !== pin); },
  selectAllOpen(st) {
    const allOn = OPEN_IDS.every(id => st.selected.includes(id));
    st.selected = allOn ? [] : OPEN_IDS.slice();
  },
  groupAll(st, z) {
    const ids = AREAS.filter(a => a.zone === z && a.accepting).map(a => a.id);
    const allOn = ids.every(id => st.selected.includes(id));
    if (allOn) st.selected = st.selected.filter(id => !ids.includes(id));
    else ids.forEach(id => { if (!st.selected.includes(id)) st.selected.push(id); });
  },
  toggleSame(st) { st.sameHours = !st.sameHours; },
  setPreset(st, a) { st.preset = a; st.copied = false; },
  copyHours(st) { st.copied = true; },
  setPay(st, a) { st.pay = a; }
};

          <div class="frow"><label>Accepting</label><span><span class="sw on" style="display:inline-block;vertical-align:middle"><i></i></span> partners</span></div>

  dash(s) {
    const D = dashRows(s);
    const flagged = D.filter(r => r.flag === "crit" || r.flag === "low").length;
    const total = D.reduce((x, r) => x + r.partners, 0);
    const FL = {gap:'<span class="pill gap">⚪ gap: no area</span>', crit:'<span class="pill crit">🔴 critical</span>', low:'<span class="pill low">🟠 low</span>', ok:'<span class="pill ok">🟢 healthy</span>', na:'<span class="pill grey">pipeline</span>'};
    const seg = (key, label, opts) => `<div class="fgrp"><b>${label}</b>${opts.map(([v, l]) => `<button class="${s[key] === v ? "on" : ""}" data-act="dSet" data-arg="${key}:${v}">${l}</button>`).join("")}</div>`;
    const rows = D.map(r => {
      const pct = r.target ? Math.min(100, r.partners / r.target * 100) : 0;
      const col = r.flag === "crit" ? "var(--red)" : r.flag === "low" ? "#d97706" : "var(--teal)";
      return `<tr class="click ${s.sel === r.pin ? "sel" : ""}" data-act="dSel" data-arg="${r.pin}">
        <td><b>${r.pin}</b></td><td>${esc(r.area)}<br><small style="color:var(--muted)">${esc(r.zone)}</small></td>
        <td class="num"><b>${r.partners}</b></td>
        <td>${r.target ? `<div class="tbar"><div class="b"><i style="width:${pct}%;background:${col}"></i></div><span>${r.partners}/${r.target}</span></div>` : '<span class="fine">no target</span>'}</td>
        <td class="num">${r.noArea ? `<span style="color:#5b21b6">${r.unserved} turned away</span>` : r.demand}</td>
        <td class="num">${r.noArea ? "–" : r.per100.toFixed(1)}</td>
        <td class="num">${r.noArea ? "–" : r.expiry + "%"}</td>
        <td class="num">${r.requests || "–"}</td>
        <td>${FL[r.flag]}</td></tr>`;
    }).join("");
    const sel = D.find(r => r.pin === s.sel);
    let drill = "";
    if (sel) {
      const shares = TRADE_SHARE[sel.pin] || TRADE_SHARE._;
      const base = DASH.find(r => r.pin === sel.pin);
      const trend = Array.from({length:12}, (_, i) => Math.max(0, Math.round(base.p.APPROVED * (0.62 + 0.38 * i / 11) + ((i * 7) % 5) - 2)));
      const mx = Math.max(...trend, 1);
      const pts = trend.map((v, i) => `${(i * 20 + 4).toFixed(0)},${(54 - v / mx * 46).toFixed(1)}`).join(" ");
      drill = `<div class="panel" style="margin-top:12px"><div class="d-h" style="margin-bottom:6px"><h3 style="font-size:15px">${sel.pin} · ${esc(sel.area)}</h3>
        <button class="dbtn sm" data-act="gotoKey" data-arg="admin-waitlist">Open waitlist</button>
        <button class="dbtn sm" data-act="dPush" data-arg="${sel.pin}">Recruitment push</button>
        <button class="dbtn sm" data-act="dTarget">Edit target</button></div>
        <div class="grid2"><div>${Object.entries(shares).map(([t, sh]) => {
          const p = Math.round(base.p.APPROVED * sh), tg = base.target ? Math.round(base.target * sh) : 0;
          const pc = tg ? Math.min(100, p / tg * 100) : 0, c = !tg ? "#9aa8bb" : p / tg < .3 ? "var(--red)" : p / tg < .7 ? "#d97706" : "var(--teal)";
          return `<div class="tbar" style="margin:5px 0"><span style="width:78px;font-weight:600">${t}</span><div class="b"><i style="width:${pc}%;background:${c}"></i></div><span>${p}/${tg || "–"}</span></div>`;
        }).join("")}<div class="fine">Approved partners covering this PIN vs target, per trade.</div></div>
        <div><svg viewBox="0 0 230 60" width="100%" height="70" role="img" aria-label="12-week trend of approved partners"><polyline fill="none" stroke="var(--navy2)" stroke-width="2" points="${pts}"/></svg>
        <div class="fine">12-week trend (approved partners). Needs nightly snapshots or <code>disabled_at</code>; adds are already dated (<code>enabled_at</code>).</div></div></div></div>`;
    }
    return deskFrame("admin-dash", `
      <div class="d-h"><h3>Partner coverage</h3>
        <button class="dbtn" data-act="gotoKey" data-arg="admin-waitlist">Open waitlist</button>
        <button class="dbtn" data-act="dPush" data-arg="all">Recruitment push</button>
        <button class="dbtn primary" data-act="exportCsv" data-arg="coverage">⬇ Export CSV</button></div>
      <div class="filters">
        ${seg("status", "Status", [["APPROVED","Approved"],["UNDER_REVIEW","Under review"],["APPLIED","Applied"],["SUSPENDED","Suspended"]])}
        ${seg("trade", "Trade", [["All","All"],["Electrician","Electrician"],["Plumber","Plumber"],["AC repair","AC repair"],["Cleaning","Cleaning"]])}
        ${seg("avail", "Hours", [["any","Any"],["evenings","Evenings 6pm+"],["weekends","Weekends"]])}
        ${seg("zone", "Zone", [["All","All"],["Hyderabad West","West"],["Hyderabad Central","Central"],["Hyderabad South","South"]])}
      </div>
      <div class="kpis">
        <div class="kpi"><div class="v">${total}</div><div class="k">${STATUS_LABEL[s.status]} partners (filtered)</div></div>
        <div class="kpi"><div class="v" style="color:var(--red)">${s.status === "APPROVED" ? flagged : "–"}</div><div class="k">Areas below target</div></div>
        <div class="kpi"><div class="v">82</div><div class="k">Open area requests</div></div>
        <div class="kpi"><div class="v">159</div><div class="k">Customers turned away (28d)</div></div>
      </div>
      <div class="panel"><div class="tw"><table class="tbl"><tr><th>PIN</th><th>Area</th><th class="num">Partners*</th><th>vs target</th><th class="num">Demand 28d</th><th class="num">Per 100 jobs</th><th class="num">Offer expiry</th><th class="num">Requests</th><th>Flag</th></tr>${rows}</table></div>
      <div class="fine">*Partners covering the PIN (area → PINs → partners). Sorted most under-supplied first. Flags: 🔴 below 30% of target or expiry above 25% · 🟠 30–70% of target or fewer than 8 per 100 jobs · ⚪ demand or requests with no area. Flags apply to Approved only.</div></div>
      ${drill}`);
  }
};

const TRADE_SHARE = {
  _: {"Electrician":.34, "Plumber":.24, "AC repair":.22, "Cleaning":.20},
  "500050": {"Electrician":.25, "Plumber":.35, "AC repair":.10, "Cleaning":.30},
  "500002": {"Electrician":.40, "Plumber":.20, "AC repair":.15, "Cleaning":.25}
};
const AVAIL = {any:1, evenings:.42, weekends:.63};
function dashRows(s) {
  const order = {gap:0, crit:1, low:2, ok:3, na:4};
  return DASH.filter(r => s.zone === "All" || r.zone === s.zone || r.noArea).map(r => {
    const sh = s.trade === "All" ? 1 : (TRADE_SHARE[r.pin] || TRADE_SHARE._)[s.trade];
    const partners = Math.round(r.p[s.status] * sh * AVAIL[s.avail]);
    const target = Math.round(r.target * sh);
    const demand = Math.round(r.demand * sh);
    const per100 = demand ? partners / demand * 100 : 0;
    let flag;
    if (r.noArea) flag = "gap";
    else if (s.status !== "APPROVED") flag = "na";
    else if ((target && partners / target < .3) || r.expiry > 25) flag = "crit";
    else if ((target && partners / target < .7) || per100 < 8) flag = "low";
    else flag = "ok";
    return Object.assign({}, r, {partners, target, demand, per100, flag});
  }).sort((a, b) => order[a.flag] - order[b.flag] || a.partners - b.partners);
}

const AA = {
  aSel(s, id) { s.sel = id; s.pinMsg = null; s.addPin = ""; },
  aAccept(s, id) { s.accept[id] = !s.accept[id]; toast(`Mock: ${adminAreaName(s, id)} ${s.accept[id] ? "now accepts new partners (shows in Step 3)" : "is full: Step 3 shows \"Join waitlist\""}`); },
  aSvc(s, svc) { s.svc[s.sel][svc] = !s.svc[s.sel][svc]; },
  aRmPin(s, pin) { s.pins[s.sel] = s.pins[s.sel].filter(p => p !== pin); s.pinMsg = {type:"info", text:`Removed ${pin}. Customers there will see "outside service area".`}; },
  aAddPin(s) {
    const pin = s.addPin.trim();
    if (!/^[1-9]\d{5}$/.test(pin)) { s.pinMsg = {type:"bad", text:`"${esc(pin)}" is not a 6-digit Indian PIN.`}; return; }
    const owner = ownerOf(s, pin);
    if (owner === s.sel) { s.pinMsg = {type:"info", text:`${pin} is already in this area.`}; return; }
    if (owner) { s.pinMsg = {type:"warn", text:`<b>${pin}</b> is already in <b>${esc(adminAreaName(s, owner))}</b>. A PIN can belong to one area only.`, pin, from:owner}; return; }
    s.pins[s.sel].push(pin); s.addPin = ""; s.pinMsg = {type:"ok", text:`Added ${pin}.`};
  },
  aMovePin(s) {
    const m = s.pinMsg; if (!m || !m.pin) return;
    s.pins[m.from] = s.pins[m.from].filter(p => p !== m.pin); s.pins[s.sel].push(m.pin);
    s.pinMsg = {type:"ok", text:`Moved ${m.pin} from ${esc(adminAreaName(s, m.from))}. Partners and open bookings there are listed for review (mock).`}; s.addPin = "";
  },
  aCancelPin(s) { s.pinMsg = null; },
  aCreate(s) {
    const id = s.newName.toLowerCase().replace(/[^a-z0-9]+/g, "-") || "new-area";
    if (!allAdminAreas(s).some(a => a.id === id)) {
      s.extra.push({id, name:s.newName || "New area", zone:"Rangareddy", pin:"", accepting:true});
      s.pins[id] = s.newPins.split(/[,\s]+/).filter(p => /^[1-9]\d{5}$/.test(p) && !ownerOf(s, p));
      s.accept[id] = true; s.svc[id] = {}; ALL_SVC.forEach(x => { s.svc[id][x] = false; });
    }
    s.sel = id; toast(`Mock: created ${s.newName}. Next: enable services and set targets.`);
  },
  aPreview(s) {
    s.decisions = {};
    s.preview = s.bulk.split(/\n/).map(l => l.trim()).filter(l => l && !/^pin\b/i.test(l)).map(l => {
      const [pin = "", slug = ""] = l.split(",").map(x => x.trim());
      if (!/^[1-9]\d{5}$/.test(pin)) return {pin, slug, st:"invalid"};
      if (!allAdminAreas(s).some(a => a.id === slug)) return {pin, slug, st:"unknown"};
      const owner = ownerOf(s, pin);
      if (owner === slug) return {pin, slug, st:"same"};
      if (owner) return {pin, slug, st:"conflict", owner, ownerName:adminAreaName(s, owner)};
      return {pin, slug, st:"add"};
    });
  },
  aDecide(s, a) { const [pin, d] = a.split(":"); s.decisions[pin] = d; },
  aApply(s) {
    let add = 0, mv = 0, sk = 0, rej = 0;
    s.preview.forEach(r => {
      if (r.st === "add") { s.pins[r.slug].push(r.pin); add++; }
      else if (r.st === "conflict") {
        if (s.decisions[r.pin] === "move") { s.pins[r.owner] = s.pins[r.owner].filter(p => p !== r.pin); s.pins[r.slug].push(r.pin); mv++; } else sk++;
      } else if (r.st === "invalid" || r.st === "unknown") rej++;
    });
    s.preview = null; toast(`Mock: applied · ${add} added · ${mv} moved · ${sk} skipped · ${rej} rejected`);
  },
  rRemove(s) { s.removed = true; s.decision = null; },
  rLink(s) { s.linkOpen = !s.linkOpen; },
  rSpam(s, pin) { s.spam[pin] = !s.spam[pin]; },
  rDecide(s, a) {
    s.decision = {
      approve:"Mock: approved. Kukatpally + KPHB Colony are ACTIVE (dispatch can offer jobs). Gachibowli and Shadnagar stay pending; the partner is told they'll hear when those open.",
      changes:"Mock: sent back as CHANGES_REQUIRED with note \"Miyapur doesn't offer your trades. Remove it or add matching services.\"",
      decline:"Mock: declined. Pending area requests are withdrawn."
    }[a];
  },
  rUndo(s) { s.decision = null; },
  wTrade(s, t) { s.trade = t; },
  wExp(s, pin) { s.exp = s.exp === pin ? null : pin; },
  wOpen(s, pin) { const r = AD._wl.find(x => x.pin === pin); s.modal = {pin, step: r.kind === "none" ? "form" : "notify"}; },
  wStep(s, st) { s.modal.step = st; },
  wClose(s) { s.modal = null; },
  wConfirm(s) {
    const r = AD._wl.find(x => x.pin === s.modal.pin);
    const n = s.trade === "All" ? Object.values(r.trades).reduce((x, y) => x + y, 0) : (r.trades[s.trade] || 0);
    s.opened[r.pin] = n; s.modal = null;
    toast(`Mock: ${n} partner${n === 1 ? "" : "s"} notified. They are PENDING_ACTIVATION until they tap Activate.`);
  },
  wSpam(s, pin) { s.opened[pin] = 1; toast(`Mock: ${pin} marked spam. Hidden from demand counts.`); },
  dSet(s, a) { const i = a.indexOf(":"); s[a.slice(0, i)] = a.slice(i + 1); },
  dSel(s, pin) { s.sel = s.sel === pin ? null : pin; },
  dPush(s, pin) {
    toast(pin === "all" ? "Mock: recruitment campaign drafted for all 🔴/🟠 areas, with contact export and a tagged apply link." :
      `Mock: recruitment push for ${pin}: tagged apply link + SMS to nearby waitlisted partners + referral bonus banner.`);
  },
  dTarget() { toast("Mock: opens target editor (per area × trade): AreaSupplyTarget."); }
};

function renderAdmin(aid) {

/* =====================================================================
   CSV export (local file, no network)
   ===================================================================== */
function exportCsv(kind) {
  let csv;
  if (kind === "coverage") {
    const s = AD.dash;
    csv = "pin,area,zone,status_filter,trade_filter,hours_filter,partners,target,demand_28d,partners_per_100_jobs,offer_expiry_pct,requests,flag\n" +
      dashRows(s).map(r => [r.pin, r.area, r.zone, s.status, s.trade, s.avail, r.partners, r.target, r.demand, r.per100.toFixed(1), r.expiry, r.requests, r.flag].map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\n");
  } else {
    csv = "pin,place,kind,electrician,ac_repair,plumber,cleaning,customer_lookups_28d,first_request\n" +
      (AD._wl || []).map(r => [r.pin, r.place, r.kind, r.trades["Electrician"], r.trades["AC repair"], r.trades["Plumber"], r.trades["Cleaning"], r.lookups, r.first].map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\n");
  }
  const blob = new Blob(["MOCK DATA - not real\n" + csv], {type:"text/csv"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `mock-${kind}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast(`Mock: downloaded mock-${kind}.csv (generated in the browser).`);
}

    return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" style="${st};stroke-width:2"/><text x="${x + w / 2}" y="${y + (sub ? 22 : h / 2 + 5)}" text-anchor="middle" font-size="13" font-weight="800" fill="var(--ink)">${label}</text>${sub ? `<text x="${x + w / 2}" y="${y + 40}" text-anchor="middle" font-size="11" fill="var(--ink2)">${sub}</text>` : ""}`;

    ${arr("M270,53 L388,53", "unticked", 330, 45)}

    ${arr("M270,375 C330,370 350,320 388,305", "re-opened to partners", 320, 360)}
    ${arr("M600,280 C640,250 660,170 698,145", "partner taps Activate", 655, 225)}

    ${arr("M890,120 L948,120", "", 0, 0)}<text x="919" y="112" font-size="11" fill="var(--ink2)" text-anchor="middle">remove</text>

/* =====================================================================
   DECK
   ===================================================================== */
let cur = 0;
function build() {
  initAdmin();
  const deck = document.getElementById("deck");
  deck.innerHTML = SLIDES.map((s, i) => `<section class="slide" id="s-${s.key}" aria-label="Slide ${i + 1}: ${esc(s.title)}">
    <div class="s-head"><div><div class="kicker">${i + 1} · ${esc(s.kicker || s.group)}</div><h2>${esc(s.title)}</h2></div><span class="mock-badge">MOCK - not connected to real data</span></div>
    ${s.full ? `<div class="s-body full">${s.html()}</div>` : `<div class="s-body"><aside class="notes">${s.notes()}</aside><div class="frames">${s.frames()}</div></div>`}
  </section>`).join("");
  Object.keys(PH).forEach(renderPhone);
  Object.keys(ADMIN).forEach(renderAdmin);
  PH.proto.onRender = st => {
    const el = document.getElementById("proto-store");
    if (!el) return;
    el.textContent = JSON.stringify({
      service_area_ids: st.selected.slice(0, 8).concat(st.selected.length > 8 ? ["…+" + (st.selected.length - 8)] : []),
      area_requests: st.requested.map(r => ({postal_code:r.pin, city:r.city, state:r.state, source:r.source, skills:r.trades, status:"REQUESTED"}))
        .concat(st.waitlisted.map(w => ({postal_code:w.pin, matched_area:w.id, skills:w.trades, status:"WAITLISTED"}))),
      exact_coordinates_stored: false
    }, null, 2);
  };
  renderPhone("proto");
  let groups = "", last = "";
  document.getElementById("idx-list").innerHTML = SLIDES.map((s, i) => {
    groups = s.group !== last ? `<li class="grp-t">${s.group}</li>` : "";
    last = s.group;
    return `${groups}<li><button data-act="goto" data-arg="${i}"><span class="n">${i + 1}</span>${esc(s.title)}</button></li>`;
  }).join("");
  const h = parseInt((location.hash || "").replace("#", ""), 10);
  show(isNaN(h) ? 0 : h - 1);
}
function show(i) {
  cur = Math.max(0, Math.min(SLIDES.length - 1, i));
  document.querySelectorAll(".slide").forEach((el, j) => el.classList.toggle("on", j === cur));
  document.getElementById("count").textContent = `${cur + 1} / ${SLIDES.length}`;
  document.getElementById("btn-prev").disabled = cur === 0;
  document.getElementById("btn-next").disabled = cur === SLIDES.length - 1;
  document.querySelectorAll("#idx-list button").forEach(b => b.classList.toggle("cur", +b.dataset.arg === cur));
  try { history.replaceState(null, "", "#" + (cur + 1)); } catch (e) { /* file:// may refuse; ignore */ }
  window.scrollTo(0, 0);
}
let toastT = null;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 3600);
}

const GA = {
  next() { show(cur + 1); },
  prev() { show(cur - 1); },
  goto(a) { document.getElementById("idx").classList.remove("on"); show(+a); },
  gotoKey(a) { show(SLIDES.findIndex(s => s.key === a)); },
  index() { document.getElementById("idx").classList.add("on"); },
  closeIndex() { document.getElementById("idx").classList.remove("on"); },
  exportCsv(a) { exportCsv(a); },
  scn(a) {
    PH.proto.spec = PROTO_SPECS[a];
    PH.proto.st = newState(PROTO_SPECS[a]);
    renderPhone("proto");
    document.getElementById("scn-info").innerHTML = SCN_INFO[a];
    document.querySelectorAll("#scn button").forEach(b => b.classList.toggle("on", b.dataset.arg === a));
  }
};

document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]");
  if (!t || t.disabled) return;
  const act = t.dataset.act, arg = t.dataset.arg;
  const ph = t.closest("[data-phone]");
  if (ph && PA[act]) { const pid = ph.dataset.phone; PA[act](PH[pid].st, arg, pid, t); renderPhone(pid); return; }
  const ad = t.closest("[data-admin]");
  if (ad && AA[act]) { const aid = ad.dataset.admin; AA[act](AD[aid], arg, aid, t); renderAdmin(aid); return; }
  if (GA[act]) GA[act](arg, t);
});
document.addEventListener("input", e => {
  const t = e.target, k = t.dataset && t.dataset.key;
  if (!k) return;
  const ph = t.closest("[data-phone]");
  if (ph) { PH[ph.dataset.phone].st[k] = t.value; if (t.dataset.live) renderPhone(ph.dataset.phone); return; }
  const ad = t.closest("[data-admin]");
  if (ad) AD[ad.dataset.admin][k] = t.value;
});
document.addEventListener("keydown", e => {
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea" || tag === "select") {
    if (e.key === "Enter" && e.target.dataset.key === "pinVal") {
      const ph = e.target.closest("[data-phone]");
      if (ph) { PA.checkPin(PH[ph.dataset.phone].st); renderPhone(ph.dataset.phone); }
    }
    return;
  }
  if (e.key === "Escape") GA.closeIndex();
  else if (e.key === "ArrowRight" || e.key === "PageDown") show(cur + 1);
  else if (e.key === "ArrowLeft" || e.key === "PageUp") show(cur - 1);
  else if (e.key === "Home") show(0);
  else if (e.key === "End") show(SLIDES.length - 1);
});
document.getElementById("idx").addEventListener("click", e => { if (e.target.id === "idx") GA.closeIndex(); });
build();
</script>
