<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: "Plus Jakarta Sans", system-ui, sans-serif; }
    a { color: #a94900; } a:hover { color: #8a3a00; }
    * { box-sizing: border-box; }

    /* A wave travelling left to right — the same instinct as the scanner, in a
       different idiom. Each bar runs the identical animation, offset by its
       position, so the crest moves across the row rather than every bar
       pumping together. */
    @keyframes wave { 0%, 100% { transform: scaleY(0.28); } 50% { transform: scaleY(1); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes glow { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
    @keyframes drift {
      0%, 100% { background-position: 0% 40%; }
      50%      { background-position: 100% 60%; }
    }

    .bar  { animation: wave 1.6s ease-in-out infinite; transform-origin: center; }
    .ring { animation: spin 7s linear infinite; }
    .halo { animation: glow 2.6s ease-in-out infinite; }
    .sky  { background-size: 200% 200%; animation: drift 14s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .bar, .ring, .halo, .sky { animation: none; }
      .bar { transform: scaleY(0.6); }
    }
  </style>
</helmet>

<div style="width: 360px; height: 800px; background: #faf8f5; display: flex; flex-direction: column; overflow: hidden; color: #00112e;">

  <!-- ══ THE SWITCH · the screen IS the control ══ -->
  <div class="sky" style="position: relative; flex-shrink: 0; height: 430px; background: linear-gradient(150deg, #00246b 0%, #001a4e 45%, #00112e 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; overflow: hidden;">

    <!-- top chrome, floated over the gradient -->
    <div style="position: absolute; top: 0; left: 0; right: 0; height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <div style="width: 26px; height: 26px; border-radius: 7px; background: #f87000; display: grid; place-items: center;">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#00112e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 2.5 5 13.5h6l-1.5 8 9.5-11.5h-6z"></path></svg>
        </div>
        <span style="font-size: 14px; font-weight: 600; color: #b0c2e8;">Partner</span>
      </div>
      <div style="width: 44px; height: 44px; display: grid; place-items: center; position: relative;">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#b0c2e8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8.5a6 6 0 0 0-12 0c0 6-2.5 7.5-2.5 7.5h17S18 14.5 18 8.5z"></path><path d="M13.7 20a2 2 0 0 1-3.4 0"></path></svg>
      </div>
    </div>

    <!-- the button -->
    <div style="position: relative; width: 190px; height: 190px; display: grid; place-items: center;">
      <span class="halo" style="position: absolute; inset: -14px; border-radius: 50%; background: radial-gradient(circle, rgb(14 124 58 / 0.34) 0%, transparent 68%);"></span>
      <span class="ring" style="position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 0deg, transparent 0deg, rgb(14 124 58 / 0.05) 200deg, #12a04c 330deg, #6fe0a0 358deg, transparent 360deg); mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 5px)); -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 5px));"></span>
      <span style="position: absolute; inset: 5px; border-radius: 50%; border: 1px solid rgb(176 194 232 / 0.16);"></span>
      <span style="position: relative; width: 138px; height: 138px; border-radius: 50%; background: linear-gradient(160deg, #0e7c3a 0%, #0a5c2b 100%); display: grid; place-items: center; box-shadow: 0 12px 30px rgb(10 92 43 / 0.42), inset 0 2px 0 rgb(255 255 255 / 0.18);">
        <svg viewBox="0 0 24 24" width="58" height="58" fill="none" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v9"></path><path d="M18.4 6.6a9 9 0 1 1-12.8 0"></path></svg>
      </span>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <span style="font-size: 24px; font-weight: 800; letter-spacing: -0.01em; color: #ffffff;">You are on</span>
      <span style="font-size: 13.5px; font-weight: 600; color: #b0c2e8;">Kondapur · 4h 12m · tap to stop</span>
    </div>

    <!-- the wave: "we are listening", travelling left to right -->
    <div style="display: flex; align-items: center; gap: 4px; height: 34px;">
      <span class="bar" style="animation-delay: 0ms;    width: 4px; height: 34px; border-radius: 2px; background: #2551a3;"></span>
      <span class="bar" style="animation-delay: 70ms;   width: 4px; height: 34px; border-radius: 2px; background: #2551a3;"></span>
      <span class="bar" style="animation-delay: 140ms;  width: 4px; height: 34px; border-radius: 2px; background: #35619f;"></span>
      <span class="bar" style="animation-delay: 210ms;  width: 4px; height: 34px; border-radius: 2px; background: #4a70bf;"></span>
      <span class="bar" style="animation-delay: 280ms;  width: 4px; height: 34px; border-radius: 2px; background: #5b7fc4;"></span>
      <span class="bar" style="animation-delay: 350ms;  width: 4px; height: 34px; border-radius: 2px; background: #7d9ad6;"></span>
      <span class="bar" style="animation-delay: 420ms;  width: 4px; height: 34px; border-radius: 2px; background: #fb8130;"></span>
      <span class="bar" style="animation-delay: 490ms;  width: 4px; height: 34px; border-radius: 2px; background: #f87000;"></span>
      <span class="bar" style="animation-delay: 560ms;  width: 4px; height: 34px; border-radius: 2px; background: #fb8130;"></span>
      <span class="bar" style="animation-delay: 630ms;  width: 4px; height: 34px; border-radius: 2px; background: #7d9ad6;"></span>
      <span class="bar" style="animation-delay: 700ms;  width: 4px; height: 34px; border-radius: 2px; background: #5b7fc4;"></span>
      <span class="bar" style="animation-delay: 770ms;  width: 4px; height: 34px; border-radius: 2px; background: #4a70bf;"></span>
      <span class="bar" style="animation-delay: 840ms;  width: 4px; height: 34px; border-radius: 2px; background: #35619f;"></span>
      <span class="bar" style="animation-delay: 910ms;  width: 4px; height: 34px; border-radius: 2px; background: #2551a3;"></span>
      <span class="bar" style="animation-delay: 980ms;  width: 4px; height: 34px; border-radius: 2px; background: #2551a3;"></span>
      <span class="bar" style="animation-delay: 1050ms; width: 4px; height: 34px; border-radius: 2px; background: #2551a3;"></span>
    </div>

    <span style="font-size: 12.5px; font-weight: 600; letter-spacing: 0.04em; color: #7d9ad6;">Listening for work near you</span>
  </div>

  <!-- ══ MONEY, below the fold of the switch ══ -->
  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 10px; padding: 16px 16px 0 16px; overflow: hidden;">

    <div style="flex-shrink: 0; display: flex; align-items: center; gap: 14px; border-radius: 16px; background: #ffffff; border: 1px solid #e7e2da; padding: 14px; box-shadow: 0 1px 3px rgb(69 63 55 / 0.08);">
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #756c5e;">Earned today</span>
        <span style="font-size: 32px; font-weight: 800; line-height: 1; letter-spacing: -0.02em;">₹2,450</span>
      </div>
      <div style="margin-left: auto; text-align: right; display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 18px; font-weight: 800; line-height: 1; letter-spacing: -0.02em; color: #0e7c3a;">3</span>
        <span style="font-size: 10.5px; font-weight: 600; color: #756c5e;">jobs done</span>
      </div>
    </div>

    <div style="flex-shrink: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
      <div style="border-radius: 12px; background: #ffffff; border: 1px solid #e7e2da; padding: 9px 11px; display: flex; flex-direction: column; gap: 1px;">
        <span style="font-size: 15.5px; font-weight: 800; line-height: 1; letter-spacing: -0.02em;">₹48,200</span>
        <span style="font-size: 10px; font-weight: 600; color: #756c5e;">This month</span>
      </div>
      <div style="border-radius: 12px; background: #ffffff; border: 1px solid #e7e2da; padding: 9px 11px; display: flex; flex-direction: column; gap: 1px;">
        <span style="font-size: 15.5px; font-weight: 800; line-height: 1; letter-spacing: -0.02em;">18</span>
        <span style="font-size: 10px; font-weight: 600; color: #756c5e;">Jobs done</span>
      </div>
      <div style="border-radius: 12px; background: #ffffff; border: 1px solid #e7e2da; padding: 9px 11px; display: flex; flex-direction: column; gap: 1px;">
        <span style="font-size: 15.5px; font-weight: 800; line-height: 1; letter-spacing: -0.02em;">₹41,300</span>
        <span style="font-size: 10px; font-weight: 600; color: #756c5e;">Usual month</span>
      </div>
    </div>
  </div>

  <div style="height: 56px; flex-shrink: 0; background: #ffffff; border-top: 1px solid #e7e2da; display: flex;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;">
      <div style="width: 48px; height: 28px; border-radius: 14px; background: #eef2fb; display: grid; place-items: center;">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#00246b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 20.5h17"></path><path d="M5.5 20.5V9.2h13v11.3"></path><path d="M4 9.2 12 3.4l8 5.8"></path><path d="M9.6 20.5v-5.2h4.8v5.2"></path></svg>
      </div>
      <span style="font-size: 10px; font-weight: 700; color: #00246b;">Home</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;">
      <div style="width: 48px; height: 28px; display: grid; place-items: center;">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#756c5e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="8.5" width="19" height="11.5" rx="2"></rect><path d="M8 8.5V6.8A2.3 2.3 0 0 1 10.3 4.5h3.4A2.3 2.3 0 0 1 16 6.8v1.7"></path><path d="M2.5 13.5h19"></path></svg>
      </div>
      <span style="font-size: 10px; font-weight: 600; color: #756c5e;">Work</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;">
      <div style="width: 48px; height: 28px; display: grid; place-items: center;">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#756c5e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2.2"></rect><circle cx="12" cy="12" r="3"></circle></svg>
      </div>
      <span style="font-size: 10px; font-weight: 600; color: #756c5e;">Money</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;">
      <div style="width: 48px; height: 28px; display: grid; place-items: center;">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#756c5e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.8"></circle><path d="M4.5 21c0-4 3.4-7 7.5-7s7.5 3 7.5 7"></path></svg>
      </div>
      <span style="font-size: 10px; font-weight: 600; color: #756c5e;">Me</span>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
