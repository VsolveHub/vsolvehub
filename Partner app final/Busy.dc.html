<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: "Plus Jakarta Sans", system-ui, sans-serif; }
    a { color: #a94900; } a:hover { color: #8a3a00; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 360px; height: 800px; background: linear-gradient(180deg, #fdfcfa 0%, #faf8f5 100%); display: flex; flex-direction: column; overflow: hidden; color: #00112e;">

  <div style="height: 56px; flex-shrink: 0; background: #ffffff; border-bottom: 1px solid #e7e2da; display: flex; align-items: center; justify-content: space-between; padding: 0 16px;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <div style="width: 26px; height: 26px; border-radius: 7px; background: #f87000; display: grid; place-items: center;">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#00112e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 2.5 5 13.5h6l-1.5 8 9.5-11.5h-6z"></path></svg>
      </div>
      <span style="font-size: 14px; font-weight: 600; color: #453f37;">Partner</span>
    </div>
    <div style="width: 44px; height: 44px; display: grid; place-items: center; position: relative;">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#453f37" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8.5a6 6 0 0 0-12 0c0 6-2.5 7.5-2.5 7.5h17S18 14.5 18 8.5z"></path><path d="M13.7 20a2 2 0 0 1-3.4 0"></path></svg>
      <span style="position: absolute; top: 8px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: #f87000; border: 1.5px solid #ffffff;"></span>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 12px; padding: 14px 16px 0 16px; overflow: hidden;">

    <!-- Availability + money stay put. They do not move when work arrives. -->
    <div style="flex-shrink: 0; border-radius: 14px; background: #ffffff; border: 1px solid #e7e2da; padding: 10px 14px; display: flex; align-items: center; gap: 12px;">
      <span style="width: 10px; height: 10px; border-radius: 50%; background: #0e7c3a; flex-shrink: 0; box-shadow: 0 0 0 4px rgb(14 124 58 / 0.14);"></span>
      <span style="flex-grow: 1; font-size: 15px; font-weight: 700;">Taking work</span>
      <div style="height: 34px; border-radius: 10px; border: 1px solid #d3ccc0; display: grid; place-items: center; padding: 0 12px; font-size: 13px; font-weight: 700; color: #453f37;">Go offline</div>
    </div>

    <div style="flex-shrink: 0; border-radius: 14px; background: linear-gradient(160deg, #00246b 0%, #00112e 100%); padding: 12px 14px; display: flex; align-items: center; gap: 12px;">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#fb8130" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><circle cx="12" cy="12" r="4.2"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="M4.9 4.9l1.4 1.4"></path><path d="M17.7 17.7l1.4 1.4"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="M4.9 19.1l1.4-1.4"></path><path d="M17.7 6.3l1.4-1.4"></path></svg>
      <div style="display: flex; flex-direction: column; gap: 1px;">
        <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #b0c2e8;">Earned today</span>
        <span style="font-size: 28px; font-weight: 800; line-height: 1; letter-spacing: -0.02em; color: #ffffff;">₹2,450</span>
      </div>
      <div style="margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; font-size: 13px; font-weight: 600; line-height: 1.3; color: #b0c2e8;">
        <span>3 jobs</span><span>finished</span>
      </div>
    </div>

    <div style="flex-shrink: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
      <div style="border-radius: 14px; background: #ffffff; border: 1px solid #e7e2da; padding: 9px 12px; display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 17px; font-weight: 800; line-height: 1; letter-spacing: -0.02em;">₹48,200</span>
        <span style="font-size: 11px; font-weight: 600; color: #756c5e;">This month</span>
      </div>
      <div style="border-radius: 14px; background: #ffffff; border: 1px solid #e7e2da; padding: 9px 12px; display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 17px; font-weight: 800; line-height: 1; letter-spacing: -0.02em;">18</span>
        <span style="font-size: 11px; font-weight: 600; color: #756c5e;">Jobs done</span>
      </div>
      <div style="border-radius: 14px; background: #ffffff; border: 1px solid #e7e2da; padding: 9px 12px; display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 17px; font-weight: 800; line-height: 1; letter-spacing: -0.02em;">₹41,300</span>
        <span style="font-size: 11px; font-weight: 600; color: #756c5e;">Usual month</span>
      </div>
    </div>

    <!-- Only what is the vendor's move. Quotes sent and settled jobs are not here. -->
    <div style="flex-shrink: 0; display: flex; align-items: baseline; justify-content: space-between; margin-top: 4px;">
      <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #756c5e;">Needs you</span>
      <span style="font-size: 11px; font-weight: 700; color: #756c5e;">2</span>
    </div>

    <!-- Live offer -->
    <div style="flex-shrink: 0; border-radius: 14px; padding: 12px; background: linear-gradient(135deg, #fb8130 0%, #f87000 55%, #d65e00 100%); box-shadow: 0 4px 12px rgb(214 94 0 / 0.32); display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; align-items: center; gap: 11px;">
        <div style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 15px; background: #ffffff; display: grid; place-items: center;">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#00112e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5.2l3.4 2"></path></svg>
        </div>
        <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 16px; font-weight: 600; color: #00112e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Crew offer · 4 helpers</span>
          <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: #00112e; opacity: 0.7;">Kondapur</span>
        </div>
        <div style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 50%; background: rgb(0 17 46 / 0.13); display: grid; place-items: center;">
          <span style="font-size: 14px; font-weight: 800; letter-spacing: -0.02em; color: #00112e;">1:47</span>
        </div>
      </div>
      <div style="font-size: 30px; font-weight: 800; line-height: 1; letter-spacing: -0.02em; color: #00112e; padding-left: 2px;">₹18,000</div>
      <div style="height: 56px; border-radius: 13px; background: #ffffff; display: flex; align-items: center; justify-content: center; gap: 10px;">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#0e7c3a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5 9.5 17.5 19.5 6.5"></path></svg>
        <span style="font-size: 16px; font-weight: 700; color: #00112e;">Take this job</span>
      </div>
    </div>

    <!-- Needs a price · note the DATE, not "12:00 am" -->
    <div style="flex-shrink: 0; border-radius: 14px; padding: 12px; background: #ffffff; border: 1px solid #e7e2da; display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; align-items: center; gap: 11px;">
        <div style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 15px; background: #f4f1ec; display: grid; place-items: center;">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#a94900" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8.5a6 6 0 0 0-12 0c0 6-2.5 7.5-2.5 7.5h17S18 14.5 18 8.5z"></path><path d="M13.7 20a2 2 0 0 1-3.4 0"></path></svg>
        </div>
        <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Interior fit-out project</span>
          <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: #756c5e;">Needs a price</span>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; padding-left: 2px;">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#756c5e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2.4"></rect><path d="M8 2.8v4"></path><path d="M16 2.8v4"></path><path d="M3 10h18"></path></svg>
        <span style="display: flex; flex-direction: column; line-height: 1.15;">
          <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #a89f90;">Starts</span>
          <span style="font-size: 15px; font-weight: 700; color: #453f37;">12 Sep</span>
        </span>
      </div>
      <div style="height: 56px; border-radius: 13px; background: #f87000; box-shadow: 0 2px 0 #d65e00; display: flex; align-items: center; justify-content: center; gap: 10px;">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#00112e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3.5h11"></path><path d="M6.5 8.4h11"></path><path d="M14.6 3.5c0 3.3-2.4 4.9-5.3 4.9H6.5l8.6 12.1"></path></svg>
        <span style="font-size: 16px; font-weight: 700; color: #00112e;">Send a price</span>
      </div>
    </div>

  </div>

  <div style="height: 56px; flex-shrink: 0; background: #ffffff; border-top: 1px solid #e7e2da; display: flex;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;">
      <div style="width: 48px; height: 28px; border-radius: 14px; background: #eef2fb; display: grid; place-items: center;">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#00246b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 20.5h17"></path><path d="M5.5 20.5V9.2h13v11.3"></path><path d="M4 9.2 12 3.4l8 5.8"></path><path d="M9.6 20.5v-5.2h4.8v5.2"></path></svg>
      </div>
      <span style="font-size: 10px; font-weight: 700; color: #00246b;">Home</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;">
      <div style="width: 48px; height: 28px; display: grid; place-items: center;">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#756c5e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="8.5" width="19" height="11.5" rx="2"></rect><path d="M8 8.5V6.8A2.3 2.3 0 0 1 10.3 4.5h3.4A2.3 2.3 0 0 1 16 6.8v1.7"></path><path d="M2.5 13.5h19"></path></svg>
      </div>
      <span style="font-size: 10px; font-weight: 600; color: #756c5e;">Work</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;">
      <div style="width: 48px; height: 28px; display: grid; place-items: center;">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#756c5e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2.2"></rect><circle cx="12" cy="12" r="3"></circle></svg>
      </div>
      <span style="font-size: 10px; font-weight: 600; color: #756c5e;">Money</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;">
      <div style="width: 48px; height: 28px; display: grid; place-items: center;">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#756c5e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.8"></circle><path d="M4.5 21c0-4 3.4-7 7.5-7s7.5 3 7.5 7"></path></svg>
      </div>
      <span style="font-size: 10px; font-weight: 600; color: #756c5e;">Me</span>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
