<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: "Plus Jakarta Sans", system-ui, sans-serif; }
    a { color: #a94900; } a:hover { color: #8a3a00; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 360px; height: 800px; background: #faf8f5; display: flex; flex-direction: column; overflow: hidden; color: #00112e;">

  <!-- HEADER · navy depth gradient, 104px -->
  <div style="flex-shrink: 0; background: linear-gradient(160deg, #00246b 0%, #00112e 100%); padding: 12px 16px 16px 16px; display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <div style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 14px; background: rgb(255 255 255 / 0.13); display: grid; place-items: center;">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5.5 8.5 12 15 18.5"></path></svg>
      </div>
      <span style="flex-grow: 1; min-width: 0; font-size: 19px; font-weight: 700; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Bathroom tiling</span>
    </div>
    <!-- Time only. PartnerBooking publishes no locality and no customer contact
         (schema.d.ts:7926-7949) — the title is the first work task's own label,
         which is the only field on the record that names the work. -->
    <div style="display: flex; align-items: center; gap: 8px; padding-left: 4px;">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#fb8130" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5.2l3.4 2"></path></svg>
      <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #fb8130;">Starts</span>
      <span style="font-size: 22px; font-weight: 800; letter-spacing: -0.02em; color: #ffffff;">2:00 pm</span>
    </div>
  </div>

  <!-- BODY -->
  <div style="flex-grow: 1; display: flex; flex-direction: column; padding: 14px 16px 0 16px; overflow: hidden;">

    <!-- WHERE YOU ARE · 48px status strip -->
    <div style="height: 48px; flex-shrink: 0; border-radius: 14px; background: #e8f6ed; border: 1px solid #a8ddbc; display: flex; align-items: center; gap: 10px; padding: 0 14px; margin-bottom: 18px;">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#0e7c3a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M4.5 18.5h15"></path><path d="M6.5 18.5v-5.2l5.5-4.2 5.5 4.2v5.2"></path><path d="M12 9.1V4.4"></path><circle cx="12" cy="3.3" r="1.3"></circle></svg>
      <span style="font-size: 15px; font-weight: 700; color: #0e7c3a;">You are on site</span>
    </div>

    <!-- ══ THE PRIMARY TASK ══ -->
    <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #756c5e; margin-bottom: 8px;">Start code</span>

    <div style="height: 64px; flex-shrink: 0; border-radius: 16px; background: #ffffff; border: 2px solid #d3ccc0; display: flex; align-items: center; justify-content: center; margin-bottom: 8px;">
      <span style="font-size: 34px; font-weight: 800; letter-spacing: 0.28em; color: #00112e; padding-left: 0.28em;">4821</span>
    </div>

    <span style="font-size: 13px; font-weight: 500; line-height: 1.45; color: #453f37; margin-bottom: 14px;">Ask the customer to read out their four&#8209;digit code.</span>

    <!-- PRIMARY ACTION · 64px, filled, verb -->
    <div style="height: 64px; flex-shrink: 0; border-radius: 16px; background: #0e7c3a; box-shadow: 0 3px 0 #0a5c2b; display: flex; align-items: center; justify-content: center; gap: 12px;">
      <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v9"></path><path d="M18.4 6.6a9 9 0 1 1-12.8 0"></path></svg>
      <span style="font-size: 19px; font-weight: 700; color: #ffffff;">Start work</span>
    </div>

    <!-- SEPARATION · this is where the two look-alikes used to sit -->
    <div style="height: 1px; flex-shrink: 0; background: #e7e2da; margin: 22px 0 18px 0;"></div>

    <!-- SECONDARY · 60px, outlined, verb + consequence -->
    <div style="min-height: 60px; flex-shrink: 0; border-radius: 14px; background: #ffffff; border: 1px solid #d3ccc0; display: flex; align-items: center; gap: 12px; padding: 10px 14px; margin-bottom: 12px;">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#8a5200" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.4v5.6"></path><path d="M12 16.4v.1"></path></svg>
      <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 16px; font-weight: 700; color: #00112e;">Nobody is here</span>
        <span style="font-size: 12px; font-weight: 500; color: #756c5e;">Starts a paid wait. You keep the job.</span>
      </div>
    </div>

    <!-- DESTRUCTIVE · 60px, outlined danger, always last -->
    <div style="min-height: 60px; flex-shrink: 0; border-radius: 14px; background: #fdecea; border: 1px solid #f4b8b3; display: flex; align-items: center; gap: 12px; padding: 10px 14px;">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#b3261e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg>
      <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 16px; font-weight: 700; color: #b3261e;">Hand this job back</span>
        <span style="font-size: 12px; font-weight: 500; color: #b3261e; opacity: 0.85;">You give up the job. No penalty.</span>
      </div>
    </div>

  </div>

  <!-- BOTTOM TAB BAR -->
  <div style="height: 56px; flex-shrink: 0; background: #ffffff; border-top: 1px solid #e7e2da; display: flex;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;">
      <div style="width: 48px; height: 28px; display: grid; place-items: center;">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#756c5e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 20.5h17"></path><path d="M5.5 20.5V9.2h13v11.3"></path><path d="M4 9.2 12 3.4l8 5.8"></path><path d="M9.6 20.5v-5.2h4.8v5.2"></path></svg>
      </div>
      <span style="font-size: 10px; font-weight: 600; color: #756c5e;">Home</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;">
      <div style="width: 48px; height: 28px; border-radius: 14px; background: #eef2fb; display: grid; place-items: center;">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#00246b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="8.5" width="19" height="11.5" rx="2"></rect><path d="M8 8.5V6.8A2.3 2.3 0 0 1 10.3 4.5h3.4A2.3 2.3 0 0 1 16 6.8v1.7"></path><path d="M2.5 13.5h19"></path></svg>
      </div>
      <span style="font-size: 10px; font-weight: 700; color: #00246b;">Work</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;">
      <div style="width: 48px; height: 28px; display: grid; place-items: center;">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#756c5e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2.2"></rect><circle cx="12" cy="12" r="3"></circle></svg>
      </div>
      <span style="font-size: 10px; font-weight: 600; color: #756c5e;">Money</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;">
      <div style="width: 48px; height: 28px; display: grid; place-items: center;">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#756c5e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.8"></circle><path d="M4.5 21c0-4 3.4-7 7.5-7s7.5 3 7.5 7"></path></svg>
      </div>
      <span style="font-size: 10px; font-weight: 600; color: #756c5e;">Me</span>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
