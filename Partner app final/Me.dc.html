<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: "Plus Jakarta Sans", system-ui, sans-serif; }
    a { color: #a94900; } a:hover { color: #8a3a00; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 360px; height: 800px; background: #faf8f5; display: flex; flex-direction: column; overflow: hidden; color: #00112e;">

  <!-- TOP BAR -->
  <div style="height: 56px; flex-shrink: 0; background: #ffffff; border-bottom: 1px solid #e7e2da; display: flex; align-items: center; justify-content: space-between; padding: 0 16px;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <div style="width: 26px; height: 26px; border-radius: 7px; background: #f87000; display: grid; place-items: center;">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#00112e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 2.5 5 13.5h6l-1.5 8 9.5-11.5h-6z"></path></svg>
      </div>
      <span style="font-size: 14px; font-weight: 600; color: #453f37;">Partner</span>
    </div>
    <div style="width: 44px; height: 44px; display: grid; place-items: center;">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#453f37" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8.5a6 6 0 0 0-12 0c0 6-2.5 7.5-2.5 7.5h17S18 14.5 18 8.5z"></path><path d="M13.7 20a2 2 0 0 1-3.4 0"></path></svg>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; overflow: hidden;">

    <!-- IDENTITY BAND · navy, rounded bottom -->
    <div style="flex-shrink: 0; background: linear-gradient(160deg, #00246b 0%, #00112e 100%); border-radius: 0 0 24px 24px; padding: 22px 16px 24px 16px; display: flex; flex-direction: column; align-items: center; gap: 12px;">
      <div style="width: 88px; height: 88px; border-radius: 28px; background: linear-gradient(150deg, #7d9ad6 0%, #2551a3 100%); display: grid; place-items: center; box-shadow: 0 4px 12px rgb(0 17 46 / 0.28);">
        <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.8"></circle><path d="M4.5 21c0-4 3.4-7 7.5-7s7.5 3 7.5 7"></path></svg>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 3px;">
        <span style="font-size: 20px; font-weight: 700; color: #ffffff;">Ramesh Kumar</span>
        <span style="font-size: 13px; font-weight: 500; color: #b0c2e8;">Electrician · VSH&#8209;0421</span>
      </div>
    </div>

    <div style="flex-grow: 1; display: flex; flex-direction: column; padding: 16px 16px 0 16px; overflow: hidden;">

      <!-- PRESENCE -->
      <div style="height: 56px; flex-shrink: 0; border-radius: 14px; background: #ffffff; border: 1px solid #e7e2da; display: flex; align-items: center; gap: 10px; padding: 0 14px; margin-bottom: 18px;">
        <span style="width: 10px; height: 10px; border-radius: 50%; background: #0e7c3a; flex-shrink: 0;"></span>
        <span style="flex-grow: 1; font-size: 15px; font-weight: 600;">You are taking work</span>
        <span style="width: 52px; height: 30px; border-radius: 15px; background: #0e7c3a; display: flex; align-items: center; justify-content: flex-end; padding: 3px;">
          <span style="width: 24px; height: 24px; border-radius: 50%; background: #ffffff;"></span>
        </span>
      </div>

      <!-- TILE ROW · icon AND label · 104px -->
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 16px;">
        <div style="height: 104px; border-radius: 18px; background: #ffffff; border: 1px solid #e7e2da; box-shadow: 0 1px 3px rgb(69 63 55 / 0.08); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;">
          <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="#00246b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.4"></circle><path d="M2.5 20.5c0-3.6 2.9-6.2 6.5-6.2s6.5 2.6 6.5 6.2"></path><path d="M16.5 5.6a3.4 3.4 0 0 1 0 6.6"></path><path d="M17.6 14.8c2.3.7 3.9 2.9 3.9 5.7"></path></svg>
          <span style="font-size: 13px; font-weight: 700; color: #00112e;">Crew</span>
        </div>
        <div style="height: 104px; border-radius: 18px; background: #ffffff; border: 1px solid #e7e2da; box-shadow: 0 1px 3px rgb(69 63 55 / 0.08); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;">
          <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="#00246b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8.5z"></path><path d="M13.5 3v5.5H19"></path><path d="M8.6 13.4h6.8"></path><path d="M8.6 16.8h4.4"></path></svg>
          <span style="font-size: 13px; font-weight: 700; color: #00112e;">Money</span>
        </div>
        <div style="height: 104px; border-radius: 18px; background: #fff4ec; border: 1px solid #ffc4a0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;">
          <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="#8a5200" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M3.2 9.5h17.6"></path><path d="M3.2 14.5h17.6"></path><path d="M12 3a14 14 0 0 1 0 18"></path><path d="M12 3a14 14 0 0 0 0 18"></path></svg>
          <span style="font-size: 13px; font-weight: 700; color: #8a5200;">Language</span>
        </div>
      </div>

      <!-- PROFILE ROW · 60px -->
      <div style="height: 60px; flex-shrink: 0; border-radius: 14px; background: #ffffff; border: 1px solid #e7e2da; display: flex; align-items: center; gap: 12px; padding: 0 14px;">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#00246b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><circle cx="12" cy="8" r="3.8"></circle><path d="M4.5 21c0-4 3.4-7 7.5-7s7.5 3 7.5 7"></path></svg>
        <span style="flex-grow: 1; font-size: 16px; font-weight: 600;">Your profile</span>
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#a89f90" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5.5 15.5 12 9 18.5"></path></svg>
      </div>

      <!-- SEPARATION before the session-ending control -->
      <div style="height: 1px; flex-shrink: 0; background: #e7e2da; margin: 20px 0;"></div>

      <!-- SIGN OUT · own row, POWER glyph (never the back arrow), 56px -->
      <div style="height: 56px; flex-shrink: 0; border-radius: 14px; background: #ffffff; border: 1px solid #f4b8b3; display: flex; align-items: center; justify-content: center; gap: 10px;">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#b3261e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v9"></path><path d="M18.4 6.6a9 9 0 1 1-12.8 0"></path></svg>
        <span style="font-size: 16px; font-weight: 700; color: #b3261e;">Sign out</span>
      </div>

    </div>
  </div>

  <!-- BOTTOM TAB BAR -->
  <div style="height: 56px; flex-shrink: 0; background: #ffffff; border-top: 1px solid #e7e2da; display: flex;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;">
      <div style="width: 48px; height: 28px; display: grid; place-items: center;">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#756c5e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 20.5h17"></path><path d="M5.5 20.5V9.2h13v11.3"></path><path d="M4 9.2 12 3.4l8 5.8"></path><path d="M9.6 20.5v-5.2h4.8v5.2"></path></svg>
      </div>
      <span style="font-size: 10px; font-weight: 600; color: #756c5e;">Home</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;">
      <div style="width: 48px; height: 28px; display: grid; place-items: center;">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#756c5e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="8.5" width="19" height="11.5" rx="2"></rect><path d="M8 8.5V6.8A2.3 2.3 0 0 1 10.3 4.5h3.4A2.3 2.3 0 0 1 16 6.8v1.7"></path><path d="M2.5 13.5h19"></path></svg>
      </div>
      <span style="font-size: 10px; font-weight: 600; color: #756c5e;">Work</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;">
      <div style="width: 48px; height: 28px; display: grid; place-items: center;">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#756c5e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2.2"></rect><circle cx="12" cy="12" r="3"></circle></svg>
      </div>
      <span style="font-size: 10px; font-weight: 600; color: #756c5e;">Money</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;">
      <div style="width: 48px; height: 28px; border-radius: 14px; background: #eef2fb; display: grid; place-items: center;">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#00246b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.8"></circle><path d="M4.5 21c0-4 3.4-7 7.5-7s7.5 3 7.5 7"></path></svg>
      </div>
      <span style="font-size: 10px; font-weight: 700; color: #00246b;">Me</span>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
