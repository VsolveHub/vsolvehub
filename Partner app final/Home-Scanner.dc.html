<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: "Plus Jakarta Sans", system-ui, sans-serif; }
    a { color: #a94900; } a:hover { color: #8a3a00; }
    * { box-sizing: border-box; }

    /* The beam crosses the scene in 3.2s, then rests for 0.8s before the next
       pass. The rest is what stops it reading as a progress bar: a loading bar
       never pauses, a radar sweep does. */
    @keyframes sweep {
      0%       { transform: translateX(-40px); opacity: 0; }
      6%       { opacity: 1; }
      74%      { opacity: 1; }
      80%, 100% { transform: translateX(336px); opacity: 0; }
    }
    /* Each building lights as the beam reaches it, then fades behind it. */
    @keyframes glint {
      0%, 100% { opacity: 0.16; }
      6%       { opacity: 1; }
      22%      { opacity: 0.16; }
    }
    @keyframes gridpan { to { background-position: 40px 0; } }
    @keyframes breathe { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.5); opacity: 0; } }
    @keyframes dots { 0%, 20% { opacity: 0; } 40%, 100% { opacity: 1; } }

    .beam  { animation: sweep 4s linear infinite; }
    .b     { animation: glint 4s linear infinite; }
    .grid  { animation: gridpan 6s linear infinite; }
    .halo  { animation: breathe 2.4s ease-out infinite; }
    .d1    { animation: dots 1.4s steps(1) infinite; }
    .d2    { animation: dots 1.4s steps(1) infinite .35s; }
    .d3    { animation: dots 1.4s steps(1) infinite .7s; }

    @media (prefers-reduced-motion: reduce) {
      .beam, .b, .grid, .halo, .d1, .d2, .d3 { animation: none; opacity: 1; }
      .beam { display: none; }
    }
  </style>
</helmet>

<div style="width: 360px; height: 800px; background: #faf8f5; display: flex; flex-direction: column; overflow: hidden; color: #00112e;">

  <!-- TOP BAR -->
  <div style="height: 56px; flex-shrink: 0; background: #ffffff; border-bottom: 1px solid #e7e2da; display: flex; align-items: center; justify-content: space-between; padding: 0 16px;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <div style="width: 26px; height: 26px; border-radius: 7px; background: #f87000; display: grid; place-items: center;">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#00112e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 2.5 5 13.5h6l-1.5 8 9.5-11.5h-6z"></path></svg>
      </div>
      <span style="font-size: 14px; font-weight: 600; color: #453f37;">Partner</span>
    </div>
    <div style="width: 44px; height: 44px; display: grid; place-items: center;">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#453f37" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8.5a6 6 0 0 0-12 0c0 6-2.5 7.5-2.5 7.5h17S18 14.5 18 8.5z"></path><path d="M13.7 20a2 2 0 0 1-3.4 0"></path></svg>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 12px; padding: 12px 16px 0 16px; overflow: hidden;">

    <!-- STATUS ROW · live dot with a breathing halo -->
    <div style="flex-shrink: 0; height: 52px; border-radius: 14px; background: #ffffff; border: 1px solid #e7e2da; display: flex; align-items: center; gap: 12px; padding: 0 14px;">
      <span style="position: relative; width: 10px; height: 10px; flex-shrink: 0;">
        <span class="halo" style="position: absolute; inset: 0; border-radius: 50%; background: #0e7c3a;"></span>
        <span style="position: absolute; inset: 0; border-radius: 50%; background: #0e7c3a;"></span>
      </span>
      <span style="flex-grow: 1; font-size: 15px; font-weight: 700;">Taking work</span>
      <span style="font-size: 12px; font-weight: 600; color: #756c5e;">4h 12m</span>
      <div style="height: 34px; border-radius: 10px; border: 1px solid #d3ccc0; display: grid; place-items: center; padding: 0 12px; font-size: 13px; font-weight: 700; color: #453f37;">Stop</div>
    </div>

    <!-- ══ THE SCANNER · the hero ══ -->
    <div style="position: relative; flex-shrink: 0; height: 236px; border-radius: 18px; overflow: hidden; background: linear-gradient(165deg, #00246b 0%, #00112e 100%); box-shadow: 0 8px 24px rgb(0 17 46 / 0.22);">

      <!-- drifting map grid -->
      <div class="grid" style="position: absolute; inset: 0; opacity: 0.5; background-image: linear-gradient(#7d9ad6 1px, transparent 1px), linear-gradient(90deg, #7d9ad6 1px, transparent 1px); background-size: 40px 40px; mask-image: linear-gradient(180deg, transparent, #000 40%, #000 75%, transparent); -webkit-mask-image: linear-gradient(180deg, transparent, #000 40%, #000 75%, transparent);"></div>

      <!-- the ground: buildings the beam passes over -->
      <div style="position: absolute; left: 0; right: 0; bottom: 62px; height: 96px;">
        <svg viewBox="0 0 328 96" width="328" height="96" style="position: absolute; left: 16px; bottom: 0;" fill="none" stroke="#b0c2e8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <g class="b" style="animation-delay: 0.15s"><path d="M8 88V54l18-13 18 13v34"></path><path d="M20 88V72h12v16"></path></g>
          <g class="b" style="animation-delay: 0.62s"><rect x="60" y="40" width="34" height="48" rx="3"></rect><path d="M68 52h6M80 52h6M68 64h6M80 64h6"></path></g>
          <g class="b" style="animation-delay: 1.15s"><path d="M110 88V46l20-14 20 14v42"></path><path d="M124 88V70h12v18"></path></g>
          <g class="b" style="animation-delay: 1.68s"><rect x="164" y="30" width="30" height="58" rx="3"></rect><path d="M171 42h4M183 42h4M171 56h4M183 56h4M171 70h4M183 70h4"></path></g>
          <g class="b" style="animation-delay: 2.15s"><path d="M208 88V56l17-12 17 12v32"></path></g>
          <g class="b" style="animation-delay: 2.62s"><rect x="256" y="44" width="32" height="44" rx="3"></rect><path d="M264 56h5M277 56h5M264 70h5M277 70h5"></path></g>
        </svg>
      </div>

      <!-- the beam -->
      <div class="beam" style="position: absolute; top: 0; bottom: 56px; left: 0; width: 72px; background: linear-gradient(90deg, rgb(248 112 0 / 0) 0%, rgb(248 112 0 / 0.20) 55%, rgb(251 129 48 / 0.9) 92%, rgb(255 255 255 / 0.85) 100%); filter: blur(0.4px);"></div>

      <!-- label -->
      <div style="position: absolute; left: 0; right: 0; top: 18px; display: flex; flex-direction: column; align-items: center; gap: 5px;">
        <span style="display: inline-flex; align-items: center; gap: 2px; font-size: 10px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: #fb8130;">
          Scanning<span class="d1">.</span><span class="d2">.</span><span class="d3">.</span>
        </span>
        <span style="font-size: 19px; font-weight: 700; color: #ffffff;">Looking for work</span>
        <span style="display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; color: #b0c2e8;">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#b0c2e8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21.5s7-6 7-11.5a7 7 0 0 0-14 0c0 5.5 7 11.5 7 11.5z"></path><circle cx="12" cy="10" r="2.6"></circle></svg>
          near Kondapur
        </span>
      </div>

      <!-- footer strip inside the card -->
      <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 56px; background: rgb(0 17 46 / 0.55); border-top: 1px solid rgb(176 194 232 / 0.18); display: flex; align-items: center; gap: 10px; padding: 0 16px;">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#b0c2e8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M18 8.5a6 6 0 0 0-12 0c0 6-2.5 7.5-2.5 7.5h17S18 14.5 18 8.5z"></path><path d="M13.7 20a2 2 0 0 1-3.4 0"></path></svg>
        <span style="font-size: 12.5px; font-weight: 500; line-height: 1.35; color: #b0c2e8;">Keep your phone on — we will alert you the moment a job comes in.</span>
      </div>
    </div>

    <!-- TODAY -->
    <div style="flex-shrink: 0; display: flex; align-items: center; gap: 12px; border-radius: 14px; background: #ffffff; border: 1px solid #e7e2da; padding: 12px 14px;">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#f87000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><circle cx="12" cy="12" r="4.2"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="M4.9 4.9l1.4 1.4"></path><path d="M17.7 17.7l1.4 1.4"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="M4.9 19.1l1.4-1.4"></path><path d="M17.7 6.3l1.4-1.4"></path></svg>
      <div style="display: flex; flex-direction: column; gap: 1px;">
        <span style="font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #756c5e;">Earned today</span>
        <span style="font-size: 30px; font-weight: 800; line-height: 1; letter-spacing: -0.02em;">₹2,450</span>
      </div>
      <div style="margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; font-size: 12.5px; font-weight: 600; line-height: 1.3; color: #756c5e;">
        <span>3 jobs</span><span>finished</span>
      </div>
    </div>

    <!-- MONTH -->
    <div style="flex-shrink: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
      <div style="border-radius: 12px; background: #ffffff; border: 1px solid #e7e2da; padding: 9px 11px; display: flex; flex-direction: column; gap: 1px;">
        <span style="font-size: 16px; font-weight: 800; line-height: 1; letter-spacing: -0.02em;">₹48,200</span>
        <span style="font-size: 10.5px; font-weight: 600; color: #756c5e;">This month</span>
      </div>
      <div style="border-radius: 12px; background: #ffffff; border: 1px solid #e7e2da; padding: 9px 11px; display: flex; flex-direction: column; gap: 1px;">
        <span style="font-size: 16px; font-weight: 800; line-height: 1; letter-spacing: -0.02em;">18</span>
        <span style="font-size: 10.5px; font-weight: 600; color: #756c5e;">Jobs done</span>
      </div>
      <div style="border-radius: 12px; background: #ffffff; border: 1px solid #e7e2da; padding: 9px 11px; display: flex; flex-direction: column; gap: 1px;">
        <span style="font-size: 16px; font-weight: 800; line-height: 1; letter-spacing: -0.02em;">₹41,300</span>
        <span style="font-size: 10.5px; font-weight: 600; color: #756c5e;">Usual month</span>
      </div>
    </div>

  </div>

  <!-- TAB BAR -->
  <div style="height: 56px; flex-shrink: 0; background: #ffffff; border-top: 1px solid #e7e2da; display: flex;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;">
      <div style="width: 48px; height: 28px; border-radius: 14px; background: #eef2fb; display: grid; place-items: center;">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#00246b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 20.5h17"></path><path d="M5.5 20.5V9.2h13v11.3"></path><path d="M4 9.2 12 3.4l8 5.8"></path><path d="M9.6 20.5v-5.2h4.8v5.2"></path></svg>
      </div>
      <span style="font-size: 10px; font-weight: 700; color: #00246b;">Home</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;">
      <div style="width: 48px; height: 28px; display: grid; place-items: center;">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#756c5e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="8.5" width="19" height="11.5" rx="2"></rect><path d="M8 8.5V6.8A2.3 2.3 0 0 1 10.3 4.5h3.4A2.3 2.3 0 0 1 16 6.8v1.7"></path><path d="M2.5 13.5h19"></path></svg>
      </div>
      <span style="font-size: 10px; font-weight: 600; color: #756c5e;">Work</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;">
      <div style="width: 48px; height: 28px; display: grid; place-items: center;">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#756c5e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2.2"></rect><circle cx="12" cy="12" r="3"></circle></svg>
      </div>
      <span style="font-size: 10px; font-weight: 600; color: #756c5e;">Money</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;">
      <div style="width: 48px; height: 28px; display: grid; place-items: center;">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#756c5e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.8"></circle><path d="M4.5 21c0-4 3.4-7 7.5-7s7.5 3 7.5 7"></path></svg>
      </div>
      <span style="font-size: 10px; font-weight: 600; color: #756c5e;">Me</span>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
