<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: "Plus Jakarta Sans", system-ui, sans-serif; }
    a { color: #a94900; } a:hover { color: #8a3a00; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 360px; height: 800px; background: #faf8f5; display: flex; flex-direction: column; overflow: hidden; color: #00112e;">

  <!-- HEADER · navy, and the SERVICE NAME is the first line -->
  <div style="flex-shrink: 0; background: linear-gradient(160deg, #00246b 0%, #00112e 100%); padding: 12px 16px 16px 16px; display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <div style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 14px; background: rgb(255 255 255 / 0.13); display: grid; place-items: center;">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5.5 8.5 12 15 18.5"></path></svg>
      </div>
      <!-- No locality line: no enquiry field publishes one. WorkItem.areaLabel
           is null for every enquiry, so a placeholder here would be an invented
           fact on the screen a vendor uses to decide whether to travel. -->
      <span style="flex-grow: 1; min-width: 0; font-size: 19px; font-weight: 700; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Shop fit-out</span>
      <span style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 14px; background: linear-gradient(150deg, #7d9ad6 0%, #2551a3 100%); display: grid; place-items: center;">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8.5a6 6 0 0 0-12 0c0 6-2.5 7.5-2.5 7.5h17S18 14.5 18 8.5z"></path><path d="M13.7 20a2 2 0 0 1-3.4 0"></path></svg>
      </span>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; padding: 14px 16px 0 16px; overflow: hidden;">

    <!-- DEADLINE · 60px, orange because a clock is running -->
    <div style="height: 60px; flex-shrink: 0; border-radius: 14px; background: #fff4ec; border: 1px solid #ffc4a0; display: flex; align-items: center; gap: 12px; padding: 0 14px; margin-bottom: 18px;">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#a94900" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5.2l3.4 2"></path></svg>
      <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px;">
        <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #a94900;">Answer by</span>
        <span style="font-size: 17px; font-weight: 700; color: #00112e;">Today, 6:00 pm</span>
      </div>
    </div>

    <!-- FACT GRID -->
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 20px;">
      <div style="height: 76px; border-radius: 14px; background: #ffffff; border: 1px solid #e7e2da; display: flex; align-items: center; gap: 10px; padding: 0 14px;">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#00246b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><rect x="3" y="5" width="18" height="16" rx="2.4"></rect><path d="M8 2.8v4"></path><path d="M16 2.8v4"></path><path d="M3 10h18"></path></svg>
        <div style="min-width: 0; display: flex; flex-direction: column;">
          <span style="font-size: 20px; font-weight: 800; line-height: 1.1;">12 Sep</span>
          <span style="font-size: 12px; font-weight: 600; color: #756c5e;">they want to start</span>
        </div>
      </div>
      <div style="height: 76px; border-radius: 14px; background: #ffffff; border: 1px solid #e7e2da; display: flex; align-items: center; gap: 10px; padding: 0 14px;">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#00246b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M3.5 20.5h17"></path><path d="M5.5 20.5V9.2h13v11.3"></path><path d="M4 9.2 12 3.4l8 5.8"></path><path d="M8.6 13.2h2.6"></path><path d="M12.8 13.2h2.6"></path></svg>
        <div style="min-width: 0; display: flex; flex-direction: column;">
          <span style="font-size: 20px; font-weight: 800; line-height: 1.1;">Shop</span>
          <span style="font-size: 12px; font-weight: 600; color: #756c5e;">property</span>
        </div>
      </div>
    </div>

    <!-- WHAT THEY ASKED FOR · the customer's own words, legitimately prose -->
    <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #756c5e; margin-bottom: 8px;">What they asked for</span>
    <div style="flex-shrink: 0; border-radius: 14px; background: #ffffff; border: 1px solid #e7e2da; padding: 14px; margin-bottom: 20px;">
      <span style="font-size: 15px; font-weight: 400; line-height: 1.55; color: #453f37;">Full interior fit-out for a 400 sq&nbsp;ft clothing shop. Needs wiring, false ceiling, flooring and display counters.</span>
    </div>

    <!-- DECISION -->
    <div style="height: 72px; flex-shrink: 0; border-radius: 18px; background: #0e7c3a; box-shadow: 0 3px 0 #0a5c2b; display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 10px;">
      <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5 9.5 17.5 19.5 6.5"></path></svg>
      <span style="font-size: 20px; font-weight: 700; color: #ffffff;">Accept</span>
    </div>

    <div style="height: 56px; flex-shrink: 0; border-radius: 14px; background: #ffffff; border: 1px solid #d3ccc0; display: flex; align-items: center; justify-content: center; gap: 10px;">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#756c5e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg>
      <span style="font-size: 16px; font-weight: 700; color: #453f37;">Decline</span>
    </div>

  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
