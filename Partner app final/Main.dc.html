<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: "Plus Jakarta Sans", system-ui, sans-serif; }
    a { color: #a94900; } a:hover { color: #8a3a00; }
    * { box-sizing: border-box; }
    @keyframes vsh-ping { 0% { transform: scale(0.3); opacity: 0.55; } 80%, 100% { transform: scale(1); opacity: 0; } }
    .ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid #ffc4a0; opacity: 0; animation: vsh-ping 2.8s ease-out infinite; }
    @media (prefers-reduced-motion: reduce) { .ring { animation: none; opacity: 1; } }
  </style>
</helmet>

<div style="width: 360px; height: 800px; background: linear-gradient(180deg, #fdfcfa 0%, #faf8f5 100%); display: flex; flex-direction: column; overflow: hidden; color: #00112e;">

  <!-- TOP BAR · 56px -->
  <div style="height: 56px; flex-shrink: 0; background: #ffffff; border-bottom: 1px solid #e7e2da; display: flex; align-items: center; justify-content: space-between; padding: 0 16px;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <div style="width: 26px; height: 26px; border-radius: 7px; background: #f87000; display: grid; place-items: center;">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#00112e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 2.5 5 13.5h6l-1.5 8 9.5-11.5h-6z"></path></svg>
      </div>
      <span style="font-size: 14px; font-weight: 600; color: #453f37;">Partner</span>
    </div>
    <div style="width: 44px; height: 44px; display: grid; place-items: center; position: relative;">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#453f37" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8.5a6 6 0 0 0-12 0c0 6-2.5 7.5-2.5 7.5h17S18 14.5 18 8.5z"></path><path d="M13.7 20a2 2 0 0 1-3.4 0"></path></svg>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 14px; padding: 14px 16px 0 16px; overflow: hidden;">

    <!-- ══ 1 · AVAILABILITY — first, because an offline vendor has one job here ══ -->
    <div style="flex-shrink: 0; border-radius: 14px; background: #ffffff; border: 1px solid #e7e2da; padding: 12px 14px; display: flex; align-items: center; gap: 12px;">
      <span style="width: 10px; height: 10px; border-radius: 50%; background: #0e7c3a; flex-shrink: 0; box-shadow: 0 0 0 4px rgb(14 124 58 / 0.14);"></span>
      <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px;">
        <span style="font-size: 15px; font-weight: 700;">Taking work</span>
        <span style="font-size: 12px; font-weight: 500; color: #756c5e;">Kondapur · since 8:02 am</span>
      </div>
      <div style="height: 36px; border-radius: 10px; border: 1px solid #d3ccc0; display: grid; place-items: center; padding: 0 12px; font-size: 13px; font-weight: 700; color: #453f37;">Go offline</div>
    </div>

    <!-- ══ 2 · EARNED TODAY ══ -->
    <div style="flex-shrink: 0; border-radius: 14px; background: linear-gradient(160deg, #00246b 0%, #00112e 100%); padding: 14px; display: flex; align-items: center; gap: 12px; box-shadow: 0 1px 3px rgb(69 63 55 / 0.08);">
      <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="#fb8130" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><circle cx="12" cy="12" r="4.2"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="M4.9 4.9l1.4 1.4"></path><path d="M17.7 17.7l1.4 1.4"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="M4.9 19.1l1.4-1.4"></path><path d="M17.7 6.3l1.4-1.4"></path></svg>
      <div style="display: flex; flex-direction: column; gap: 1px;">
        <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #b0c2e8;">Earned today</span>
        <span style="font-size: 32px; font-weight: 800; line-height: 1; letter-spacing: -0.02em; color: #ffffff;">₹2,450</span>
      </div>
      <div style="margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; font-size: 13px; font-weight: 600; line-height: 1.3; color: #b0c2e8;">
        <span>3 jobs</span><span>finished</span>
      </div>
    </div>

    <!-- ══ 3 · THE ONLY ANALYTICS THAT BELONG HERE ══ -->
    <div style="flex-shrink: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
      <div style="border-radius: 14px; background: #ffffff; border: 1px solid #e7e2da; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 17px; font-weight: 800; line-height: 1; letter-spacing: -0.02em;">₹48,200</span>
        <span style="font-size: 11px; font-weight: 600; color: #756c5e;">This month</span>
      </div>
      <div style="border-radius: 14px; background: #ffffff; border: 1px solid #e7e2da; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 17px; font-weight: 800; line-height: 1; letter-spacing: -0.02em;">18</span>
        <span style="font-size: 11px; font-weight: 600; color: #756c5e;">Jobs done</span>
      </div>
      <div style="border-radius: 14px; background: #ffffff; border: 1px solid #e7e2da; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 17px; font-weight: 800; line-height: 1; letter-spacing: -0.02em;">₹41,300</span>
        <span style="font-size: 11px; font-weight: 600; color: #756c5e;">Usual month</span>
      </div>
    </div>

    <!-- ══ 4 · THE WAITING STATE — the screen a vendor sees most ══ -->
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 8px 0;">
      <div style="position: relative; width: 168px; height: 168px; display: grid; place-items: center;">
        <span class="ring"></span>
        <span class="ring" style="animation-delay: 0.93s;"></span>
        <span class="ring" style="animation-delay: 1.86s;"></span>
        <span style="position: relative; width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(150deg, #2551a3, #001a4e); display: grid; place-items: center; box-shadow: 0 4px 12px rgb(69 63 55 / 0.1);">
          <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="8.5" width="19" height="11.5" rx="2"></rect><path d="M8 8.5V6.8A2.3 2.3 0 0 1 10.3 4.5h3.4A2.3 2.3 0 0 1 16 6.8v1.7"></path><path d="M2.5 13.5h19"></path><path d="M10 13.5v2.4h4v-2.4"></path></svg>
        </span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; max-width: 26ch;">
        <span style="font-size: 18px; font-weight: 700;">Looking for work near you</span>
        <span style="font-size: 14px; line-height: 1.5; color: #453f37;">Keep this app installed and your phone on. We will alert you the moment a job comes in.</span>
      </div>
    </div>

  </div>

  </div>

  <!-- BOTTOM TAB BAR -->
  <div style="height: 56px; flex-shrink: 0; background: #ffffff; border-top: 1px solid #e7e2da; display: flex;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;">
      <div style="width: 48px; height: 28px; border-radius: 14px; background: #eef2fb; display: grid; place-items: center;">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#00246b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 20.5h17"></path><path d="M5.5 20.5V9.2h13v11.3"></path><path d="M4 9.2 12 3.4l8 5.8"></path><path d="M9.6 20.5v-5.2h4.8v5.2"></path></svg>
      </div>
      <span style="font-size: 10px; font-weight: 700; color: #00246b;">Home</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;">
      <div style="width: 48px; height: 28px; display: grid; place-items: center;">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#756c5e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="8.5" width="19" height="11.5" rx="2"></rect><path d="M8 8.5V6.8A2.3 2.3 0 0 1 10.3 4.5h3.4A2.3 2.3 0 0 1 16 6.8v1.7"></path><path d="M2.5 13.5h19"></path></svg>
      </div>
      <span style="font-size: 10px; font-weight: 600; color: #756c5e;">Work</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;">
      <div style="width: 48px; height: 28px; display: grid; place-items: center;">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#756c5e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2.2"></rect><circle cx="12" cy="12" r="3"></circle></svg>
      </div>
      <span style="font-size: 10px; font-weight: 600; color: #756c5e;">Money</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;">
      <div style="width: 48px; height: 28px; display: grid; place-items: center;">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#756c5e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.8"></circle><path d="M4.5 21c0-4 3.4-7 7.5-7s7.5 3 7.5 7"></path></svg>
      </div>
      <span style="font-size: 10px; font-weight: 600; color: #756c5e;">Me</span>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
