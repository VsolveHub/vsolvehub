overrides:
  react-native-gesture-handler: "2.32.0"

packageExtensions:
  react-native-css-interop:
    dependencies:
      connect: "^3.7.0"

packages:
  - "apps/*"
  - "packages/*"
  - "mobile/apps/*"
  - "mobile/packages/*"

# The Windows npm-registry path can sustain large downloads but has high
# latency and low throughput. Next, SWC, and Turbo ship large platform
# tarballs, so keep concurrency modest and allow an active download to finish
# instead of aborting it after the default request window.
networkConcurrency: 4
fetchRetries: 5
fetchRetryMintimeout: 10000
fetchRetryMaxtimeout: 60000
fetchTimeout: 600000

autoInstallPeers: true
strictPeerDependencies: false

allowBuilds:
  '@firebase/util': true
  '@parcel/watcher': true
  esbuild: true
  # msw's postinstall only prints a CLI notice. The browser service worker is
  # created per-app with `msw init <app>/public`, so no build step is needed.
  msw: false
  protobufjs: true
  sharp: true
  # eslint-import-resolver-typescript uses this N-API package; its postinstall
  # selects and verifies the platform-specific resolver binding.
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@expo/cli@58.1.19'
  - '@expo/config-plugins@58.0.12'
  - '@expo/config@58.0.11'
  - '@expo/env@2.5.4'
  - '@expo/fingerprint@0.21.9'
  - '@expo/inline-modules@0.2.9'
  - '@expo/local-build-cache-provider@58.0.11'
  - '@expo/log-box@58.0.15'
  - '@expo/metro-config@58.0.21'
  - '@expo/prebuild-config@58.0.19'
  - '@expo/router-server@58.0.21'
  - babel-preset-expo@58.0.24
  - expo-asset@58.0.20
  - expo-constants@58.0.15
  - expo-modules-autolinking@58.0.17
  - expo-modules-core@58.0.30
  - expo-modules-jsi@58.0.22
  - expo@58.0.23
  - expo-linking@58.0.16
  - expo-notifications@58.1.8
  - expo-router@58.0.30
  - expo-splash-screen@58.0.13
  - expo-updates@58.0.21
  - jest-expo@58.0.14
  - react-native-safe-area-context@5.11.1
